      # 2026-09-22 run 35752188098 finding: this step previously referenced $GITHUB_STEP_SUMMARY
      # unguarded. wsl-bash's shell evaluates with -u in effect, so on a fresh WSL2 install where
      # the env-file vars are not propagated in (see the header's D1 point 3 and the wsl2-probe
      # job's Probe A), an unset reference aborts the script immediately -- before the `|| echo`
      # fallback below ever runs. The `${VAR:-}` guard here (and on every other $GITHUB_OUTPUT /
      # $GITHUB_ENV / $GITHUB_STEP_SUMMARY reference in this file) turns that abort into an
      # ordinary failed redirect, which the fallback then reports instead of the job dying with no
      # verdict at all.
      - name: Write step summary
        if: always()
        shell: wsl-bash {0}
        run: |
          set -uo pipefail
          {
            echo "### build (windows-2025, WSL2)"
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| lake build | ${{ steps.lake_build.outcome }} |"
            echo "| cargo test | ${{ steps.cargo_test.outcome }} |"
            echo "| check.sh --core-only | ${{ steps.core_precheck.outcome }} |"
            echo "| approvals | ${{ steps.test_approvals.outcome }} |"
            echo "| certificate-identity | ${{ steps.test_certificate_identity.outcome }} |"
            echo "| adopt-recheck | ${{ steps.test_adopt_recheck.outcome }} |"
            echo "| ladder | ${{ steps.test_ladder.outcome }} |"
            echo "| layer | ${{ steps.test_layer.outcome }} |"
            echo "| spdx | ${{ steps.test_spdx.outcome }} |"
            echo "| ci-docs-coherence | ${{ steps.test_ci_docs_coherence.outcome }} |"
            echo "| aeneas-revs | ${{ steps.test_aeneas_revs.outcome }} |"
            echo "| recheck-revs | ${{ steps.test_recheck_revs.outcome }} |"
            echo "| recheck-record | ${{ steps.test_recheck_record.outcome }} |"
            echo "| full-gate | ${{ steps.test_full_gate.outcome }} |"
            echo "| bump-pin | ${{ steps.test_bump_pin.outcome }} |"
            echo "| lean-toolchain-pin | ${{ steps.test_lean_toolchain_pin.outcome }} |"
            echo "| cert-freshness | ${{ steps.test_cert_freshness.outcome }} |"
            echo "| landrun-shim | ${{ steps.test_landrun_shim.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY:-}" 2>/dev/null || echo "GITHUB_STEP_SUMMARY unwritable from WSL2 in this job; per-step outcomes are still visible in the Actions UI."
