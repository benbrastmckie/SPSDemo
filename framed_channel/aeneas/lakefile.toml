# Lake project for the Aeneas bridge of the framed_channel worked example.
#
# Unlike ../lean (core Lean only, no network), this package requires the Aeneas Lean library,
# which requires Mathlib: the first build fetches roughly 7 GB and needs network access. It is
# therefore a separate package, which `../check.sh` builds and audits on every gate run;
# `--core-only` leaves it out and ends INCOMPLETE (not the verification claim).
#
# Three pins must agree, and `../scripts/lib/aeneas-revs.sh` checks all three before any
# extraction or gate run:
# * `lean-toolchain` here equals `../lean/lean-toolchain` (one toolchain, so the bridge imports
#   the hand-written `FramedChannel.Model.*` modules and Lake reuses `../lean/.lake/build`);
# * the aeneas `rev` below equals `.nodes.aeneas.locked.rev` in the repository root's
#   `flake.lock`, equals `rev` in the repository root's `nix/aeneas-pin.json` (the source of the
#   prebuilt charon/aeneas binaries `nix develop` puts on PATH), and is the revision
#   `aeneas -version` reports there.

name = "framed_channel_aeneas"
license = "Apache-2.0"
defaultTargets = ["FramedChannelAeneas"]

[leanOptions]
autoImplicit = false

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "12a018bb0fab3333be572dadc0eab5108758552b"
subDir = "backends/lean"

[[require]]
name = "framed_channel"
path = "../lean"

# `FramedChannelAeneas/Extracted/Types.lean` and `Funs.lean` are GENERATED by
# `../scripts/refresh-extraction.sh` and never hand-edited; `Extracted/FunsExternal.lean` (the crate's
# trusted library models) and everything under `FramedChannelAeneas/Bridge/` (the trait
# assumptions, the queue simulation and transport theorems, and each component's abstraction
# function and refinement theorems) are hand-written.
[[lean_lib]]
name = "FramedChannelAeneas"
globs = ["FramedChannelAeneas.+"]

# The bridge package's statement-only specification (Challenge) library: one module per component
# (plus `Queue` for the generic queue transport and the trait assumption), each restating its
# registered theorems of `FramedChannelAeneas/Registry.lean` with `:= sorry`, in the form
# Comparator consumes as a Challenge. NOT a default target, imported by nothing in
# `FramedChannelAeneas`; `../check.sh` builds it into its own log (see ../lean/lakefile.toml).
[[lean_lib]]
name = "FramedChannelAeneasChallenge"
globs = ["FramedChannelAeneasChallenge.*"]
