# Certificate manifest for the zigzag signed-varint codec. Every claim line carries one of the fixed
# honesty tags; see README.md in this directory for the tag vocabulary. Generated values (axiom
# lines, digests, the certificate identity) are read from axioms.txt and digests.txt, which
# check.sh regenerates.
#
# READ THIS FIRST. This unit exists to exercise the codec interface at a second value type and, more
# importantly, to be DEFINED OVER an existing unit rather than beside it: both of the model's laws
# and two of the bridge's four headline theorems are retrieved from the LEB128 codec's own
# CodecLaws instance and refinement theorems, not re-derived. See the ladder: and findings: blocks.

component: Zigzag

source:
  file: rust/src/zigzag.rs
  symbol: "zigzag, unzigzag, encode_i32, decode_i32"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction, the whole-crate extraction described in ring_buffer.yaml; the four functions are output as zigzag.zigzag / zigzag.unzigzag / zigzag.encode_i32 / zigzag.decode_i32 in aeneas/FramedChannelAeneas/Extracted/Funs.lean (generated, never hand-edited). This is the first unit of the crate to use a SIGNED machine integer: Charon and Aeneas translate i32 and its arithmetic shift and xor into Aeneas's signed scalar model with NO new external name, so Extracted/FunsExternal.lean is byte-unchanged and no library model was added"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.Zigzag.zigzag
    - FramedChannel.Zigzag.unzigzag
    - FramedChannel.Zigzag.encode
    - FramedChannel.Zigzag.decode
  module: "lean/FramedChannel/Model/Zigzag/Defs.lean (definitions) and lean/FramedChannel/Model/Zigzag/Theorems.lean (theorems)"
  representation: "the signed value as Int and the zigzag image as Nat; the map stated ARITHMETICALLY (2 * n on the non-negatives, -2 * n - 1 on the negatives) rather than as a bit-vector expression, which is what keeps every core proof on the grind rung and every countermodel search kernel-decodable. encode and decode are spelled through CodecModel.encode / CodecModel.decode at C := Varint.Leb128 -- a projection applied to an instance, deliberately, not Varint.encode / Varint.decode; see findings:"
  extracted_declarations:
    - framed_channel.zigzag.zigzag
    - framed_channel.zigzag.unzigzag
    - framed_channel.zigzag.encode_i32
    - framed_channel.zigzag.decode_i32
  extracted_representation: "n : Std.I32, the image Std.U32, bytes as Std.U8 in alloc.vec.Vec / Slice, Aeneas Result monad. zigzag is n <<< 1#i32, n >>> 31#i32, i ^^^ i1 and IScalar.hcast .U32, where >>> renders Rust's ARITHMETIC shift on a signed integer as BitVec.sshiftRight; unzigzag is m >>> 1#i32, UScalar.hcast .I32, m &&& 1#u32 and the complement ~~~ half. Neither encode_i32 nor decode_i32 contains a loop: both delegate to varint.encode_u32 / varint.decode_u32"

bridge:
  modules:
    - aeneas/FramedChannelAeneas/Bridge/Zigzag/Defs.lean
    - aeneas/FramedChannelAeneas/Bridge/Zigzag/Mapping.lean
    - aeneas/FramedChannelAeneas/Bridge/Zigzag/Instance.lean
  abstraction: "FramedChannel.Bridge.varint.bytesOf, REUSED UNCHANGED from the varint bridge (aeneas/FramedChannelAeneas/Bridge/Varint/Defs.lean): each machine byte to its Nat value. No second abstraction function is defined, because this unit's Rust delegates to the varint's and so works over the same byte representation"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "zigzag_spec and unzigzag_spec relate the extracted signed shift/xor and its inverse to the model's arithmetic map -- the only place the bit-level and arithmetic spellings meet, and the only genuinely new proof work in this bridge. Everything else is the varint bridge's own theorem plus one of those two scalar steps: the extracted encode_i32 appends exactly the model's encoding; the extracted decode_i32 succeeds exactly where the model succeeds inside the i32 range, with the same signed value and residual; and the extracted decode inverts the extracted encode on every machine i32, with no bound hypothesis. Error agreement is immediate rather than proved afresh: decode_i32 forwards the VarintError its decode_u32 call returns unchanged, so decode_err_iff is stated against the varint model's decode. Every triple is total correctness, so neither extracted function panics or overflows. Bridge/Zigzag/Instance.lean unfolds no LEB128 loop and holds no loop lemma"

implements:
  interface_L0: FramedChannel.CodecModel
  interface_L1: FramedChannel.CodecLaws
  instance: FramedChannel.Zigzag.instCodecLaws
  carrier: "FramedChannel.Zigzag.ZigzagI32 (a component tag; a codec is stateless, so the class's
    representation parameter degenerates to a tag -- recorded, not hidden)"
  abstraction: "the decode observation: the decoded signed value together with the residual bytes"
  operations: "CodecModel fields encode, decode, maxLen, Dom"
  laws: "two: round_trip, length_le"
  value_type: "alpha = Int at the model and alpha = Std.I32 at the bridge -- the codec interface's
    SECOND value type, beside Leb128 at the naturals and Stuff at byte lists. This is the reason the
    unit is protocol-scoped rather than a second standalone codec: it is the encoding for a signed
    frame-header field (a sequence-number delta, a clock offset) whose values cluster near zero in
    both directions, where a plain unsigned varint would spend five bytes on every negative one"
  extracted_instance: FramedChannel.Bridge.zigzag.instCodecLaws_extracted
  extracted_carrier: "FramedChannel.Bridge.zigzag.ExtractedZigzagI32 over Std.I32 with Dom the whole type: encode runs the extracted encode_i32 on an empty vector, decode runs the extracted decode_i32 on the slice holding the bytes (a list no Rust byte slice can hold is refused), both lowered through Result.match"
  rust_counterpart: "rust/src/zigzag.rs's zigzag / unzigzag / encode_i32 / decode_i32; compared
    against the extracted-evaluation vectors by zigzag_agrees_with_extracted_vectors (all four
    operations: the signed map and its inverse, the encoded bytes, and the decode value, consumed
    count and error variant) in rust/tests/differential.rs. A function-only unit like crc8.rs and
    varint.rs: rust/src/lib.rs carries the pub mod line and no top-level pub use, and callers reach
    the functions as framed_channel::zigzag::<fn>"

assumptions:
  - "model only: -2 ^ 31 <= n < 2 ^ 31 (the i32 range, CodecModel.Dom of the Int model). It is
    EXACT rather than conservative: Dom n holds iff zigzag n < 2 ^ 32, so it is precisely the
    preimage of the varint's own claimed u32 domain, not a guess that happens to be sufficient"
  - "the bijection rows assume NOTHING: unzigzag_zigzag and zigzag_unzigzag are registered
    hypothesis-free, over all of Int and all of Nat respectively -- strictly stronger than mutual
    inversion on the i32 range. The range hypothesis appears only in zigzag_lt, where it is
    genuinely needed, and hence in the two laws that use it"
  - "extracted rows: Dom is the whole type, because the i32 range is carried by Std.I32 itself
    rather than stated. roundtrip_extracted carries no hypothesis at all. encode_refines alone
    assumes out.len() + 5 <= usize::MAX, room for the five bytes the delegated varint may push"
  - "decode_complete carries the model instance's own Dom as an explicit hypothesis, for the same
    reason the varint's decode_complete carries n < 2 ^ 32: the model decodes over an unbounded
    Nat, while the Rust rejects an over-wide fifth group. Stated, not avoided by weakening"

guarantees:
  - zigzag_and_unzigzag_are_mutually_inverse_with_no_hypothesis
  - round_trip_on_the_i32_range
  - encoding_length_at_most_five_bytes_inherited_from_the_varint
  - error_agreement_with_the_delegated_varint_codec
  - terminates: "no loop at all in this unit; the delegated varint's loops are structurally
    recursive on explicit fuel 5"

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails
  # when its recorded spec_digest in approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.Zigzag
    covers: "the u32-domain bound, both directions of the bijection, error agreement, the round
      trip, the five-byte bound and the CodecLaws instance at alpha = Int"
  - challenge: FramedChannelAeneasChallenge.Zigzag
    covers: "the extracted signed codec: the two scalar specifications, encode refinement, decode
      success agreement, completeness, error agreement, the round trip and the instance at
      alpha = Std.I32"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"
  selected: "all four of framed_channel.zigzag.zigzag, .unzigzag, .encode_i32 and .decode_i32 --
    exactly the in-subset candidates a registered statement of this unit reaches, which
    spec-check.sh --aeneas confirms with one `bridge reached` record each"

proofs:
  - name: FramedChannel.Zigzag.zigzag_lt
    status: "[PROVED: kernel]"
    role: "the bound that enters the varint's domain: on the i32 range the zigzag image is below 2^32"
  - name: FramedChannel.Zigzag.unzigzag_zigzag
    status: "[PROVED: kernel]"
    role: "bijection, hypothesis-free: unzigzag inverts zigzag on all of Int"
  - name: FramedChannel.Zigzag.zigzag_unzigzag
    status: "[PROVED: kernel]"
    role: "bijection, hypothesis-free: zigzag inverts unzigzag on all of Nat"
  - name: FramedChannel.Zigzag.decode_fail_iff
    status: "[PROVED: kernel]"
    role: "error agreement at the model: this codec fails exactly when the delegated LEB128 codec fails"
  - name: FramedChannel.Zigzag.zigzag_roundtrip
    status: "[PROVED: kernel]"
    role: "round trip on the i32 range (the D o E = id row), RETRIEVED from CodecLaws.round_trip at Leb128"
  - name: FramedChannel.Zigzag.encode_length_le
    status: "[PROVED: kernel]"
    role: "bounds: at most five bytes on the i32 range, RETRIEVED from CodecLaws.length_le at Leb128"
  - name: FramedChannel.Zigzag.instCodecLaws
    status: "[PROVED: kernel]"
    role: "refinement certificate as an interface instance, at the interface's second value type alpha = Int"
  - name: FramedChannel.Bridge.zigzag.zigzag_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted signed shift and xor computes the model's arithmetic zigzag map; failure freedom of both shifts, the xor and the cast"
  - name: FramedChannel.Bridge.zigzag.unzigzag_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted unzigzag is the model's unzigzag on every machine u32, complement branch included"
  - name: FramedChannel.Bridge.zigzag.encode_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted encode_i32 appends exactly Zigzag.encode n.val; one zigzag_spec step then the varint bridge's own encode_refines"
  - name: FramedChannel.Bridge.zigzag.decode_ok_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "success agreement: an extracted Ok((v, k)) is a model success with the same signed value and residual"
  - name: FramedChannel.Bridge.zigzag.decode_complete
    status: "[EXTRACTED: aeneas + bridge]"
    role: "completeness: a model success inside the i32 range is an extracted Ok with the same signed value and residual"
  - name: FramedChannel.Bridge.zigzag.decode_err_iff
    status: "[EXTRACTED: aeneas + bridge]"
    role: "error agreement: extracted Err exactly when the delegated varint decode errs -- the VarintError is forwarded unchanged, so no new taxonomy appears"
  - name: FramedChannel.Bridge.zigzag.roundtrip_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "round trip on the extracted code, for every Std.I32, no bound hypothesis (the D o E = id row on the Rust as extracted); one zigzag_spec step then the varint bridge's own roundtrip_extracted"
  - name: FramedChannel.Bridge.zigzag.instCodecLaws_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "CodecLaws as an interface instance on the extracted signed codec (ExtractedZigzagI32, Std.I32)"

supporting:
  - name: FramedChannel.Zigzag.encode_eq
    status: "[PROVED: kernel]"
    role: "the projection spelling and the direct spelling of encode agree by rfl, so the bridge can rewrite between them; axiom-free (#print axioms: does not depend on any axioms)"
  - name: FramedChannel.Bridge.zigzag.decode_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the decode-side counterpart of encode_eq, by rfl: the model's signed decode spelled through the varint model's decode. Axiom-free. Not predicted by the plan; the decode theorems need it where encode_eq serves the encode side"
  - name: FramedChannel.Bridge.zigzag.bmod_small
    status: "[EXTRACTED: aeneas + bridge]"
    role: "Int.bmod at modulus 2^32 is the identity below 2^31, which is what UScalar.hcast .I32 needs on the unzigzag side"
  - name: FramedChannel.Bridge.zigzag.i32_not_val
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the value of an i32 bitwise complement: (~~~x).val = -1 - x.val. It exists because simp does not see through ~~~x; obtained from BitVec.toInt_eq_msb_cond and BitVec.toNat_not, NOT from bv_decide"
  - name: FramedChannel.Bridge.zigzag.zz_bv
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the one genuinely new bit-vector lemma of this unit: the bit-vector form of the zigzag map (b <<< 1 xor b.sshiftRight 31) equals the model's arithmetic form, on every BitVec 32. KERNEL-ONLY: its two decide +kernel steps are closed bit-vector literal facts (BitVec.ofInt 32 (-1) = allOnes, BitVec.ofInt 32 0 = 0#32), and bv_decide is deliberately unused, so no compiler-trusting native helper axiom appears and this unit adds no flagged row to certificate/policy.txt"
  - name: FramedChannel.search_zigzag_lt_unbounded
    status: "[PROVED: kernel]"
    role: "the countermodel search behind zigzag_lt_unbounded; axiom-free (does not depend on any axioms)"
  - name: FramedChannel.zigzag_lt_unbounded_false
    status: "[PROVED: kernel]"
    role: "the refutation the search discharges; axiom-free"
  - name: FramedChannel.search_zigzag_monotone
    status: "[PROVED: kernel]"
    role: "the countermodel search behind zigzag_monotone; axiom-free"
  - name: FramedChannel.zigzag_monotone_false
    status: "[PROVED: kernel]"
    role: "the refutation the search discharges; axiom-free"
  - name: FramedChannel.search_zigzag_encode_length_le_unbounded
    status: "[PROVED: kernel]"
    role: "the countermodel search behind zigzag_encode_length_le_unbounded; axiom-free"
  - name: FramedChannel.zigzag_encode_length_le_unbounded_false
    status: "[PROVED: kernel]"
    role: "the refutation the search discharges; axiom-free"

dependencies:
  - "Nat and Int core arithmetic reached by grind (this unit's core proofs name no library lemma explicitly); no Mathlib in lean/"
  - "the LEB128 codec unit: this unit's model is DEFINED OVER FramedChannel.Varint.Leb128 and its two laws are retrieved from FramedChannel.Varint.instCodecLaws. lean/FramedChannel/Model/Zigzag/Theorems.lean therefore imports FramedChannel.Model.Varint.Theorems, not only Defs -- the instance lives in the Theorems module. No layer rule forbids a Model Theorems module importing another (tests/layer/run.sh green)"
  - "bridge only: the Aeneas Lean library pinned by `aeneas/lake-manifest.json` (step*, WP.spec_mono, the signed/unsigned scalar specs, IScalar/UScalar.hcast), BitVec.toInt_eq_msb_cond, BitVec.toNat_not, BitVec.msb_eq_decide, BitVec.sshiftRight_eq, BitVec.signExtend_eq, Int.shiftRight_eq_div_pow, Nat.shiftLeft_eq, Nat.and_one_is_mod (Lean core); and the varint bridge's own encode_refines, decode_ok_refines, decode_complete, decode_err_iff, roundtrip_extracted, bytesOf_lt and sliceOfBytes_bytesOf, used as black boxes. Requires the Mathlib version aeneas/lake-manifest.json pins"

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); no crate-local library model is reached, and no new one was added -- Extracted/FunsExternal.lean is byte-unchanged by this unit, which is the recorded outcome of the signed-integer extraction risk. aeneas/FramedChannelAeneas/Bridge/Zigzag/ proves that extraction refines the Lean model"

coverage:
  L0_interface: proved
  L1_laws_over_an_abstract_observation: proved
  canonical_model: proved
  representation_invariant: "not claimed (a codec is stateless; there is no concrete state to
    constrain, so this obligation does not arise rather than being skipped)"
  abstraction_function_and_refinement: proved
  round_trip: "proved twice over, and RETRIEVED rather than re-derived in both halves. At the model,
    FramedChannel.Zigzag.zigzag_roundtrip is recorded on the retrieval rung: it is
    CodecLaws.round_trip at C := Varint.Leb128 applied to zigzag n (legal by zigzag_lt), then
    unzigzag_zigzag -- no LEB128 reasoning appears in its proof. At the extraction,
    FramedChannel.Bridge.zigzag.roundtrip_extracted is one zigzag_spec step then
    WP.spec_mono of FramedChannel.Bridge.varint.roundtrip_extracted, and it carries no bound
    hypothesis because Std.I32 supplies the range."
  error_agreement: "proved at BOTH levels, and the honest limit of each is recorded. At the model,
    FramedChannel.Zigzag.decode_fail_iff is an iff: this codec's decode fails exactly when
    CodecModel.decode at Leb128 fails. The model has a SINGLE .fail and carries NO VarintError
    taxonomy of its own, so the split between Err(Truncated) and Err(Overlong) is not
    characterised by any theorem here -- that is a property of the delegated varint, whose own
    manifest records the same limit. At the extraction,
    FramedChannel.Bridge.zigzag.decode_err_iff states that the extracted decode_i32 returns Err
    exactly when the delegated varint decode does, and it is stated against the VARINT model's
    decode rather than a zigzag-specific error predicate, because rust/src/zigzag.rs's decode_i32
    forwards the VarintError unchanged (the explicit match arm Err(e) => Err(e)). No new error
    variant is introduced by this unit. The extraction's own variants are checked against the
    compiled Rust by zigzag_agrees_with_extracted_vectors in rust/tests/differential.rs
    (validated, not verified), on 13 truncated and 2 overlong records."
  bounds_or_failure_freedom: "proved, and INHERITED. FramedChannel.Zigzag.encode_length_le is the
    five-byte bound, and it *is* the varint's own CodecLaws.length_le at zigzag n -- recorded on
    the retrieval rung, with no arithmetic of its own beyond zigzag_lt. Failure freedom of the
    extracted code is carried by the total-correctness triples: every shift, xor, cast and
    complement in zigzag/unzigzag, and every Vec::push the delegated encode_u32 performs."
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: proved
  ladder: "7 core rows (certificate/ladder.txt): grind -- zigzag_lt, unzigzag_zigzag,
    zigzag_unzigzag, decode_fail_iff; RETRIEVAL -- zigzag_roundtrip and encode_length_le, retrieved
    from CodecLaws at Leb128 through the L1 class rather than from its raw theorems; instance --
    instCodecLaws. The two retrieval rows are the machine-checked record that this unit is distilled
    from the varint rather than a second standalone codec, and they are the reason the projection
    spelling in Defs.lean is load-bearing; see findings:. The bridge rows are not laddered."
  countermodels: "three, all in lean/FramedChannel/Evidence/Countermodels.lean and recorded in
    certificate/countermodels.txt; all six of their declarations are AXIOM-FREE, which is stronger
    than the permitted set.
    (1) zigzag_lt_unbounded, witnessed at Int.ofNat (2 ^ 31): zigzag_lt without its i32-range
    hypothesis is false at exactly the first value outside i32, which is what pins CodecModel.Dom.
    (2) zigzag_monotone, witnessed at (-2, -1): zigzag is NOT order-preserving, so the encoded byte
    order is not the signed order. This records why this codec must not be used for ordered
    comparison on the wire -- it refutes a plausible misuse, not a hypothesis.
    (3) zigzag_encode_length_le_unbounded, witnessed at Int.ofNat (2 ^ 34). CAVEAT, recorded rather
    than glossed: 2 ^ 34 is the VARINT's own five-byte fuel boundary, NOT the i32 boundary. The
    i32-boundary refutation is (1) at 2 ^ 31. Both are kept because they refute different things,
    and reporting the second as if it pinned the i32 range would be false.
    Every search enumeration is kept small enough to stay decidable in the kernel (List.range 34 /
    List.range 40 over powers of two, and [-2,-1,0,1,2] squared for monotonicity), the precedent
    stuff.yaml records for its own maxPayload choice."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound};
      no sorryAx, no compiler-trusting axiom. In particular zz_bv, the one new bit-vector lemma,
      is kernel-only and carries NO native bv_decide helper axiom, which is why this unit adds no
      flagged row to certificate/policy.txt -- the crate's only flagged row remains
      FramedChannel.Crc8.crc8_step_linear. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/zigzag.rs to
      aeneas/FramedChannelAeneas/Extracted/; the bridge proves that output refines the Lean
      model, so the extractor, not a hand transcription, performs the translation step. This is the
      first SIGNED machine integer in the crate, and the pinned revisions handled it with no new
      external name: FunsExternal.lean is byte-unchanged"
    validation: "validated on 85 recorded inputs (zigzag_agrees_with_extracted_vectors in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): 14 zigzag.zigzag, 14 zigzag.unzigzag, 14 zigzag.encode and 43 zigzag.decode records. On every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on the signed map, its inverse, the encoded bytes and the decode result -- the value, the consumed count and the error variant. The inputs cover i32::MIN and i32::MAX, zero, and both signs either side of the one-byte and two-byte boundaries (63/-64, 64/-65, 8191/-8192, 8192/-8193); the decode records cover each complete encoding, each proper prefix (13 err truncated), each encoding with a trailing byte, and 2 err overlong wires. That is direct evidence against a translation fault on those inputs -- and especially against one in the ARITHMETIC-shift semantics, which is where a signed unit would plausibly go wrong: n >> 31 on i32 is arithmetic in Rust, and every negative input would disagree under a logical shift. With the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries; release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the delegated varint loop is a partial_fixpoint, evaluated, never kernel-reduced)."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the same 85 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established. The signed shift is the specific place where this matters most for this unit."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the hand-written model, the signed value is Int and its image Nat, with the i32
      range the hypothesis -2 ^ 31 <= n < 2 ^ 31; in the extraction, Aeneas's Std.I32/Std.U32/
      Std.U8/Usize, Vec, Slice and BitVec library models, trusted as shipped, where the range is
      the type itself. The one place these two meet is zz_bv, which is proved rather than assumed"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half is proved, and zigzag_spec/unzigzag_spec/encode_refines and the three decode rows prove the extraction refines the model on its domain, with decode_err_iff stating exactly where the delegated varint errs; zigzag_agrees_with_extracted_vectors (85 inputs) ties the extraction's results, error variants and consumed counts to the compiled Rust. The Rust-side round trip on both extremes of the range is pinned by the decode records for 254 255 255 255 15 (i32::MAX) and 255 255 255 255 15 (i32::MIN). Per-scenario input counts and the seed record are printed by cargo test -- --nocapture. Finite fixed vectors: testing, not proof, which is why the verdict is validated and not verified."
    approval: "the Challenge modules under specification: above are approved in approvals.yaml,
      which records whether a person or an agent approved each; that these statements say what the
      component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/zigzag.rs and lean/FramedChannel/Model/Zigzag/Theorems.lean in digests.txt;
      the registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each
      listed Challenge module's spec_digest (SpecCheck's closure digest, 64-bit and toolchain-bound)
      and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

findings:
  - name: FramedChannel.Zigzag.encode
    status: "[PROVED: kernel]"
    finding: "THE LADDER FINDING, and the reason this unit is worth having. encode and decode are
      spelled through CodecModel.encode (C := Varint.Leb128) / CodecModel.decode, a projection
      applied to an instance, rather than through Varint.encode / Varint.decode directly. That
      spelling is load-bearing, not cosmetic. Ladder.lean's audit hint set EXCLUDES instances and
      projections, so a projection applied to an instance is not a hint: grind cannot reach
      Varint.encodeF / decodeF through it, and the two laws are consequently recorded on the
      RETRIEVAL rung -- retrieved from CodecLaws at Leb128 through the L1 class. Spelled the direct
      way instead, the audit reports grind as the cheaper rung for both, both rows collapse to
      grind, and the recorded distillation DISAPPEARS from certificate/ladder.txt: the unit would
      still be correct and would no longer record the thing it exists to record. Zigzag.encode n =
      Varint.encode (zigzag n) still holds by rfl (Zigzag.encode_eq), so nothing downstream is
      complicated by the choice. The same reuse holds in the bridge half, where it needs no such
      care: two of the four headline bridge theorems are literally the varint bridge's own theorem
      plus one scalar step, and Bridge/Zigzag/Instance.lean contains no loop lemma at all."
  - name: FramedChannel.Zigzag.unzigzag_zigzag
    status: "[PROVED: kernel]"
    finding: "a STRENGTHENING over what the unit needs. The bijection is registered
      hypothesis-free: unzigzag_zigzag holds on all of Int and zigzag_unzigzag on all of Nat, so
      zigzag is a total bijection Int -> Nat at this model. The task this unit was written for asked
      only for mutual inversion ON THE i32 RANGE, which is strictly weaker. The stronger form is
      what the model actually proves, so it is what is registered; the range hypothesis is confined
      to zigzag_lt, where it is genuinely needed, and to the two laws that consume it. Recorded
      because a reader comparing the registered statements against the original obligation will
      otherwise think the hypothesis was dropped by accident."
  - name: FramedChannel.zigzag_encode_length_le_unbounded
    status: "[PROVED: kernel]"
    finding: "a countermodel whose witness does NOT mean what its name suggests, recorded rather
      than left to be misread. Its witness 2 ^ 34 is the delegated VARINT's five-byte fuel
      boundary, not the i32 boundary: it refutes the length bound stated without any domain
      hypothesis at all, by reaching a value the varint itself cannot encode in five bytes. The
      refutation that actually pins this unit's own domain hypothesis is zigzag_lt_unbounded, at
      2 ^ 31. Both are registered because they refute different statements."

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "ordering: zigzag is NOT order-preserving, and this is refuted in the kernel
    (zigzag_monotone, at (-2, -1)) rather than merely unstated. The encoded byte order is not the
    signed order, so this codec must not be used for ordered comparison on the wire"
  - "i32 wraparound: the Lean model's values are Int and Nat, and the Rust's are i32 and u32; the
    two agree only on -2 ^ 31 <= n < 2 ^ 31, which is what CodecModel.Dom states"
  - "which VarintError variant the extracted decode returns (Truncated vs Overlong): only Err
    agreement is proved, and the taxonomy belongs to the delegated varint rather than to this unit;
    the variants are checked differentially"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
