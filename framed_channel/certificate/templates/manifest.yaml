# Certificate manifest template for a new unit. Copied and filled in, never generated, and never
# restates `../shared.yaml`. Every claim line carries one of the fixed honesty tags; see
# `../README.md` in this directory for the tag vocabulary. Generated values (axiom lines,
# digests, the certificate identity) are read from `../axioms.txt` and `../digests.txt`, which
# `../../check.sh` regenerates.
#
# Key ordering here follows `../varint.yaml`, the smallest of the existing manifests and the
# stateless case (`../README.md`'s own recommendation for a template reference).
#
# This template deliberately omits five conditional-only blocks that only some units need. Read
# the existing manifest named for each before adding one:
#   - `purpose`                                        -- see `../channel.yaml`
#   - `recorded_difference`                             -- see `../ring_buffer.yaml`
#   - `findings`                                        -- see `../varint.yaml`
#   - `composite_trust_note`                             -- see `../channel.yaml`
#   - `trust.G0_checker.independent_recheck.flagged_rows` -- see `../ring_buffer.yaml`
# A stateless unit (no concrete state to constrain) typically also has no `representation_invariant`
# claim under `coverage:` -- see `../varint.yaml`'s "not claimed" phrasing there for the pattern.
# A unit with no partial operation at all (no table lookup, no fuel-bounded loop -- e.g. a
# fold-only checksum with a single always-succeeding step) may ALSO have no `error_agreement` and
# no `bounds_or_failure_freedom` claim under `coverage:`, for the same "the obligation does not
# arise" reason, not just `representation_invariant`: state "not claimed" plus why, as this
# file's own guidance already models for the invariant case. Contrast `../crc8.yaml`, whose table
# lookup gives it a real `bounds_or_failure_freedom` row (the index is always in range).
# A composite unit generic over another interface uses `composition:` in place of `implements:`
# -- see `../channel.yaml`.

component: <Unit>

source:
  file: rust/src/<unit>.rs
  symbol: "<Rust fn/impl name(s)>"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction -- copy this sentence verbatim from an existing manifest; do not restate a revision here (the manifest cross-check forbids it)"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.<Unit>.<...>
  module: "lean/FramedChannel/Model/<Unit>/Defs.lean (definitions) and lean/FramedChannel/Model/<Unit>/Theorems.lean (theorems)"
  representation: "<how the model represents the unit's state/values>"
  extracted_declarations:
    - framed_channel.<unit>.<...>
  extracted_representation: "<Aeneas types and Result-monad shape>"

bridge:
  modules:
    - aeneas/FramedChannelAeneas/Bridge/<Unit>/Defs.lean
    - aeneas/FramedChannelAeneas/Bridge/<Unit>/Instance.lean
  abstraction: "<the toModel/bytesOf-style abstraction function, module and name>"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "<one paragraph: what each triple establishes, in prose, as the other manifests do>"

implements:            # OR composition:, for a composite unit generic over another interface (see channel.yaml)
  interface_L0: FramedChannel.<L0Interface>
  interface_L1: FramedChannel.<L1LawsClass>
  instance: FramedChannel.<Unit>.<instanceName>
  carrier: "<the model's carrier type/tag>"
  abstraction: "<what observation the laws are stated over>"
  operations: "<the L0 interface's fields>"
  laws: "<the L1 laws, by name>"
  extracted_instance: FramedChannel.Bridge.<unit>.<instanceName>_extracted
  extracted_carrier: "<the extracted carrier and how its operations lower to Result.match>"
  rust_counterpart: "<rust/src file + the differential test(s) that tie it to vectors.txt>"

assumptions: []         # every genuine hypothesis a theorem in proofs: below actually carries
guarantees: []          # the plain-language claim list, as the other manifests phrase it

specification:
  - challenge: FramedChannelChallenge.<Unit>
    covers: "<what this module restates>"
  - challenge: FramedChannelAeneasChallenge.<Unit>
    covers: "<what this module restates>"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and candidates_sha256 -- copy this sentence verbatim from an existing manifest"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

proofs: []               # every registered name this unit contributes, with status: and role:
supporting: []            # every proved-but-unregistered lemma the proofs above are built from
dependencies: []           # non-Aeneas Lean-core facts used, plus the bridge-only Aeneas/Mathlib line

toolchain:
  shared: certificate/shared.yaml
  extraction: "<unit-specific tail only -- what was extracted for this unit, and which bridge modules prove the refinement>"

coverage:                # the component-anatomy table (../../README.md), obligation by obligation
  L0_interface: proved
  L1_laws_over_an_abstract_observation: proved
  canonical_model: proved
  representation_invariant: "<proved, or 'not claimed' + why, as varint.yaml does for a stateless unit>"
  abstraction_function_and_refinement: proved
  error_agreement: "<proved, with the exact theorem names and any residual not characterised>"
  bounds_or_failure_freedom: proved
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: proved
  ladder: "<N core rows: which rungs, by declaration>"

trust:                   # one block per G0-G5 class; copy shared.yaml's independent_recheck exactly
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound}; no sorryAx, no compiler-trusting axiom. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "<translation evidence, following an existing manifest's phrasing>"
    validation: "<the differential-test evidence, with exact test names and input counts>"
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the differential-test inputs are the only evidence about rustc MIR and Charon's LLBC here"
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "<what the hand-written model and the extraction each represent>"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "<what the specification half proves and what the differential tests validate>"
    approval: "the Challenge modules under specification: above are approved in approvals.yaml, which records whether a person or an agent approved each; that these statements say what the component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/<unit>.rs and lean/FramedChannel/Model/<Unit>/Theorems.lean in digests.txt; the registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each listed Challenge module's spec_digest and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
