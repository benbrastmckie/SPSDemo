# Composite certificate manifest for StuffedChannel::send followed by delivery: the transparent
# counterpart of channel.yaml's composite. It composes the component manifests below through the
# interface laws. Every claim line carries one of the fixed honesty tags (see README.md in this
# directory). Axiom lines, digests and the certificate identity are read from axioms.txt and
# digests.txt, which check.sh regenerates.

component: StuffedChannel

source:
  file: rust/src/stuffed_channel.rs
  symbol: "StuffedChannel::send, StuffedChannel::deliver"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"
  generic: "StuffedChannel<Q = RingBuffer<Frame>> with Q: BoundedQueue<Frame>, the Rust picture of the Lean SChan Q generic over any BoundedQueueLaws instance; StuffedChannel::new is the concrete constructor at the default queue, StuffedChannel::with_queue the generic one; the stuffed-channel test scenarios in rust/tests/differential.rs run once each at both RingBuffer<Frame> and VecQueue<Frame>"

purpose: "the transparency Channel's own framing does not offer. Channel writes a frame as a
  boundary byte followed by raw length, payload and check bytes, so a 0x7E anywhere in the body is
  data and a receiver cannot scan the wire to the next flag. StuffedChannel passes the whole body
  through the HDLC stuffing codec instead, so the flag appears on the wire only as a frame
  terminator. That is the claim this unit exists for (wire_flag_free_of_send,
  wire_flag_free_extracted), and the corresponding claim about Channel.encodeFrame is refuted in
  the kernel in lean/FramedChannel/Evidence/Countermodels.lean (channel_wire_marker_free, witness
  [marker], certificate/countermodels.txt). It makes the Stuff unit load-bearing: Stuff was fully
  certified and used by nothing. Channel, its theorems and channel.yaml are untouched: this is a
  new composite beside Channel, not a change to it, which is also why stuff.yaml's not_claimed
  entry -- that wiring Stuff into Channel is separate work -- remains literally true."

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction; extract rust/src/stuffed_channel.rs (body, encode_stuffed, parse_stuffed, drop_front, StuffedChannel::with_queue/new/send/deliver/take/queued) into aeneas/FramedChannelAeneas/Extracted/; the bridge below relates that extraction to the hand-written model"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.StuffedChannel.body
    - FramedChannel.StuffedChannel.encodeStuffed
    - FramedChannel.StuffedChannel.parseStuffed
    - FramedChannel.StuffedChannel.send
    - FramedChannel.StuffedChannel.deliver
  module: "lean/FramedChannel/Composition/StuffedChannel/Defs.lean (definitions and the Transparent bundle), lean/FramedChannel/Composition/StuffedChannel/Theorems.lean (generic theorems) and lean/FramedChannel/Composition/StuffedChannel/Instances.lean (instTransparentHdlc, deliver_spec_RB, deliver_spec_VQ)"
  representation: "SChan Q = output queue Q, pending wire bytes (Nat, bytes below 256 as Stuff's model reads them), in-flight count; generic over the queue element E through FrameCarrier E (Channel's class, reused unchanged), over any BoundedQueueLaws Q E instance, over any CodecModel C (List Nat) carrying the Transparent bundle, and over any ChecksumModel K"
  operation_correspondence: "one for one: the Rust StuffedChannel::send and ::deliver are the same two operations with the same guards and the same single failure case, and the guards are Channel's own, in the same order -- capacity (queued + in_flight >= capacity), then length (a payload of 2^32 bytes or more; Lean 2 ^ 32 <= p.length, Rust u32::try_from(payload.len()).is_err()) -- with both refusals the single Lean .fail and the single Rust Err(SendFail). What differs is the wire: the body (varint length, payload, check byte, no leading boundary byte) is handed whole to the framing codec, and deliver runs the three layers backwards -- unstuff, decode the length, then exactly n payload bytes and one check byte with nothing left over. The Rust parse_stuffed performs NO arithmetic at all: every read is a get and the last test is a length comparison against 1."

bridge:
  modules: "aeneas/FramedChannelAeneas/Bridge/StuffedChannel/{Defs,Abstraction,Frame,Refinement,Composite,Instance}.lean"
  status: "[EXTRACTED: aeneas + bridge]"
  trait_dispatch: "Charon/Aeneas turn StuffedChannel<Q: BoundedQueue<Frame>> into an explicit record argument queue.BoundedQueue Q (alloc.vec.Vec Std.U8) on every extracted method; the only src/ instantiation is StuffedChannel::new at the ring buffer record. The bridge proves every theorem once over ANY such record carrying a FramedChannel.Bridge.QueueSim with a functional relation, then instantiates it at the ring buffer record and at the VecQueue record"
  abstraction: "FramedChannel.Bridge.stuffed_channel.SChanRel c m: the extracted channel's queue state is the carrier state of m.out, its wire reads (Bridge.stuff.bytesOf, each machine byte to its value) as m.wire, its in_flight is m.inFlight; m : SChan (Ext S Q (Vec U8) inst R), the specification channel whose queue IS the extracted carrier (Bridge/Queue/Instance.lean)"
  reuse: "the frame and queue plumbing is Bridge/Channel/Defs.lean's, reused rather than mirrored: the frame carrier instFrameCarrierVecU8 at alloc.vec.Vec Std.U8, the extracted frame type FrameVec, the queue carrier ExtQ and the two extracted queue records rbRecord and vqRecord. A second FrameCarrier instance at the same type would be an instance diamond. What this bridge declares of its own is the wire"
  two_byte_views: "the model's wire is List Nat (a CodecModel C (List Nat) is what the composite is generic over, and Bridge/Stuff/ already reads machine bytes that way), while payload frames stay List (BitVec 8) read through Bridge.crc8.bitsOf, because Channel.Frame is what the composite delivers. bytesOf_eq_map_toNat and map_ofNat_bytesOf are the two directions between the views"
  components: "no proof here opens a concrete queue, codec or checksum. The queue is reached only through QueueSim and the Ext read-through lemmas; stuffed_channel.rs calls stuff::encode_frame, stuff::unstuff, varint::encode_u32, varint::decode_u32 and crc8::crc8 monomorphically, and the frame proofs reach them only through the registered component refinements FramedChannel.Bridge.stuff.encode_frame_refines, FramedChannel.Bridge.stuff.unstuff_refines, FramedChannel.Bridge.varint.encode_refines, FramedChannel.Bridge.varint.decode_refines and FramedChannel.Bridge.crc8.crc8_refines, used as black-box step specifications. The file contains no unfold of any stuff.*, varint.* or crc8.* function"
  substitution: "StuffedChannel[RB/VQ] on the extracted code: send_deliver_extracted, deliver_spec_extracted and the constructor headline instantiated at both extracted records (_RB, _VQ) with no reproof; the instantiated rows carry no QueueSim, CloneIsId or Default hypothesis. This is the substitution row exercised at a SECOND composite, Channel[RB/VQ] having been the first"
  found_a_defect: "writing parse_stuffed_refines is what found a reachable panic in the Rust, not a test. The Rust compared rest.len() against n + 1 with n from a u32; on a platform whose usize is 32 bits that addition overflows at u32::MAX, which Aeneas models as a panic and which a debug build really is, reachable from a crafted wire since decode_u32 accepts 0xFFFFFFFF. The Rust was corrected (a get plus a length comparison, no arithmetic on that path) rather than the theorem weakened, which is why parse_stuffed_refines now carries no hypothesis at all"

composition:
  reading: "send = push ∘ frame ∘ checksum ∘ encode, stated precisely: the length encoding and the
    checksum compose inside body; the framing codec wraps that body (encodeStuffed = encode of the
    body); push enters through the Kleisli chain send c p >>= deliver"
  interfaces_reached_generically:
    - "QueueModel / BoundedQueueLaws (push_law, not_full_of_lt, push_capacity) -- the output queue"
    - "CodecModel at L0, plus the composition-layer Transparent bundle of Composition/StuffedChannel/Defs.lean, instantiated at Stuff.Hdlc / Stuff.marker (instTransparentHdlc) -- the framing codec"
    - "ChecksumModel at L0, instantiated at Crc8.Bitwise -- the check byte"
  strength: "three interfaces reached generically, against Channel's one (Channel reaches only the
    queue generically, and its codec and checksum monomorphically). That, and not the round trip,
    is what this composite demonstrates beyond Channel. Varint is the one component still reached
    monomorphically, through Varint.varint_roundtrip, exactly as Channel reaches it and for the
    same reason: the length prefix's codec is fixed by the wire format, not a parameter."
  substitution: "StuffedChannel[VQ/BQ]: deliver_spec used unchanged at RingBuffer.BQ Frame and
    VecQueue.VQ Frame; on the extracted code, StuffedChannel[RB/VQ] (see bridge:)"

assumptions:
  - "FramedChannel.StuffedChannel.SChanInv c ps (wire = stuffed encodings of ps, inFlight = ps.length, every p in ps is FrameOK, queued + inFlight <= capacity)"
  - "none on the sent payload: FramedChannel.Channel.FrameOK p (p.length < 2^32) is established by send's length guard, not assumed by the caller of send_inv or send_deliver"
  - "the Transparent bundle on the framing codec -- decode_append (the round trip with an ARBITRARY residual), body_flag_free (no byte of an encoding but the last is the flag) and ends_with_flag -- discharged at Stuff.Hdlc from Stuff.unstuff_stuff and Stuff.stuff_marker_free, both already in the model layer, so nothing new about stuffing is proved here"
  - "NOT assumed, and deliberately so: CodecLaws. It is too weak twice over. Its Dom at Stuff caps payloads at 255 bytes, where this composite (like Channel) admits every payload below 2 ^ 32; and its round_trip gives a residual of [] only, which would confine SChanInv to at most one pending frame. So Stuff.instCodecLaws is NOT what this composite composes, and any reading of 'proved from Stuff's CodecLaws' would be false"
  - "NOT assumed either: any ChecksumLaws law. The round trip needs only that the same digest is applied on both sides; digest_nil and digest_snoc are never used. Only ChecksumModel at L0 is reached"
  - "bridge, genuine: room on the wire, c.wire.length + 2 * payload.length + 13 <= usize::MAX, on send_refines and every theorem that writes a frame (for the constructor headline, 2 * payload.length + 13 <= usize::MAX). Stuffing can double the body and the body is the payload plus at most six bytes, where Channel's bound was + 7. Aeneas bounds a Vec by Usize.max and the extracted Vec::push/extend_from_slice panic beyond it; real Rust panics earlier, at isize::MAX bytes (G3)"
  - "bridge, discharged: queued + in_flight <= usize::MAX, the checked add in the extracted send, is a hypothesis of send_refines and send_bounded_extracted only; every other composite discharges it from SChanInv (FramedChannel.Bridge.stuffed_channel.hovf_of_inv)"
  - "bridge, generic rows only: FramedChannel.Bridge.QueueSim S Q (Vec U8) inst R with R functional; discharged at both extracted queues (sim, sim, rel_functional), so no _RB/_VQ row carries it"
  - "bridge, proved not assumed: CloneIsId for the frame clone record core.clone.CloneallocvecVec core.clone.CloneU8 (FramedChannel.Bridge.cloneVecU8_isId); the Default record for Vec<u8> needs no hypothesis"
  - "bridge, stated case split: a body whose length prefix decodes to 2^32 or more (FramedChannel.Bridge.stuffed_channel.DeclaresWideLength) is accepted by the model's Nat varint and refused (Overlong) by the extracted decoder; parse_stuffed_refines and deliver_refines carry it as a disjunct, and every composite excludes it from SChanInv (not_declaresWide_encodeStuffed). It is the VARINT layer's divergence and the only one: the stuffing layer contributes none, Bridge.stuff.decode_err_iff being an exact iff"

guarantees:
  - marker_free_wire_the_flag_only_as_frame_terminator
  - capacity_check_discharges_push_not_full
  - fifo_delivery_of_exactly_the_sent_frame_at_every_payload_marker_bearing_included
  - channel_invariant_preserved_by_send_and_deliver
  - send_keeps_queued_plus_in_flight_within_capacity
  - holds_at_every_bounded_queue_instance_and_every_transparent_codec
  - send_refuses_payloads_of_2_pow_32_bytes_or_more

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails when its recorded spec_digest in
  # approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.StuffedChannel
    covers: "the generic transparent-channel theorems, instTransparentHdlc, and deliver_spec_RB/deliver_spec_VQ"
  - challenge: FramedChannelAeneasChallenge.StuffedChannel
    covers: "the extracted transparent channel: the frame codec and operation refinements, the transparency corollary, the composition theorems and their instantiations"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

