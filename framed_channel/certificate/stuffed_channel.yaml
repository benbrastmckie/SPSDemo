findings:
  - name: FramedChannel.Bridge.stuffed_channel.parse_stuffed_refines
    status: "[AUTHORED: nix-tested]"
    finding: "the Rust's first parse_stuffed compared rest.len() against n + 1 with n obtained from
      a u32. On a platform whose usize is 32 bits that addition overflows at u32::MAX -- a panic
      Aeneas models and a debug build really performs -- and it is reachable from a crafted wire,
      because decode_u32 accepts 0xFFFFFFFF. No differential vector found it: none carries a
      declared length near u32::MAX. What found it was writing the refinement, which cannot state a
      total triple over an operation that panics. The Rust was corrected to a get plus a length
      comparison against 1, with no arithmetic on that path at all, rather than the theorem
      weakened with a hypothesis; the regenerated extraction carries no UScalar.add in parse_stuffed,
      and parse_stuffed_refines consequently needs no hypothesis of any kind."

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); parse_stuffed and StuffedChannel::new reach the crate-local trusted models in Extracted/FunsExternal.lean (Option's `?` Try::branch and FromResidual::from_residual, Default for Vec; definitions with proved specs), and the extraction added no new external. aeneas/FramedChannelAeneas/Bridge/StuffedChannel/ proves the extraction refines the Lean model (see bridge:)"

composite_trust_note: "A composite is never more trusted than its least trusted part. This
  composite reaches Crc8 only through ChecksumModel at L0 and Bridge.crc8.crc8_refines, both
  [PROVED: kernel] / [EXTRACTED: aeneas + bridge]; it does NOT reach through crc8_step_linear, the
  example's one compiler-trusting declaration. Its weakest link is G1/G2: the composite, both
  queues it is run at, and the Stuff, Varint and Crc8 components it composes are all bridged to a
  Charon/Aeneas extraction ([EXTRACTED: aeneas + bridge]), so the translation step trusted is the
  extractor's (rustc MIR, Charon, Aeneas and its library models), not a hand transcription, and the
  whole composite stays `trusted`, not `verified`."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound}; no
      sorryAx, no compiler-trusting axiom. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/stuffed_channel.rs to
      aeneas/FramedChannelAeneas/Extracted/; aeneas/FramedChannelAeneas/Bridge/StuffedChannel/
      proves that output refines the hand-written SChan (send_refines, deliver_refines, the frame
      codec, the transparency corollary) over any lawful queue record, so the extractor, not a hand
      transcription, performs the translation step"
    validation: "validated on 118 recorded inputs (stuffed_channel_agrees_with_extracted_vectors (74) and stuffed_channel_agrees_with_extracted_vectors_vec_queue (44) in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): on every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on encode_stuffed's bytes, parse_stuffed's Some(payload, consumed) or None, and for StuffedChannel::new over the ring buffer record and StuffedChannel::with_queue over the VecQueue record, each send/deliver/take result, the delivered or taken payload and queued(); wire and in_flight are private and not observed. The encode_stuffed records also pin the transparency claim on the bytes themselves -- the first test asserts that the flag is the frame's last byte and appears nowhere before it, an assertion that would FAIL against channel.encode_frame's records. That is direct evidence against a translation fault on those inputs; with the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries, or on paths none reaches (the 2^32-byte payload, which no vector can carry and send_refuses_too_long_extracted covers formally; a declared length near u32::MAX, the case the corrected overflow lived on; wires near usize::MAX); release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the extracted loop is a partial_fixpoint, evaluated, never kernel-reduced). No record exists for the private body or drop_front: differential.rs cannot call a private function, and body is covered formally by body_refines instead."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the same 118 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the model the wire is a List Nat (bytes as naturals below 256, as Stuff's model
      reads them), the queue enters only through QueueModel, the framing codec only through
      CodecModel plus the Transparent bundle, and the checksum only through ChecksumModel. In the
      extraction, Aeneas's Vec, Slice and Usize library models are trusted as shipped, at the
      revision `aeneas/lake-manifest.json` pins, with two recorded imprecisions the bridge's
      hypotheses expose: Aeneas bounds a Vec by Usize.max while Rust panics at isize::MAX bytes
      (the wire-room hypothesis), and Aeneas models integer overflow as a panic, which is Rust's
      debug profile; a release build wraps (the queued + in_flight add). The crate-local models in
      Extracted/FunsExternal.lean reached by parse_stuffed and StuffedChannel::new are trusted the
      same way, each with a proved spec"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half is proved, and the bridge proves the extraction refines SChan over any lawful queue record, so on the recorded inputs the model's behavior is the extraction's; stuffed_channel_agrees_with_extracted_vectors (74 inputs: encode_stuffed and parse_stuffed on six payloads -- empty, plain, the flag byte, the escape byte, both reserved bytes together, and the 126-byte payload whose varint length byte is itself the flag -- each with a trailing byte, a short wire and a bumped check byte; plus the ring-buffer trace) and stuffed_channel_agrees_with_extracted_vectors_vec_queue (44 inputs, the same trace at the extracted VecQueue record: the capacity refusal, the empty-wire deliver failure, send/deliver/take rounds and the 126-byte trace with a residual wire) tie it to the compiled Rust, each queue against its own translation. extracted_vectors_cover_every_translated_operation asserts the 14 new branch classes and 3 new operation classes cannot silently disappear from vectors.txt. Both new tests were shown to consume the vectors by perturbing one expected value each and watching exactly that test fail. Finite fixed vectors: testing, not proof, which is why the verdict is validated and not verified."
    approval: "the Challenge modules under specification: above are approved in approvals.yaml,
      which records whether a person or an agent approved each; that these statements say what the
      component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/stuffed_channel.rs and lean/FramedChannel/Composition/StuffedChannel/Theorems.lean in digests.txt;
      each registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each
      listed Challenge module's spec_digest (SpecCheck's closure digest, 64-bit and toolchain-bound)
      and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

coverage:
  L0_interface: "proved, three times over: the composite is generic over QueueModel, over
    CodecModel (plus the composition-layer Transparent bundle) and over ChecksumModel, and reaches
    each only through its interface"
  L1_laws_over_an_abstract_observation: "proved for the queue: every theorem is discharged from the
    six BoundedQueueLaws laws alone, never by opening RingBuffer or VQ. For the codec the L1 class
    CodecLaws is deliberately NOT used -- it is too weak twice over (see assumptions:) -- and the
    Transparent bundle stands in its place, itself discharged from model-layer theorems. For the
    checksum no L1 law is used at all: only that both sides apply the same digest"
  canonical_model: "proved, twice (deliver_spec_RB, deliver_spec_VQ) -- the substitution row, now
    exercised at a second composite"
  representation_invariant: "proved (SChanInv, with the pending frames as a ghost list)"
  abstraction_function_and_refinement: proved
  error_agreement: "proved at the extracted level and only there, obligation by obligation. On the
    Lean side deliver = .fail exactly on a failed parse or a refused push, which is the shape of
    the definition rather than a separate theorem. At the extracted level parse_stuffed_refines'
    ParsePost IS the failure-agreement statement: its none case says the extraction returns none
    exactly when the model refuses OR the body declares a length of 2^32 or more, and
    not_declaresWide_encodeStuffed proves that second disjunct unreachable on any wire this channel
    wrote; send_refines and deliver_refines carry the same agreement per operation. NOT claimed: a
    core-side parseStuffed failure-agreement theorem. Two candidates were considered and both
    rejected on the merits -- a characterisation of when parseStuffed fails restates its own
    definition and carries no obligation, and the informative statement is an iff between the
    extraction's none and the model's refusal, which is FALSE in one direction precisely because of
    the divergence above (the extraction rejects a declared length of 2^32 or more as Overlong
    while the model, whose varint is over Nat, would read it on a body long enough to hold it).
    Checked on the Rust side by stuffed_channel_agrees_with_extracted_vectors / _vec_queue against
    the Err/None records the extraction computed (the empty-wire deliver failure, the capacity
    refusal, the short-wire and bumped-check-byte parse failures); send's length refusal is proved
    (send_refuses_too_long, send_refuses_too_long_extracted) and has no vector, no slice being that
    long"
  bounds_or_failure_freedom: "proved: send_bounded and send_bounded_extracted bound queued plus
    in-flight by the capacity, and every extracted triple above is total, so the extracted
    operations return -- never panic, never diverge -- under their stated hypotheses. The Rust's
    one reachable panic was found by this bridge and removed rather than hypothesised away (see
    findings:)"
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: "proved: the extracted transparent channel refines SChan over any lawful queue record, and the composition theorems hold at both extracted queues from the Rust constructors"
  ladder: "11 core rows (certificate/ladder.txt): simp -- send_refuses_too_long; grind --
    send_bounded, send_inv; retrieval -- wire_flag_free_of_send, send_discharges_not_full,
    deliver_spec_RB, deliver_spec_VQ; manual -- parseStuffed_encodeStuffed, deliver_spec,
    send_deliver; instance -- instTransparentHdlc. send_inv is grind where Channel's textually
    identical send_inv is manual: the rung audit rejected the manual label, the canonical grind
    attempt closing it with definition hints alone. The bridge rows are not laddered."

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "that the ROUND TRIP is a property Channel lacks. It is not: Channel.parseFrame_encodeFrame
    carries no marker-freedom hypothesis either, because a varint length prefix already tells the
    receiver how many bytes to take, and parseFrame (encodeFrame [0x7E, 0x7E, 0x01]) closes by
    decide +kernel. What stuffing buys is the marker-free WIRE (wire_flag_free_of_send), not the
    round trip. Any manifest sentence claiming otherwise would be false"
  - "the boundary-scanning-receiver refutation. Evidence/Countermodels.lean block 12 registers the
    marker-free-wire refutation about Channel.encodeFrame (witness [marker]); it does NOT register
    a second candidate about a receiver that treats a repeated flag as a boundary, because that is
    a restatement of the existing FramedChannel.parseFrameResync_roundtrip row (block 3, witness
    126) -- same failure family, different quantified object (a receiver's behaviour rather than
    the encoder's output), different witness, different mechanism (a varint length byte colliding
    with the flag rather than a payload byte doing so)"
  - "that channel::MARKER and stuff::MARKER agree. This module never reads channel::MARKER; it
    takes its flag only from stuff, and stuff.yaml records the duplication as intentional"
  - "composition of Stuff's CodecLaws, or of any ChecksumLaws law: neither is used, and why is
    recorded under assumptions:. A reading of this unit as 'Channel's proof with CodecLaws
    substituted in' is wrong in both directions"
  - "behavior under corruption: the wire is delivered as sent. A corrupted wire is outside the
    model and outside the Rust public surface (there is no wire_mut), so this is a boundary, not a
    gap in a claim that was made. The bumped-check-byte and short-wire vectors are differential
    coverage of the parser's refusals, not a corruption claim"
  - "concurrency (the model is sequential)"
  - "release-profile arithmetic: the extraction models overflow as a panic (debug profile)"
  - "payloads within a small constant factor of usize::MAX, or wires that large: excluded by the
    wire-room hypothesis c.wire.length + 2 * payload.length + 13 <= usize::MAX"
  - "any reading of 'no proof opens a concrete codec or checksum' beyond this one: the proofs reach
    stuff::encode_frame, stuff::unstuff, encode_u32, decode_u32 and crc8 only through their
    registered component refinement theorems used as black-box specifications (stuffed_channel.rs
    calls them monomorphically)"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
