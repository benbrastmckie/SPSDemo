# Certificate manifest for the LEB128 varint codec. Every claim line carries one of the fixed
# honesty tags; see README.md in this directory for the tag vocabulary. Generated values (axiom
# lines, digests, the certificate identity) are read from axioms.txt and digests.txt, which
# check.sh regenerates.

component: Varint

source:
  file: rust/src/varint.rs
  symbol: "encode_u32, decode_u32"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction, the whole-crate extraction described in ring_buffer.yaml; encode_u32 and decode_u32 are output as varint.encode_u32 / varint.decode_u32, each a loop over Aeneas's loop combinator, in aeneas/FramedChannelAeneas/Extracted/Funs.lean (generated, never hand-edited)"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.Varint.encode
    - FramedChannel.Varint.decode
  module: "lean/FramedChannel/Model/Varint/Defs.lean (definitions) and lean/FramedChannel/Model/Varint/Theorems.lean (theorems)"
  representation: "bytes as Nat below 256; both loops structurally recursive on explicit fuel 5 (hand-written model; connected to the extraction by the bridge below)"
  extracted_declarations:
    - framed_channel.varint.encode_u32
    - framed_channel.varint.decode_u32
  extracted_representation: "n : Std.U32, bytes as Std.U8 in alloc.vec.Vec / Slice, Aeneas Result monad; encode loops over the i32 range 0..5, decode over the usize range 0..5"

bridge:
  modules:
    - aeneas/FramedChannelAeneas/Bridge/Varint/Defs.lean
    - aeneas/FramedChannelAeneas/Bridge/Varint/Encode.lean
    - aeneas/FramedChannelAeneas/Bridge/Varint/Decode.lean
    - aeneas/FramedChannelAeneas/Bridge/Varint/Instance.lean
  abstraction: "FramedChannel.Bridge.varint.bytesOf (aeneas/FramedChannelAeneas/Bridge/Varint/Defs.lean): each machine byte to its Nat value"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "the extracted encode_u32 appends exactly the model's encoding; the extracted decode_u32 succeeds exactly where the model succeeds with a value below 2^32, with the same value and residual, and returns Err exactly where the model fails or returns a value at or above 2^32 (the Rust's Overlong rejection of an over-wide fifth group is stricter than the Nat model, and this is the true relation, not a weakening); and the extracted decode inverts the extracted encode on every machine u32, with no bound hypothesis. Every triple is total correctness, so neither extracted function panics or overflows"

implements:
  interface_L0: FramedChannel.CodecModel
  interface_L1: FramedChannel.CodecLaws
  instance: FramedChannel.Varint.instCodecLaws
  carrier: "FramedChannel.Varint.Leb128 (a component tag; a codec is stateless, so the class's
    representation parameter degenerates to a tag -- recorded, not hidden)"
  abstraction: "the decode observation: the decoded value together with the residual bytes"
  operations: "CodecModel fields encode, decode, maxLen, Dom"
  laws: "two: round_trip, length_le"
  extracted_instance: FramedChannel.Bridge.varint.instCodecLaws_extracted
  extracted_carrier: "FramedChannel.Bridge.varint.ExtractedLeb128 over Std.U32 with Dom the whole type: encode runs the extracted encode_u32 on an empty vector, decode runs the extracted decode_u32 on the slice holding the bytes (a list no Rust byte slice can hold is refused), both lowered through Result.match"
  rust_counterpart: "rust/src/varint.rs's encode_u32 / decode_u32; compared against the
    extracted-evaluation vectors by varint_agrees_with_extracted_vectors and
    varint_out_of_domain_agrees_with_extracted_vectors (results, consumed counts and error
    variants), with the Rust-side error variants also
    pinned by varint_roundtrip_on_fixed_inputs and varint_rejects_truncated_and_overlong in
    rust/tests/differential.rs"

assumptions:
  - "model only: n < 2 ^ 32 (the claimed domain, CodecModel.Dom of the Nat model)"
  - "extracted rows: none -- the u32 bound is carried by Std.U32 (n.hBounds), not a hypothesis; encode_refines alone assumes out.len() + 5 <= usize::MAX, room for the five bytes it may push"

guarantees:
  - round_trip_on_the_claimed_domain
  - encoding_length_at_most_five_bytes
  - terminates: "structurally, on explicit fuel 5"

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails
  # when its recorded spec_digest in approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.Varint
    covers: "the round trip, the length bound and the CodecLaws instance"
  - challenge: FramedChannelAeneasChallenge.Varint
    covers: "the extracted codec: encode/decode refinement, completeness, error agreement, the round trip and the instance"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

proofs:
  - name: FramedChannel.Varint.varint_roundtrip
    status: "[PROVED: kernel]"
    role: "round trip (the D o E = id row)"
  - name: FramedChannel.Varint.encode_length_le
    status: "[PROVED: kernel]"
    role: "bounds: at most five bytes on the u32 domain"
  - name: FramedChannel.Varint.instCodecLaws
    status: "[PROVED: kernel]"
    role: "refinement certificate as an interface instance"
  - name: FramedChannel.Bridge.varint.encode_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted encode_u32 appends exactly Varint.encode n.val; failure freedom of every shift, cast and Vec::push"
  - name: FramedChannel.Bridge.varint.decode_ok_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "success agreement: an extracted Ok((v, k)) is a model success with the same value and residual"
  - name: FramedChannel.Bridge.varint.decode_complete
    status: "[EXTRACTED: aeneas + bridge]"
    role: "completeness: a model success below 2^32 is an extracted Ok with the same value and residual"
  - name: FramedChannel.Bridge.varint.decode_err_iff
    status: "[EXTRACTED: aeneas + bridge]"
    role: "error agreement: extracted Err iff the model fails or returns a value at or above 2^32"
  - name: FramedChannel.Bridge.varint.roundtrip_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "round trip on the extracted code, for every Std.U32, no bound hypothesis (the D o E = id row on the Rust as extracted)"
  - name: FramedChannel.Bridge.varint.instCodecLaws_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "CodecLaws as an interface instance on the extracted codec (ExtractedLeb128, Std.U32)"

supporting:
  - name: FramedChannel.Varint.encodeF_bytes_lt
    status: "[PROVED: kernel]"
    role: "every emitted byte is below 256"
  - name: FramedChannel.Bridge.range_i32_next_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "library-gap step spec (aeneas/FramedChannelAeneas/Bridge/Std.lean): IteratorRange.next over i32 ranges; shared with crc8.yaml's inner loop"
  - name: FramedChannel.Bridge.slice_get_usize_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "library-gap step spec (Bridge/Std.lean): Slice.get at a usize index; shared with crc8.yaml's table lookup"
  - name: FramedChannel.Bridge.from_u32_u8_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "library-gap step spec (Bridge/Std.lean): u32::from(u8)"
  - name: FramedChannel.Bridge.varint.u32_and_127
    status: "[EXTRACTED: aeneas + bridge]"
    role: "scalar fact: n & 127 is n mod 128"
  - name: FramedChannel.Bridge.varint.u32_cast_u8_of_lt
    status: "[EXTRACTED: aeneas + bridge]"
    role: "scalar fact: the u32-to-u8 cast keeps a value below 256"
  - name: FramedChannel.Bridge.varint.u8_or_128
    status: "[EXTRACTED: aeneas + bridge]"
    role: "scalar fact: g | 128 is g + 128 below 128"
  - name: FramedChannel.Bridge.varint.shiftRight_7
    status: "[EXTRACTED: aeneas + bridge]"
    role: "Nat fact: v >> 7 is v / 128"
  - name: FramedChannel.Bridge.varint.encode_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the encode loop lemma (loop.spec_decr_nat, invariant EncInv), including the unreachable exhausted-range branch"
  - name: FramedChannel.Bridge.varint.u32_size_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "U32.size is 2^32"
  - name: FramedChannel.Bridge.varint.pow128_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "128^k is 2^(7k)"
  - name: FramedChannel.Bridge.varint.group_shift_or_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "or-as-add: acc | (g << j) is acc + g * 2^j when acc < 2^j and no truncation"
  - name: FramedChannel.Bridge.varint.acc_lt_after_step
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the accumulator stays below the next shift"
  - name: FramedChannel.Bridge.varint.no_trunc_lt
    status: "[EXTRACTED: aeneas + bridge]"
    role: "no truncation of the u32 shift for groups at shifts up to 21"
  - name: FramedChannel.Bridge.varint.no_trunc_last
    status: "[EXTRACTED: aeneas + bridge]"
    role: "no truncation of the u32 shift for the last group, which the Rust bounds by 15"
  - name: FramedChannel.Bridge.varint.u8_and_127
    status: "[EXTRACTED: aeneas + bridge]"
    role: "scalar fact: b & 127 is b mod 128"
  - name: FramedChannel.Bridge.varint.u8_and_128_eq_zero
    status: "[EXTRACTED: aeneas + bridge]"
    role: "scalar fact: b & 128 == 0 iff b < 128 (kernel decide)"
  - name: FramedChannel.Bridge.varint.drop_bytesOf_some
    status: "[EXTRACTED: aeneas + bridge]"
    role: "list fact: an indexed byte heads the residual"
  - name: FramedChannel.Bridge.varint.drop_bytesOf_none
    status: "[EXTRACTED: aeneas + bridge]"
    role: "list fact: past the end the residual is empty"
  - name: FramedChannel.Bridge.varint.decodeF_lt
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model step: a terminating group"
  - name: FramedChannel.Bridge.varint.decodeF_ge
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model step: a continuing group"
  - name: FramedChannel.Bridge.varint.decode_ok_step
    status: "[EXTRACTED: aeneas + bridge]"
    role: "one terminating decode step matched to the model"
  - name: FramedChannel.Bridge.varint.decode_cont_step
    status: "[EXTRACTED: aeneas + bridge]"
    role: "one continuing decode step matched to the model"
  - name: FramedChannel.Bridge.varint.acc_step_val
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the machine accumulator after one group, as Nat addition"
  - name: FramedChannel.Bridge.varint.decode_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the decode loop lemma (loop.spec_decr_nat, invariant DecInv, post DecPost), including the shift = 28 branch"
  - name: FramedChannel.Bridge.varint.decode_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted decode_u32 is related to the model by DecPost; the three decode rows are its corollaries"
  - name: FramedChannel.Bridge.varint.bytesOf_lt
    status: "[EXTRACTED: aeneas + bridge]"
    role: "every abstracted machine byte is below 256"
  - name: FramedChannel.Bridge.varint.sliceOfBytes_bytesOf
    status: "[EXTRACTED: aeneas + bridge]"
    role: "re-slicing an abstracted vector gives back its own slice; used by instCodecLaws_extracted"

dependencies:
  - "Nat.div_lt_iff_lt_mul, Nat.pow_succ, Nat.pow_one, Nat.mod_add_div (Lean core)"
  - "no Mathlib in lean/; no other module of this example except the specification's Result type"
  - "bridge only: the Aeneas Lean library pinned by `aeneas/lake-manifest.json` (loop.spec_decr_nat, step*, scalar and Vec specs), Nat.shiftLeft_add_eq_or_of_lt and Nat.and_two_pow_sub_one_eq_mod (Lean core); requires the Mathlib version aeneas/lake-manifest.json pins"

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); no crate-local library model is reached. aeneas/FramedChannelAeneas/Bridge/Varint/ proves that extraction refines the Lean model"

coverage:
  L0_interface: proved
  L1_laws_over_an_abstract_observation: proved
  canonical_model: proved
  representation_invariant: "not claimed (a codec is stateless; there is no concrete state to
    constrain, so this obligation does not arise rather than being skipped)"
  abstraction_function_and_refinement: proved
  error_agreement: "proved at the extracted level: decode_err_iff states that the extracted
    decode_u32 returns Err exactly when the model fails or returns a value at or above 2^32. The
    Lean model has one .fail with no error taxonomy, so the split between Err(Truncated) and
    Err(Overlong) is not characterised by a theorem; the variants are pinned by
    varint_rejects_truncated_and_overlong, and the extraction's own variants are checked against
    the Rust by varint_agrees_with_extracted_vectors in rust/tests/differential.rs (validated, not
    verified)."
  bounds_or_failure_freedom: proved
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: proved
  ladder: "3 core rows (certificate/ladder.txt): grind -- varint_roundtrip,
    encode_length_le (grind over encode, decode, encodeF, decodeF); instance -- instCodecLaws. The
    bridge rows are not laddered."
  countermodels: "the n < 2 ^ 32 hypothesis of both theorems is necessary: without it each is
    refuted in the kernel at 2 ^ 35, the first failing power of two
    (encode_length_le_unbounded_false, varint_roundtrip_unbounded_false in
    lean/FramedChannel/Evidence/Countermodels.lean; certificate/countermodels.txt)"

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound};
      no sorryAx, no compiler-trusting axiom. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/varint.rs to
      aeneas/FramedChannelAeneas/Extracted/; the bridge proves that output refines the Lean
      model, so the extractor, not a hand transcription, performs the translation step"
    validation: "validated on 52 recorded inputs (varint_agrees_with_extracted_vectors (50) and varint_out_of_domain_agrees_with_extracted_vectors (2) in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): on every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on the encoded bytes and the decode result: the value, the consumed count, and the error variant (Truncated or Overlong). That is direct evidence against a translation fault on those inputs; with the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries, or on paths none reaches (an encode into a vector within five bytes of usize::MAX); release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the extracted loop is a partial_fixpoint, evaluated, never kernel-reduced)."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the same 52 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the hand-written model, bytes are Nat below 256 and the u32 bound is the
      hypothesis n < 2 ^ 32; in the extraction, Aeneas's Std.U32/Std.U8/Usize, Vec, Slice and range
      library models, trusted as shipped, where the bound is the type itself"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half is proved, and encode_refines/decode_refines prove the extraction refines the model on its domain, with decode_err_iff stating exactly where it does not (a value at or above 2^32, which the Rust rejects as Overlong); varint_agrees_with_extracted_vectors (50 inputs: encode on 13 values, decode on each complete encoding, each proper prefix, each encoding with a trailing byte, and the two fuel-exhaustion inputs) and varint_out_of_domain_agrees_with_extracted_vectors (2) tie the extraction's results, error variants and consumed counts to the compiled Rust. varint_roundtrip_on_fixed_inputs (13) and varint_rejects_truncated_and_overlong (4) validate the Rust half beside them. Per-scenario input counts and the seed record are printed by cargo test -- --nocapture. Finite fixed vectors: testing, not proof, which is why the verdict is validated and not verified."
    approval: "the Challenge modules under specification: above are approved in approvals.yaml,
      which records whether a person or an agent approved each; that these statements say what the
      component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/varint.rs and lean/FramedChannel/Model/Varint/Theorems.lean in digests.txt;
      the registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each
      listed Challenge module's spec_digest (SpecCheck's closure digest, 64-bit and toolchain-bound)
      and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

findings:
  - name: FramedChannel.Varint.varint_roundtrip
    status: "[AUTHORED: nix-tested]"
    finding: "recorded divergence at the edge of this theorem's domain hypothesis. The Lean decode is a Nat
      computation with no width bound, so decode [128,128,128,128,16] returns .ok (4294967296, [])
      and decode [128,128,128,128,127] returns .ok (34091302912, []); rust/src/varint.rs's
      decode_u32 returns Err(Overlong) for both, because neither value fits a u32. These inputs
      denote values at or above 2 ^ 32 and therefore lie strictly outside CodecModel.Dom, the
      domain varint_roundtrip's own n < 2 ^ 32 hypothesis carries and the region the not_claimed
      entry on u32 wraparound below already excludes -- so this is the boundary of the claim
      rather than a defect on either side. At the extracted level this is
      FramedChannel.Bridge.varint.decode_err_iff; the vectors are computed by evaluating the
      extraction, and these inputs are kept as their own labelled varint.decode.out_of_domain
      record class, on which the extraction and the Rust AGREE (Err(Overlong));
      varint_out_of_domain_agrees_with_extracted_vectors in rust/tests/differential.rs checks
      that agreement, so the class cannot drift unnoticed."

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "u32 wraparound: the Lean model's values are Nat, and the Rust's are u32; the two agree only
    on the domain n < 2 ^ 32, which is what CodecModel.Dom states"
  - "which VarintError variant the extracted decode returns (Truncated vs Overlong): only Err agreement is proved; the variants are checked differentially"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
