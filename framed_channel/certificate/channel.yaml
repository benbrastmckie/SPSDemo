# Composite certificate manifest for Channel::send followed by delivery. It composes the two
# component manifests below through the interface laws. Every claim line carries one of the
# fixed honesty tags (see README.md in this directory). Axiom lines, digests and the certificate
# identity are read from axioms.txt and digests.txt, which check.sh regenerates.

component: Channel

source:
  file: rust/src/channel.rs
  symbol: "Channel::send, Channel::deliver"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"
  generic: "Channel<Q = RingBuffer<Frame>> with Q: BoundedQueue<Frame>, the Rust picture of the Lean Chan Q generic over any BoundedQueueLaws instance; Channel::new is the concrete constructor at the default queue, Channel::with_queue the generic one; the channel test scenarios in rust/tests/differential.rs run once each at both RingBuffer<Frame> and VecQueue<Frame>"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction; extract rust/src/channel.rs (encode_frame, parse_frame, drop_front, Channel::with_queue/new/send/deliver/take/queued) into aeneas/FramedChannelAeneas/Extracted/; the bridge below relates that extraction to the hand-written model"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.Channel.encodeFrame
    - FramedChannel.Channel.send
    - FramedChannel.Channel.deliver
  module: "lean/FramedChannel/Composition/Channel/Defs.lean (definitions), lean/FramedChannel/Composition/Channel/Theorems.lean (generic theorems) and lean/FramedChannel/Composition/Channel/Instances.lean (deliver_spec_RB, deliver_spec_VQ)"
  representation: "Chan Q = output queue Q, wire bytes (BitVec 8), in-flight count; generic over the queue element E through FrameCarrier E (the identity at E := Frame, the hand models' channel) and over any BoundedQueueLaws Q E instance"
  operation_correspondence: "one for one: the Rust Channel::send and Channel::deliver are the same two operations with the same guards and the same single failure case. send has two guards in the same order on both sides -- capacity (queued + in_flight >= capacity), then length (a payload of 2^32 bytes or more; Lean 2 ^ 32 <= p.length, Rust u32::try_from(payload.len()).is_err()) -- and both refusals are the single Lean .fail and the single Rust Err(SendFail). send passes encode_frame the u32 length try_from returned, so no length is truncated. There is no byte-at-a-time FrameDecoder and no dropped-frame counter: the channel is modeled uniformly at the frame level, guard for guard."

bridge:
  modules: "aeneas/FramedChannelAeneas/Bridge/Channel/{Defs,Abstraction,Frame,Refinement,Composite,Instance}.lean"
  status: "[EXTRACTED: aeneas + bridge]"
  trait_dispatch: "Charon/Aeneas turn Channel<Q: BoundedQueue<Frame>> into an explicit record argument queue.BoundedQueue Q (alloc.vec.Vec Std.U8) on every extracted Channel method; the only src/ instantiation is Channel::new at the ring buffer record. The bridge proves every channel theorem once over ANY such record carrying a FramedChannel.Bridge.QueueSim with a functional relation, then instantiates it at the ring buffer record and at the VecQueue record"
  abstraction: "FramedChannel.Bridge.channel.ChanRel c m: the extracted channel's queue state is the carrier state of m.out, its wire reads (bitsOf) as m.wire, its in_flight is m.inFlight; m : Chan (Ext S Q (Vec U8) inst R), the specification channel whose queue IS the extracted carrier (Bridge/Queue/Instance.lean), with FrameCarrier (Vec U8) mapping a frame to its byte vector"
  element_type: "the extracted queues hold Vec<u8>, the specification channel held Frame = List (BitVec 8); no lawful QueueModel _ Frame view of a Vec queue exists (push_law quantifies over frames longer than usize::MAX, which have no Vec), so the core channel is generic over its element (FrameCarrier) and the unchanged core theorems apply at E := Vec U8"
  components: "no channel proof opens a concrete queue, codec or checksum: the queue is reached only through QueueSim and the Ext read-through lemmas; channel.rs calls encode_u32, decode_u32 and crc8 monomorphically (not through CodecLaws/ChecksumLaws), and the frame proofs reach them only through the registered component refinements FramedChannel.Bridge.varint.encode_refines, FramedChannel.Bridge.varint.decode_refines and FramedChannel.Bridge.crc8.crc8_refines, used as black-box step specifications; no varint or CRC-8 loop is unfolded"
  substitution: "Channel[RB/VQ] on the extracted code: send_deliver_extracted, deliver_spec_extracted and the constructor headline instantiated at both extracted records (_RB, _VQ) with no reproof; the instantiated rows carry no QueueSim, CloneIsId or Default hypothesis"

composition:
  reading: "send = push ∘ checksum ∘ encode, stated precisely: encode and checksum compose inside encodeFrame; push enters through the Kleisli chain send c p >>= deliver"
  components:
    - "Varint (varint_roundtrip)"
    - "Crc8 (crc8_table_eq_bits, through encodeFrameTable_eq)"
    - "any BoundedQueueLaws instance (push_law, not_full_of_lt, push_capacity)"
  substitution: "Channel[VQ/BQ]: deliver_spec used unchanged at RingBuffer.BQ Frame and VecQueue.VQ Frame; on the extracted code, Channel[RB/VQ] (see bridge:)"

assumptions:
  - "FramedChannel.Channel.ChanInv c ps (wire = encodings of ps, inFlight = ps.length, every p in ps is FrameOK, queued + inFlight <= capacity)"
  - "none on the sent payload: FramedChannel.Channel.FrameOK p (p.length < 2^32) is established by send's length guard, not assumed by the caller of send_inv or send_deliver"
  - "bridge, genuine: room on the wire, c.wire.length + payload.length + 7 <= usize::MAX, on send_refines and every theorem that writes a frame (for the constructor headline, payload.length + 7 <= usize::MAX). Aeneas bounds a Vec by Usize.max and the extracted Vec::push/extend_from_slice panic beyond it; real Rust panics earlier, at isize::MAX bytes (G3)"
  - "bridge, discharged: queued + in_flight <= usize::MAX, the checked add in the extracted send, is a hypothesis of send_refines and send_bounded_extracted only; every other composite discharges it from ChanInv (FramedChannel.Bridge.channel.hovf_of_inv: queued + inFlight <= capacity, which the record reports as a usize)"
  - "bridge, generic rows only: FramedChannel.Bridge.QueueSim S Q (Vec U8) inst R with R functional; discharged at both extracted queues (sim, sim, rel_functional), so no _RB/_VQ row carries it"
  - "bridge, proved not assumed: CloneIsId for the frame clone record core.clone.CloneallocvecVec core.clone.CloneU8 (FramedChannel.Bridge.cloneVecU8_isId); the Default record for Vec<u8> needs no hypothesis"
  - "bridge, stated case split: a frame declaring a length of 2^32 or more (FramedChannel.Bridge.channel.DeclaresWideLength) is accepted by the model's Nat varint and refused (Overlong) by the extracted parser; parse_frame_refines and deliver_refines carry it as a disjunct, and every composite excludes it from ChanInv (every pending frame is FrameOK)"

guarantees:
  - capacity_check_discharges_push_not_full
  - fifo_delivery_of_exactly_the_sent_frame
  - channel_invariant_preserved_by_send_and_deliver
  - send_keeps_queued_plus_in_flight_within_capacity
  - holds_at_every_bounded_queue_instance
  - send_refuses_payloads_of_2_pow_32_bytes_or_more

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails
  # when its recorded spec_digest in approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.Channel
    covers: "the generic channel theorems and deliver_spec_RB/deliver_spec_VQ"
  - challenge: FramedChannelChallenge.VecQueue
    covers: "VecQueue.instBoundedQueueLaws, which this manifest also lists; it is owned by vec_queue.yaml and not restated here"
  - challenge: FramedChannelAeneasChallenge.Channel
    covers: "the extracted channel: frame codec and operation refinements, the composition theorems and their instantiations"
  - challenge: FramedChannelAeneasChallenge.Queue
    covers: "cloneVecU8_isId, the proved Clone assumption for Vec<u8> frames"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

