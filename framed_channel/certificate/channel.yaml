dependencies:
  - ring_buffer.yaml
  - vec_queue.yaml
  - varint.yaml
  - crc8.yaml

findings:
  - name: FramedChannel.Channel.parseFrame_encodeFrame
    status: "[AUTHORED: nix-tested]"
    finding: "a payload of exactly 126 bytes encodes its own length as 0x7E, the marker byte. A
      receiver that treats a second 0x7E as a boundary marker loses synchronization on such a
      frame; parseFrame instead reads a single 'marker, then length whatever its value', which is
      the specification and matches the Rust. The regression coverage is
      channel_len126_roundtrip and channel_len126_roundtrip_vec_queue in
      rust/tests/differential.rs. The Lean model needs no length-126 side condition: FrameOK p is
      p.length < 2 ^ 32, which send's own length guard establishes, and the channel reaches
      parseFrame directly with no separate receiver parser. The rejected resync design is kept as
      kernel-checked evidence: parseFrameResync_roundtrip_false
      (lean/FramedChannel/Evidence/Countermodels.lean) refutes the round trip of a receiver that
      treats a second 0x7E as a boundary, and search_parseFrameResync_roundtrip proves 126 is the first failing zero
      payload length in 0..129 (certificate/countermodels.txt)."

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); parse_frame and Channel::new reach the crate-local trusted models in Extracted/FunsExternal.lean (Option's `?` Try::branch and FromResidual::from_residual, <[T]>::split_first, Default for Vec; definitions with proved specs). aeneas/FramedChannelAeneas/Bridge/Channel/ proves the extraction refines the Lean model (see bridge:)"

composite_trust_note: "A composite is never more trusted than its least trusted part. This
  composite reaches Crc8 only through crc8_table_eq_bits and encodeFrameTable_eq, both
  [PROVED: kernel]; it does NOT reach through crc8_step_linear, the example's one
  compiler-trusting declaration. Its weakest link is G1/G2: the channel, both queues it is
  run at, and the Varint and Crc8 components it composes are all bridged to a Charon/Aeneas
  extraction ([EXTRACTED: aeneas + bridge]), so the translation step trusted is the
  extractor's (rustc MIR, Charon, Aeneas and its library models), not a hand transcription, and
  the whole composite stays `trusted`, not `verified`. The extracted composite reaches the queue
  only through the laws, and the codec and checksum only through their component refinements."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound}; no
      sorryAx, no compiler-trusting axiom. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/channel.rs to
      aeneas/FramedChannelAeneas/Extracted/; aeneas/FramedChannelAeneas/Bridge/Channel/ proves that
      output refines the hand-written Chan (send_refines, deliver_refines, the frame codec) over any
      lawful queue record, so the extractor, not a hand transcription, performs the translation
      step"
    validation: "validated on 101 recorded inputs (frame_codec_agrees_with_extracted_vectors (25), channel_agrees_with_extracted_vectors (38) and channel_agrees_with_extracted_vectors_vec_queue (38) in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): on every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on encode_frame's bytes, parse_frame's Some(payload, consumed) or None, and for Channel::new over the ring buffer record and Channel::with_queue over the VecQueue record, each send/deliver/take result, the delivered or taken payload and queued(); wire and in_flight are private and not observed. That is direct evidence against a translation fault on those inputs; with the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries, or on paths none reaches (the 2^32-byte payload, which no vector can carry and send_refuses_too_long_extracted covers formally; wires near usize::MAX; corrupted wires beyond the short-wire and bad-CRC records); release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the extracted loop is a partial_fixpoint, evaluated, never kernel-reduced)."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the same 101 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the model the wire is a List (BitVec 8) and the queue enters only through
      QueueModel. In the extraction, Aeneas's Vec, Slice and Usize library models are trusted as
      shipped, at the revision `aeneas/lake-manifest.json` pins, with two recorded imprecisions the bridge's hypotheses expose: Aeneas
      bounds a Vec by Usize.max while Rust panics at isize::MAX bytes (the wire-room hypothesis),
      and Aeneas models integer overflow as a panic, which is Rust's debug profile; a release build
      wraps (the queued + in_flight add). The crate-local models in Extracted/FunsExternal.lean
      reached by parse_frame and Channel::new are trusted the same way, each with a proved spec"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
