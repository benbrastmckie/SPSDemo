coverage:
  L0_interface: "proved (the composite is generic over QueueModel, and reaches the queue only
    through it)"
  L1_laws_over_an_abstract_observation: "proved: every channel theorem is discharged from the six
    BoundedQueueLaws laws alone, never by opening RingBuffer or VQ"
  canonical_model: "proved, twice (deliver_spec_RB, deliver_spec_VQ) -- this is the substitution
    row, and it is what having two instances buys"
  representation_invariant: "proved (ChanInv, with the pending frames as a ghost list)"
  abstraction_function_and_refinement: proved
  error_agreement: "proved on the Lean side (deliver = .fail exactly on a failed parse or a
    refused push) and at the extracted level (send_refines, deliver_refines: Err exactly where the
    model fails, the wide-length case split stated), and checked on the Rust side by
    frame_codec_agrees_with_extracted_vectors and channel_agrees_with_extracted_vectors
    / _vec_queue against Err/None records the extraction computed (the empty-wire deliver failure,
    the capacity refusal, the short-wire and bad-CRC parse failures); send's length refusal is
    proved (send_refuses_too_long, send_refuses_too_long_extracted) and checked on the Rust side
    by channel_refuses_payload_of_2_pow_32_bytes"
  bounds_or_failure_freedom: proved
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: "proved: the extracted channel refines Chan over any lawful queue record, and the composition theorems hold at both extracted queues from the Rust constructors"
  ladder: "10 core channel rows (certificate/ladder.txt): simp -- send_refuses_too_long;
    grind -- send_bounded; retrieval -- send_discharges_not_full, encodeFrameTable_eq,
    deliver_spec_RB, deliver_spec_VQ; manual -- parseFrame_encodeFrame, deliver_spec, send_inv,
    send_deliver. The queue instance this manifest also lists is recorded in its own manifest. The
    bridge rows are not laddered."

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "behavior under corruption: the wire is delivered as sent. A corrupted wire is outside the
    model and outside the Rust public surface (there is no wire_mut), so this is a boundary, not
    a gap in a claim that was made."
  - "concurrency (the model is sequential)"
  - "the composite envelope as a Logos sentence"
  - "release-profile arithmetic: the extraction models overflow as a panic (debug profile)"
  - "payloads within seven bytes of usize::MAX, or wires that large: excluded by the wire-room hypothesis"
  - "any reading of 'no channel proof opens a concrete codec or checksum' beyond this one: the channel proofs reach encode_u32, decode_u32 and crc8 only through their registered component refinement theorems used as black-box specifications (channel.rs calls them monomorphically, not through CodecLaws/ChecksumLaws)"
