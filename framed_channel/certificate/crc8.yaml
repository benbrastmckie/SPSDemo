# Certificate manifest for the CRC-8 checksum. Every claim line carries one of the fixed honesty
# tags; see README.md in this directory. Generated values (axiom lines, digests, the certificate
# identity) are read from axioms.txt and digests.txt, which check.sh regenerates.

component: Crc8

source:
  file: rust/src/crc8.rs
  symbol: "crc8, crc8_table"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction, the whole-crate extraction described in ring_buffer.yaml; crc8, crc8_table and TABLE are output as crc8.crc8 (nested loops), crc8.crc8_table (a loop) and the constant crc8.TABLE in aeneas/FramedChannelAeneas/Extracted/Funs.lean (generated, never hand-edited)"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.Crc8.crc8Bits
    - FramedChannel.Crc8.crc8Table
  module: "lean/FramedChannel/Model/Crc8/Defs.lean (definitions) and lean/FramedChannel/Model/Crc8/Theorems.lean (theorems)"
  representation: "bytes as BitVec 8; the inner eight-iteration loop unrolled as `round` (hand-written model; connected to the extraction by the bridge below)"
  extracted_declarations:
    - framed_channel.crc8.crc8
    - framed_channel.crc8.crc8_table
    - framed_channel.crc8.TABLE
  extracted_representation: "Slice Std.U8 in, Std.U8 out, Aeneas Result monad; the bitwise inner loop over the i32 range 0..8, the outer loops over the slice iterator"
  parameters: "polynomial 0x07, initial value 0, no reflection, no final xor (crc8 \"123456789\" = 0xF4)"

bridge:
  modules:
    - aeneas/FramedChannelAeneas/Bridge/Crc8/Defs.lean
    - aeneas/FramedChannelAeneas/Bridge/Crc8/Bitwise.lean
    - aeneas/FramedChannelAeneas/Bridge/Crc8/Table.lean
    - aeneas/FramedChannelAeneas/Bridge/Crc8/Instance.lean
  abstraction: "FramedChannel.Bridge.crc8.bitsOf (aeneas/FramedChannelAeneas/Bridge/Crc8/Defs.lean): each machine byte to its BitVec 8; a digest is compared through .bv"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "the extracted crc8 computes crc8Bits and the extracted crc8_table computes crc8Table, on every slice, never failing; the extracted TABLE is the model's table entry for entry (kernel decide); the table index (crc ^ b) as usize is always in range, so the extraction's none => 0 fallback is dead; and the two extracted functions agree on every slice (crc8_table_eq_extracted), kernel-only. No new bv_decide: every bridge bit-vector fact is kernel decide or definitional, and the flagged crc8_step_linear row below is untouched"

implements:
  interface_L0: FramedChannel.ChecksumModel
  interface_L1: FramedChannel.ChecksumLaws
  instances:
    - FramedChannel.Crc8.instChecksumLawsBitwise
    - FramedChannel.Crc8.instChecksumLawsTabled
  carrier: "FramedChannel.Crc8.Bitwise and FramedChannel.Crc8.Tabled (component tags; a checksum
    is stateless, so the class's representation parameter degenerates to a tag -- recorded, not
    hidden)"
  abstraction: "the digest of a byte list"
  operations: "ChecksumModel fields step, seed, digest"
  laws: "two: digest_nil (the fold law), digest_snoc (the step law)"
  equivalence: "the two instances are the `table CRC-8 = bitwise CRC-8` row in interface
    terms: one interface, two models, agreeing digests on every input (crc8_table_eq_bits)"
  extracted_instances:
    - FramedChannel.Bridge.crc8.instChecksumLaws_extractedBitwise
    - FramedChannel.Bridge.crc8.instChecksumLaws_extractedTabled
  extracted_carrier: "FramedChannel.Bridge.crc8.ExtractedBitwise and ExtractedTabled (component tags): step is the extracted inner loop on crc ^ b (bitwise) or the lookup into the extracted TABLE (table), seed is 0, and digest is the extracted crc8 / crc8_table on the slice holding the bytes, lowered through Result.match, whenever bs.length <= usize::MAX. DIGEST FALLBACK, recorded rather than hidden: ChecksumModel.digest is total over List (BitVec 8) but an Aeneas Slice holds at most Usize.max bytes, and digest_snoc must hold across that boundary, so a list longer than any Rust slice digests by the model fold (crc8Bits / crc8Table) instead. On every list a Rust slice can hold the digest IS the extracted function. The primary claims crc8_refines and crc8_table_refines quantify over every Slice and have no fallback"
  rust_counterpart: "rust/src/crc8.rs's crc8 and crc8_table; exercised by
    crc8_bitwise_agrees_with_table in rust/tests/differential.rs (262 inputs)"

assumptions: []

guarantees:
  - table_and_bitwise_agree_on_every_input
  - table_index_always_in_range
  - gf2_linearity_of_the_byte_step
  - terminates: "structurally (fixed unrolled loop, fold over a finite list)"

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails
  # when its recorded spec_digest in approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.Crc8
    covers: "linearity (bv_decide and kernel), the table/bitwise equivalence, index range and both ChecksumLaws instances"
  - challenge: FramedChannelAeneasChallenge.Crc8
    covers: "the extracted checksum: table agreement, both refinements, their equivalence and the two instances"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

proofs:
  - name: FramedChannel.Crc8.crc8_table_eq_bits
    status: "[PROVED: kernel]"
    role: "equivalence: table lookup = bitwise loop, on every input"
  - name: FramedChannel.Crc8.stepTable_index_in_range
    status: "[PROVED: kernel]"
    role: "failure-freedom: the getD default is unreachable"
  - name: FramedChannel.Crc8.crc8_step_linear
    status: "[PROVED: compiler-trusting]"
    role: "GF(2)-linearity of the byte step, by bv_decide (a SAT call)"
    flagged: "this is the example's ONE compiler-trusting declaration. Its axiom record carries
      a native bv_decide helper axiom (crc8_step_linear._native.bv_decide.ax_1_26 on
      the project toolchain, `lean/lean-toolchain`); check.sh's axiom gate permits that for this
      declaration alone, by an explicit one-entry allow-list, and fails the run for any other.
      The registry registers it with verified := false, so it scores 0."
  - name: FramedChannel.Crc8.crc8_step_linear_kernel
    status: "[PROVED: kernel]"
    role: "kernel replay of crc8_step_linear, from shift1_xor and round_xor; NOT a replacement
      for the bv_decide row, which stays counted as unverified"
  - name: FramedChannel.Crc8.instChecksumLawsBitwise
    status: "[PROVED: kernel]"
    role: "refinement certificate as an interface instance (bitwise)"
  - name: FramedChannel.Crc8.instChecksumLawsTabled
    status: "[PROVED: kernel]"
    role: "the same laws at the table implementation, discharged from the bitwise instance through crc8_table_eq_bits -- the core counterpart of the bridge's two extracted ChecksumLaws instances"
  - name: FramedChannel.Bridge.crc8.table_agrees
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted TABLE is the model's table, entry for entry (kernel decide)"
  - name: FramedChannel.Bridge.crc8.crc8_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted bitwise crc8 computes crc8Bits on every slice, never failing"
  - name: FramedChannel.Bridge.crc8.crc8_table_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted crc8_table computes crc8Table on every slice, never failing; the lookup's none branch is dead"
  - name: FramedChannel.Bridge.crc8.crc8_table_eq_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "equivalence at the extracted level: crc8_table and crc8 return the same byte on every slice (kernel-only)"
  - name: FramedChannel.Bridge.crc8.instChecksumLaws_extractedBitwise
    status: "[EXTRACTED: aeneas + bridge]"
    role: "ChecksumLaws as an interface instance on the extracted bitwise CRC-8 (digest fallback beyond usize::MAX, see implements.extracted_carrier)"
  - name: FramedChannel.Bridge.crc8.instChecksumLaws_extractedTabled
    status: "[EXTRACTED: aeneas + bridge]"
    role: "ChecksumLaws as an interface instance on the extracted table-driven CRC-8 (same fallback)"

supporting:
  - name: FramedChannel.Crc8.table_entry
    status: "[PROVED: kernel]"
    role: "per-entry lemma, 256 cases by kernel decide"
  - name: FramedChannel.Crc8.table_size
    status: "[PROVED: kernel]"
    role: "the table has exactly 256 entries"
  - name: FramedChannel.Crc8.shift1_xor
    status: "[PROVED: kernel]"
  - name: FramedChannel.Crc8.round_xor
    status: "[PROVED: kernel]"
  - name: FramedChannel.Bridge.slice_iter_next_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "library-gap step spec (aeneas/FramedChannelAeneas/Bridge/Std.lean): IteratorSliceIter.next, the for-b-in-bytes iterator of both outer loops"
  - name: FramedChannel.Bridge.crc8.and_128_eq_zero_iff
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the inner loop's crc & 0x80 test is the model's msb (kernel decide, no bv_decide)"
  - name: FramedChannel.Bridge.crc8.shift1_of_msb
    status: "[EXTRACTED: aeneas + bridge]"
    role: "one inner iteration with the top bit set is shift1"
  - name: FramedChannel.Bridge.crc8.shift1_of_not_msb
    status: "[EXTRACTED: aeneas + bridge]"
    role: "one inner iteration with the top bit clear is shift1"
  - name: FramedChannel.Bridge.crc8.inner_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the inner loop lemma (loop.spec_decr_nat over the i32 range)"
  - name: FramedChannel.Bridge.crc8.inner_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted inner loop is the model's round; the step spec crc8_refines is walked with, covered by crc8_refines's row"
  - name: FramedChannel.Bridge.crc8.outer_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the bitwise outer loop lemma (loop.spec_decr_nat over the slice iterator)"
  - name: FramedChannel.Bridge.crc8.table_length
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted TABLE has 256 entries"
  - name: FramedChannel.Bridge.crc8.table_index
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the table index keeps its value through the usize cast and is in range: the extracted counterpart of stepTable_index_in_range"
  - name: FramedChannel.Bridge.crc8.table_entry_bv
    status: "[EXTRACTED: aeneas + bridge]"
    role: "an entry the extracted lookup returns is the model's stepTable"
  - name: FramedChannel.Bridge.crc8.table_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the table loop lemma (loop.spec_decr_nat over the slice iterator)"
  - name: FramedChannel.Bridge.crc8.bitsOf_bitsToSlice
    status: "[EXTRACTED: aeneas + bridge]"
    role: "a bit-vector list read back from its machine slice"
  - name: FramedChannel.Bridge.crc8.extStepBits_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered extracted bitwise step is stepBits"
  - name: FramedChannel.Bridge.crc8.extStepTable_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted TABLE lookup is stepTable"
  - name: FramedChannel.Bridge.crc8.extDigestBits_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered extracted bitwise digest is crc8Bits on every list"
  - name: FramedChannel.Bridge.crc8.extDigestTable_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered extracted table digest is crc8Table on every list"

dependencies:
  - "Std.Tactic.BVDecide (bundled with the toolchain) for crc8_step_linear only"
  - "BitVec, List.foldl_append (Lean core)"
  - "no Mathlib in lean/"
  - "bridge only: the Aeneas Lean library pinned by `aeneas/lake-manifest.json` (loop.spec_decr_nat, step*, scalar, Slice and Array specs), Function.iterate_succ_apply (Lean core); requires the Mathlib version aeneas/lake-manifest.json pins"

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); no crate-local library model is reached. aeneas/FramedChannelAeneas/Bridge/Crc8/ proves that extraction refines the Lean model"

coverage:
  L0_interface: proved
  L1_laws_over_an_abstract_observation: proved
  canonical_model: "proved, twice (Bitwise and Tabled)"
  representation_invariant: "not claimed (a checksum is stateless; the obligation does not arise)"
  abstraction_function_and_refinement: proved
  error_agreement: "not claimed: neither the Lean model nor the Rust has a failure case. crc8 is
    total on every byte list, which is why stepTable_index_in_range is stated as failure-freedom
    instead."
  bounds_or_failure_freedom: proved
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: proved
  ladder: "5 core rows (certificate/ladder.txt): bv_decide (compiler-trusting, the flagged
    row) -- crc8_step_linear; retrieval -- crc8_table_eq_bits; manual -- stepTable_index_in_range;
    manual (excluding bv_decide) -- crc8_step_linear_kernel, whose audit skips bv_decide and
    discounts any closer resting on a compiler-trusting axiom (exact? otherwise retrieves
    crc8_step_linear itself); instance -- instChecksumLawsBitwise. The bridge rows are not laddered."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound}
      EXCEPT crc8_step_linear, which carries a native bv_decide helper axiom and is on
      check.sh's one-entry flagged allow-list. No sorryAx."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
      flagged_rows:
        comparator: "FramedChannel.Crc8.crc8_step_linear has its own config (flagged-FramedChannel.Crc8.crc8_step_linear.json, trusted axioms only), and its recheck.txt line is EXPECTED-REJECTION, exactly Illegal axiom detected: 'FramedChannel.Crc8.crc8_step_linear._native.bv_decide.ax_1_26'. Comparator compares statements before it checks axioms, so this establishes that its statement equals the Challenge's. Its kernel acceptance by Comparator is NOT established (the axiom check stops the run first); the row stays [PROVED: compiler-trusting], registered unverified, and scores 0. Its kernel twin crc8_step_linear_kernel is in core.json and covered by the shared comparator entry"
        lean4lean: "Lean4Lean accepted FramedChannel.Crc8.crc8_step_linear GIVEN its native bv_decide helper axiom, which it takes as an axiom: the SAT result behind it is still trusted, not checked"
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/crc8.rs to
      aeneas/FramedChannelAeneas/Extracted/; the bridge proves that output refines the Lean
      model, so the extractor, not a hand transcription, performs the translation step"
    validation: "validated on 268 recorded inputs (crc8_agrees_with_extracted_vectors in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): on every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on the digest of the extracted crc8 and of the extracted crc8_table on the six named messages (including the check value 0xF4), and of crc8 on the 256 incremental prefixes. That is direct evidence against a translation fault on those inputs; with the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries, or on paths none reaches (messages longer than any record, and the digest fallback beyond usize::MAX, which no slice reaches); release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the extracted loop is a partial_fixpoint, evaluated, never kernel-reduced)."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the same 268 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the hand-written model, u8 is BitVec 8, which is exact, and the shift-and-xor
      loop is unrolled by hand into `round`; in the extraction, Aeneas's Std.U8, Usize, Slice,
      Array, slice-iterator and range library models, trusted as shipped"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half is proved, and crc8_refines/crc8_table_refines prove the extraction refines both models; crc8_agrees_with_extracted_vectors (268 inputs: the six named messages at both functions and the 256 incremental prefixes, as one compact record whose input rule the vector file's header states) ties the extraction to the compiled Rust; crc8_bitwise_agrees_with_table runs 262 inputs Rust-against-Rust beside it. Per-scenario input counts and the seed record are printed by cargo test -- --nocapture. Finite fixed vectors: testing, not proof, which is why the verdict is validated and not verified."
    approval: "the Challenge modules under specification: above are approved in approvals.yaml,
      which records whether a person or an agent approved each; that these statements say what the
      component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/crc8.rs and lean/FramedChannel/Model/Crc8/Theorems.lean in digests.txt; each
      registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each
      listed Challenge module's spec_digest (SpecCheck's closure digest, 64-bit and toolchain-bound)
      and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

composite_trust_note: "This component is NOT verified as a whole. crc8_step_linear is
  compiler-trusting, and a composite is never more trusted than its least trusted part: any claim
  that reaches through crc8_step_linear inherits that verdict. The kernel replay
  crc8_step_linear_kernel exists so that nothing else has to."

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "crc8_step_linear as a kernel-checked fact (it is bv_decide; its kernel replay is a separate
    declaration and a separate row)"
  - "cryptographic strength: CRC-8 detects accidental corruption, not deliberate tampering"
  - "the extracted ChecksumLaws digest on a list longer than usize::MAX: no Rust slice holds one, and there the instance digests by the model fold (recorded in implements.extracted_carrier)"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
