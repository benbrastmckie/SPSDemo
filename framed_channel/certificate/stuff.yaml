# Certificate manifest for the HDLC-style byte-stuffing codec. Every claim line carries one of the
# fixed honesty tags; see README.md in this directory for the tag vocabulary. Generated values
# (axiom lines, digests, the certificate identity) are read from axioms.txt and digests.txt, which
# check.sh regenerates.

component: Stuff

source:
  file: rust/src/stuff.rs
  symbol: "stuff, encode_frame, unstuff"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction, the whole-crate extraction described in ring_buffer.yaml; stuff, encode_frame and unstuff are output as stuff.stuff / stuff.encode_frame / stuff.unstuff, the first and third each a loop over Aeneas's loop combinator, in aeneas/FramedChannelAeneas/Extracted/Funs.lean (generated, never hand-edited)"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.Stuff.stuff
    - FramedChannel.Stuff.encode
    - FramedChannel.Stuff.decode
  module: "lean/FramedChannel/Model/Stuff/Defs.lean (definitions) and lean/FramedChannel/Model/Stuff/Theorems.lean (theorems)"
  representation: "bytes as Nat below 256; `stuff` structurally recursive on the payload and `unstuff` structurally recursive on the wire in a three-pattern form ([], [b], b :: c :: bs), which is load-bearing rather than stylistic: only that form yields the unconditional equation lemmas the round-trip proof rewrites with. No fuel argument is needed (hand-written model; connected to the extraction by the bridge below)"
  extracted_declarations:
    - framed_channel.stuff.stuff
    - framed_channel.stuff.encode_frame
    - framed_channel.stuff.unstuff
  extracted_representation: "payload and wire as Std.U8 in alloc.vec.Vec / Slice, Aeneas Result monad; stuff loops over the payload indices with stride one, unstuff over the wire indices with stride one or two depending on the escape branch, and unstuff returns core.result.Result ((Vec U8) x Usize) stuff.UnstuffError -- the payload with the number of bytes consumed, the terminating flag included"

bridge:
  modules:
    - aeneas/FramedChannelAeneas/Bridge/Stuff/Defs.lean
    - aeneas/FramedChannelAeneas/Bridge/Stuff/Stuff.lean
    - aeneas/FramedChannelAeneas/Bridge/Stuff/Unstuff.lean
    - aeneas/FramedChannelAeneas/Bridge/Stuff/Instance.lean
  abstraction: "FramedChannel.Bridge.stuff.bytesOf (aeneas/FramedChannelAeneas/Bridge/Stuff/Defs.lean): each machine byte to its Nat value"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "the extracted stuff appends exactly the model's stuffed payload and the extracted encode_frame appends that followed by the terminating flag; the extracted unstuff succeeds exactly where the model succeeds, with the same payload and the same residual bytes, and returns Err exactly where the model refuses. That last agreement is an exact iff, stronger than the varint codec's, whose Overlong rejection is stricter than its own model: for byte stuffing there is no input the Rust refuses and the model accepts, or the other way round. The extracted unstuff also inverts the extracted encode_frame, consuming every byte written. Every triple is total correctness, so no extracted function panics, overflows or diverges; the only side conditions are the explicit Vec::push failure-freedom hypotheses on the two encode-side rows"

implements:
  interface_L0: FramedChannel.CodecModel
  interface_L1: FramedChannel.CodecLaws
  instance: FramedChannel.Stuff.instCodecLaws
  carrier: "FramedChannel.Stuff.Hdlc (a component tag; a codec is stateless, so the class's
    representation parameter degenerates to a tag -- recorded, not hidden)"
  abstraction: "the decode observation: the decoded payload together with the residual bytes"
  operations: "CodecModel fields encode, decode, maxLen, Dom"
  laws: "two: round_trip, length_le"
  extracted_instance: FramedChannel.Bridge.stuff.instCodecLaws_extracted
  extracted_carrier: "FramedChannel.Bridge.stuff.ExtractedHdlc over List Nat, with Dom repeating the model's: encode runs the extracted encode_frame on an empty vector, decode runs the extracted unstuff on the slice holding the bytes (a list no Rust byte slice can hold, or one carrying a value of 256 or more, is refused), both lowered through Result.match. Unlike the varint codec, whose values are machine u32s, a stuffing payload has no machine counterpart smaller than the byte list itself, so the extracted instance is stated over List Nat exactly as the model's is"
  rust_counterpart: "rust/src/stuff.rs's stuff / encode_frame / unstuff; compared against the
    extracted-evaluation vectors by stuff_agrees_with_extracted_vectors in
    rust/tests/differential.rs (stuffed bytes, framed bytes, decode results, consumed counts and
    error variants), and covered by extracted_vectors_cover_every_translated_operation's census,
    whose branches array names all three unstuff outcomes and whose total array names stuff.stuff
    and stuff.encode_frame"

assumptions:
  - "model only: Dom p is (forall b in p, b < 256) and p.length <= 255 (the claimed domain, CodecModel.Dom of the Nat model). maxPayload = 255 is this unit's ONE genuinely discretionary modelling choice and is recorded as such: CodecLaws.length_le bounds an encoding by a CONSTANT maxLen, while stuffing expands with its input, so the unconditional form of that law is false. 255 keeps a stuffed frame under 512 bytes on the wire and keeps the necessity countermodel decidable in the kernel. The alternative considered and rejected was parity with channel.rs's u32::try_from payload guard (maxPayload = 2^32 - 1), which is more coherent with the existing composite but makes the countermodel non-decidable in the kernel, losing the Evidence/Countermodels.lean row every other domain hypothesis in this repository carries"
  - "the unconditional, input-relative bounds carry NO domain hypothesis: stuff_length_le and encode_length_le hold at every payload. Only the Dom-bounded CodecLaws.length_le field, discharged inside the instance, needs p.length <= 255. Likewise stuff_roundtrip needs no hypothesis at all -- byte stuffing round-trips at every payload, bounded or not, which is stronger than the Varint analogue"
  - "extracted rows: stuff_refines assumes out.len() + 2 * payload.len() <= usize::MAX and encode_frame_refines the same plus one for the flag -- room for the bytes they may push. The bound is input-relative rather than constant because stuffing expands with its input; it is the analogue of varint.encode_refines's out.len() + 5 <= usize::MAX and is carried as an explicit hypothesis rather than hidden by strengthening the claim. roundtrip_extracted assumes 2 * payload.len() + 1 <= usize::MAX, the same bound from an empty vector. The decode-side rows assume nothing"
  - "stuff.rs declares its OWN MARKER (0x7E), ESC (0x7D) and XOR_MASK (0x20) rather than re-using channel::MARKER. The duplication of the 0x7E flag byte between rust/src/stuff.rs and rust/src/channel.rs is INTENTIONAL and is recorded here so it is auditable: Channel does not stuff, so the two constants mean different things (the composite's own frame boundary, and this unit's transparency flag), and a cross-module `use` would restale channel.rs's source_sha256 for no formal gain. Both constants are named in this line for exactly that reason. Nothing proves the two agree; if one is changed the other does not follow"

guarantees:
  - marker_free_encoding: "a stuffed payload contains no frame boundary byte, which is what makes the decoder's scan-to-flag unambiguous"
  - round_trip_at_every_payload: "no domain hypothesis"
  - stuffing_at_most_doubles: "unconditional and input-relative"
  - framed_length_at_most_twice_the_payload_plus_one
  - terminates: "structurally, on the payload and on the wire; no fuel argument"

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails
  # when its recorded spec_digest in approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.Stuff
    covers: "the marker-free invariant, the round trip, the two bounds and the CodecLaws instance"
  - challenge: FramedChannelAeneasChallenge.Stuff
    covers: "the extracted codec: stuff and encode_frame refinement, decode success agreement, completeness, error agreement, the round trip and the instance"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

proofs:
  - name: FramedChannel.Stuff.stuff_marker_free
    status: "[PROVED: kernel]"
    role: "the marker-free encoding invariant: a stuffed payload contains no frame boundary byte. Not one of the two CodecLaws laws, and registered on its own row: it is what makes the decoder's scan-to-flag unambiguous, so the round trip rests on it"
  - name: FramedChannel.Stuff.stuff_roundtrip
    status: "[PROVED: kernel]"
    role: "round trip (the D o E = id row), at every payload, with no domain hypothesis"
  - name: FramedChannel.Stuff.stuff_length_le
    status: "[PROVED: kernel]"
    role: "bounds: stuffing at most doubles the payload -- unconditional and input-relative, so strictly more informative than the constant CodecLaws.length_le demands"
  - name: FramedChannel.Stuff.encode_length_le
    status: "[PROVED: kernel]"
    role: "bounds on the whole frame: the stuffed payload plus the one terminating flag byte; discharges CodecLaws.length_le together with Dom's length bound"
  - name: FramedChannel.Stuff.instCodecLaws
    status: "[PROVED: kernel]"
    role: "refinement certificate as an interface instance"
  - name: FramedChannel.Bridge.stuff.stuff_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted stuff appends exactly Stuff.stuff of the abstracted payload; failure freedom of every u8 xor, usize increment and Vec::push"
  - name: FramedChannel.Bridge.stuff.encode_frame_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted encode_frame appends exactly Stuff.encode: the stuffed payload followed by the terminating flag"
  - name: FramedChannel.Bridge.stuff.decode_ok_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "success agreement: an extracted Ok (out, k) is a model success with the same payload and the same residual"
  - name: FramedChannel.Bridge.stuff.decode_complete
    status: "[EXTRACTED: aeneas + bridge]"
    role: "completeness: a model success is an extracted Ok with the same payload, a consumed count within the input, and the same residual"
  - name: FramedChannel.Bridge.stuff.decode_err_iff
    status: "[EXTRACTED: aeneas + bridge]"
    role: "error agreement: extracted Err exactly when the model refuses -- an exact iff, not an implication over a stricter Rust rejection"
  - name: FramedChannel.Bridge.stuff.roundtrip_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "round trip on the extracted code: the extracted unstuff inverts the extracted encode_frame, consuming every byte written (the D o E = id row on the Rust as extracted)"
  - name: FramedChannel.Bridge.stuff.instCodecLaws_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "CodecLaws as an interface instance on the extracted codec (ExtractedHdlc, List Nat)"

supporting:
  - name: FramedChannel.Stuff.escMarker_eq
    status: "[PROVED: kernel]"
    role: "the escaped flag byte is marker xor xorMask (RFC 1662 transparency), checked in the kernel rather than asserted"
  - name: FramedChannel.Stuff.escEsc_eq
    status: "[PROVED: kernel]"
    role: "the escaped escape byte is esc xor xorMask"
  - name: FramedChannel.Stuff.esc_ne_marker
    status: "[PROVED: kernel]"
    role: "the escape byte is not the flag"
  - name: FramedChannel.Stuff.escMarker_ne_marker
    status: "[PROVED: kernel]"
    role: "the escaped flag byte is not the flag"
  - name: FramedChannel.Stuff.escEsc_ne_marker
    status: "[PROVED: kernel]"
    role: "the escaped escape byte is not the flag"
  - name: FramedChannel.Stuff.stuffByte_marker
    status: "[PROVED: kernel]"
    role: "per-byte equation: the flag byte becomes esc, escMarker"
  - name: FramedChannel.Stuff.stuffByte_esc
    status: "[PROVED: kernel]"
    role: "per-byte equation: the escape byte becomes esc, escEsc"
  - name: FramedChannel.Stuff.stuffByte_other
    status: "[PROVED: kernel]"
    role: "per-byte equation: any other byte is copied through"
  - name: FramedChannel.Stuff.stuffByte_marker_free
    status: "[PROVED: kernel]"
    role: "no byte of a stuffed byte is the flag; the per-byte core of stuff_marker_free"
  - name: FramedChannel.Stuff.unstuff_cons_plain
    status: "[PROVED: kernel]"
    role: "an unreserved byte at the head of a non-empty wire is payload"
  - name: FramedChannel.Stuff.stuff_append_marker_ne_nil
    status: "[PROVED: kernel]"
    role: "a stuffed payload followed by the flag is never the empty wire; discharges unstuff_cons_plain's side condition"
  - name: FramedChannel.Stuff.unstuff_stuff
    status: "[PROVED: kernel]"
    role: "the decoder's loop invariant, generalized over the accumulator and the residual; stuff_roundtrip is its instance at empty"
  - name: FramedChannel.Stuff.stuff_bytes_lt
    status: "[PROVED: kernel]"
    role: "the encoder preserves the byte range, so Dom's byte-range condition survives encoding"
  - name: FramedChannel.Bridge.stuff.MARKER_val
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted MARKER const's value, read off once (the extraction emits each pub const as irreducible)"
  - name: FramedChannel.Bridge.stuff.ESC_val
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted ESC const's value"
  - name: FramedChannel.Bridge.stuff.marker_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the model's marker is the extracted MARKER's value"
  - name: FramedChannel.Bridge.stuff.esc_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the model's esc is the extracted ESC's value"
  - name: FramedChannel.Bridge.stuff.marker_xor
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the machine xor MARKER ^ XOR_MASK is the model's escMarker"
  - name: FramedChannel.Bridge.stuff.esc_xor
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the machine xor ESC ^ XOR_MASK is the model's escEsc"
  - name: FramedChannel.Bridge.stuff.stuff_nil
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model fact: stuffing the empty payload is empty"
  - name: FramedChannel.Bridge.stuff.bytesOf_length
    status: "[EXTRACTED: aeneas + bridge]"
    role: "abstraction preserves length"
  - name: FramedChannel.Bridge.stuff.bytesOf_append
    status: "[EXTRACTED: aeneas + bridge]"
    role: "abstraction commutes with append"
  - name: FramedChannel.Bridge.stuff.bytesOf_drop_cons
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the abstracted slice's suffix at an index, peeled into the byte there and the rest"
  - name: FramedChannel.Bridge.stuff.bytesOf_push_reverse
    status: "[EXTRACTED: aeneas + bridge]"
    role: "pushing one byte prepends its value to the model's reversed accumulator"
  - name: FramedChannel.Bridge.stuff.getElem?_some_lt
    status: "[EXTRACTED: aeneas + bridge]"
    role: "list fact: a successful optional index is in range"
  - name: FramedChannel.Bridge.stuff.eq_getElem_of_getElem?
    status: "[EXTRACTED: aeneas + bridge]"
    role: "list fact: a successful optional index yields that element"
  - name: FramedChannel.Bridge.stuff.unstuff_nil
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model equation: the empty wire refuses"
  - name: FramedChannel.Bridge.stuff.unstuff_marker
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model equation: the flag ends the frame, whatever follows it"
  - name: FramedChannel.Bridge.stuff.unstuff_plain
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model equation: an ordinary byte is payload, whatever follows it. Deliberately drops the w != [] side condition the core's unstuff_cons_plain carries, because the empty case is also an agreement (both sides refuse) -- which is what lets the loop's plain branch and its final Truncated exit share one lemma"
  - name: FramedChannel.Bridge.stuff.unstuff_esc_last
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model equation: an escape at the very end of the wire refuses"
  - name: FramedChannel.Bridge.stuff.unstuff_esc_marker
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model equation: an escaped flag byte unescapes to the flag"
  - name: FramedChannel.Bridge.stuff.unstuff_esc_esc
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model equation: an escaped escape byte unescapes to the escape byte"
  - name: FramedChannel.Bridge.stuff.unstuff_esc_bad
    status: "[EXTRACTED: aeneas + bridge]"
    role: "model equation: an escape followed by neither escaped value refuses"
  - name: FramedChannel.Bridge.stuff.stuff_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the stuff loop lemma (loop.spec_decr_nat, measure payload.len() - i, invariant StuffInv). The invariant is phrased on the payload's REMAINING suffix rather than its consumed prefix, which is what lets the model's own defining equation discharge each stuffing branch with no stuff (xs ++ ys) distribution lemma"
  - name: FramedChannel.Bridge.stuff.stuff_out_length
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the stuffed output is never longer than twice the payload, so the vector still has room for the flag"
  - name: FramedChannel.Bridge.stuff.unstuff_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the unstuff loop lemma (loop.spec_decr_nat, measure wire.len() - i, invariant UnstuffInv, post UnstuffPost). The loop advances by ONE OR TWO indices depending on the escape branch, so the measure is the remaining wire rather than a counter -- a genuine difference from varint's fixed-iteration loops -- and the body has seven exits, each discharged by one model equation lemma above"
  - name: FramedChannel.Bridge.stuff.unstuff_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted unstuff is related to the model by UnstuffPost; the three decode rows are its corollaries"
  - name: FramedChannel.Bridge.stuff.bytesOf_sliceOfBytes
    status: "[EXTRACTED: aeneas + bridge]"
    role: "re-slicing a list of bytes and abstracting it back is the identity on the domain; used by instCodecLaws_extracted"
  - name: FramedChannel.Bridge.stuff.sliceOfBytes_length
    status: "[EXTRACTED: aeneas + bridge]"
    role: "re-slicing preserves length"
  - name: FramedChannel.Bridge.stuff.encode_bytes_lt
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the framed encoding stays inside the byte range"
  - name: FramedChannel.Bridge.stuff.extEncode_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "on the claimed domain the extracted encode_frame produces literally the model's encode; the load-bearing step that lets both extracted laws reduce to model facts rather than be reproved over machine values"

dependencies:
  - "List.drop_eq_getElem_cons, List.drop_eq_nil_of_le, List.getElem?_eq_none_iff, List.getElem?_eq_getElem, List.map_congr_left, List.map_id, Nat.mod_eq_of_lt (Lean core)"
  - "no Mathlib in lean/; no other module of this example except the specification's Result and Codec modules"
  - "bridge only: the Aeneas Lean library pinned by `aeneas/lake-manifest.json` (loop.spec_decr_nat, step*, scalar_tac, Vec and Slice specs); requires the Mathlib version aeneas/lake-manifest.json pins. No new library-gap step specification was needed: Bridge/Std.lean is untouched by this unit"

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); no crate-local library model is reached, and no new external name appeared -- Extracted/FunsExternal.lean is unchanged by this unit. aeneas/FramedChannelAeneas/Bridge/Stuff/ proves that extraction refines the Lean model"

coverage:
  L0_interface: proved
  L1_laws_over_an_abstract_observation: proved
  canonical_model: proved
  representation_invariant: "not claimed (a codec is stateless; there is no concrete state to
    constrain, so this obligation does not arise rather than being skipped)"
  abstraction_function_and_refinement: proved
  error_agreement: "proved at the extracted level, and as an exact iff: decode_err_iff states that
    the extracted unstuff returns Err exactly when the model refuses. Unlike the varint codec there
    is no region where the Rust is stricter than the model. The Lean model has one .fail with no
    error taxonomy, so the split between Err(Truncated) and Err(BadEscape) is not characterised by
    a theorem; the variants are checked against the Rust by stuff_agrees_with_extracted_vectors in
    rust/tests/differential.rs, whose records carry the variant, and the census in
    extracted_vectors_cover_every_translated_operation names both (validated, not verified)."
  bounds_or_failure_freedom: proved
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: proved
  ladder: "4 core rows plus the instance (certificate/ladder.txt): manual --
    stuff_marker_free, stuff_length_le, encode_length_le; retrieval -- stuff_roundtrip (it names
    unstuff_stuff); instance -- instCodecLaws. Every label was validated by building: the ladder
    audit runs each strictly cheaper rung's canonical attempt first and fails the build naming the
    cheaper rung, so no label here is a guess. The bridge rows are not laddered."
  countermodels: "two, both kernel-only and both about this unit's bounds (certificate/countermodels.txt,
    lean/FramedChannel/Evidence/Countermodels.lean). encode_no_expansion -- that framing costs at
    most the one flag byte -- is refuted at [marker], the single reserved byte that becomes a
    two-byte escape. stuff_maxLen_unbounded -- the constant maxLen bound WITHOUT Dom's
    p.length <= 255 -- is refuted at List.replicate 256 marker, which stuffs to 512 bytes and
    frames to 513. The second is why that conjunct of Dom is there, so the discretionary
    maxPayload = 255 choice recorded under assumptions: is shown to be load-bearing rather than
    decorative."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound};
      no sorryAx, no compiler-trusting axiom. The four countermodel declarations depend on no
      axioms at all. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/stuff.rs to
      aeneas/FramedChannelAeneas/Extracted/; the bridge proves that output refines the Lean
      model, so the extractor, not a hand transcription, performs the translation step"
    validation: "validated on 23 recorded inputs (stuff_agrees_with_extracted_vectors in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): 7 payloads through stuff, the same 7 through encode_frame, and 9 wires through unstuff. On every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on the stuffed bytes, the framed bytes, and the decode result: the payload, the consumed count, and the error variant (Truncated or BadEscape). The payloads include both reserved bytes alone and together and an all-reserved payload (the worst case for the length bound); the wires cover success with and without residual bytes, a wire with no terminating flag, the empty wire, a wire ending inside an escape, and two bad escapes -- so both truncation exits of the extracted code and the bad-escape exit are each reached. That is direct evidence against a translation fault on those inputs; with the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries, or on paths none reaches (a stuff into a vector within two bytes of usize::MAX, or a payload longer than the recorded ones); release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the extracted loops are partial_fixpoints, evaluated, never kernel-reduced)."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the same 23 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the hand-written model, bytes are Nat below 256 and the byte range is Dom's
      forall b in p, b < 256 condition, with termination structural on the payload and on the wire;
      in the extraction, Aeneas's Std.U8/Usize, Vec, Slice and loop library models, trusted as
      shipped, where the byte range is the type itself and the loops are partial_fixpoints"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half is proved, and stuff_refines/encode_frame_refines/unstuff_refines prove the extraction refines the model, with decode_err_iff stating that the refusal sets coincide exactly; stuff_agrees_with_extracted_vectors (23 inputs: 7 payloads through stuff, 7 through encode_frame, 9 wires through unstuff) ties the extraction's results, error variants and consumed counts to the compiled Rust. That the test actually consumes the vectors rather than passing vacuously was demonstrated, not assumed: perturbing an encode_frame flag byte and an unstuff error variant each made it fail, and the record-count guard (assert inputs.count > before) makes an empty vector set fail loudly. extracted_vectors_cover_every_translated_operation's census names all three unstuff outcomes and both encode-side operations, and its array-length annotations turn a half-done census edit into a compile error. Per-scenario input counts and the seed record are printed by cargo test -- --nocapture. Finite fixed vectors: testing, not proof, which is why the verdict is validated and not verified."
    approval: "the Challenge modules under specification: above are approved in approvals.yaml,
      which records whether a person or an agent approved each; that these statements say what the
      component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/stuff.rs and lean/FramedChannel/Model/Stuff/Theorems.lean in digests.txt;
      the registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each
      listed Challenge module's spec_digest (SpecCheck's closure digest, 64-bit and toolchain-bound)
