# Certificate manifest for the list-backed bounded queue, the SECOND instance of the queue
# interface. Every claim line carries one of the fixed honesty tags; see README.md in this
# directory. Generated values are read from axioms.txt and digests.txt, which check.sh
# regenerates.

component: VecQueue

source:
  file: rust/src/queue.rs
  symbol: "VecQueue<T>"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction, the whole-crate extraction described in ring_buffer.yaml; VecQueue<T> is output as queue.VecQueue T in aeneas/FramedChannelAeneas/Extracted/Funs.lean (generated, never hand-edited), whose pop reaches the crate-local trusted model of Vec::remove in Extracted/FunsExternal.lean (a definition with a proved spec)"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.VecQueue.VQ.push
    - FramedChannel.VecQueue.VQ.pop
  module: "lean/FramedChannel/Model/VecQueue/Defs.lean (definitions) and lean/FramedChannel/Model/VecQueue/Theorems.lean (theorems)"
  representation: "items : List a (the logical contents itself) plus a bound cap : Nat (hand-written model; connected to the extraction by the bridge below)"
  extracted_declaration: framed_channel.queue.VecQueue
  extracted_representation: "items : alloc.vec.Vec T, cap : Std.Usize, Aeneas Result monad, a Clone trait record only (no Default)"

bridge:
  module: aeneas/FramedChannelAeneas/Bridge/VecQueue/Refinement.lean
  abstraction: "FramedChannel.Bridge.vec_queue.toModel (aeneas/FramedChannelAeneas/Bridge/VecQueue/Defs.lean): the Vec to its List, cap to its Nat value; total, no invariant"
  simulation: "FramedChannel.Bridge.vec_queue.sim: the extracted BoundedQueue record instance simulates VQ through toModel s = q (FramedChannel.Bridge.QueueSim), at every Clone record"
  instance: "FramedChannel.Bridge.vec_queue.instBoundedQueueLaws_extracted (aeneas/FramedChannelAeneas/Bridge/VecQueue/Instance.lean): the six laws on the extracted carrier ExtractedVQ, through the same generic FramedChannel.Bridge.QueueSim.boundedQueueLaws as the ring buffer -- two extracted instances of one interface"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "the extracted push and pop refine VQ's with no hypothesis beyond the branch condition: Vec::push's overflow obligation len < usize::MAX follows from len < cap <= usize::MAX, carried by the machine integer cap; pop moves the element out with Vec::remove(0), so no Clone assumption is needed"

implements:
  interface_L0: FramedChannel.QueueModel
  interface_L1: FramedChannel.BoundedQueueLaws
  instance: FramedChannel.VecQueue.instBoundedQueueLaws
  abstraction: "toList q = q.items (the identity: the representation IS the abstract contents)"
  invariant: "none needed -- push refuses once cap <= items.length, so every value of VQ a
    satisfies the laws as stated. Contrast RingBuffer, which needs the Inv subtype."
  carrier: "FramedChannel.VecQueue.VQ (no subtype)"
  extracted_instance: FramedChannel.Bridge.vec_queue.instBoundedQueueLaws_extracted
  extracted_carrier: "FramedChannel.Bridge.vec_queue.ExtractedVQ: FramedChannel.Bridge.Ext at the extracted VecQueue BoundedQueue record and toModel s = q; every extracted state lies on it, and its push, pop, full, empty and capacity are the extracted functions lowered through Result.match"
  operations: "QueueModel fields push, pop, toList, full, empty, capacity"
  laws: "six: push_law, pop_law, full_law, empty_law, not_full_of_lt, push_capacity"
  rust_counterpart: "rust/src/queue.rs's VecQueue<T>, field for field; exercised by
    bounded_queue_laws_vec_queue (34 inputs) and by every _vec_queue channel scenario in
    rust/tests/differential.rs"

purpose: "This component exists to make substitution real rather than asserted. Because the
  interface has two instances, a theorem proved from the laws alone -- Channel.deliver_spec --
  is used unchanged at both (deliver_spec_RB, deliver_spec_VQ), which is the C[B/A] row.
  Dropping this component would leave that row with one instance and nothing to substitute."

assumptions: []

guarantees:
  - satisfies_all_six_bounded_queue_laws
  - push_keeps_the_item_count_within_cap
  - error_agreement_on_full_and_on_empty
  - terminates: "structurally (no loop)"

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails
  # when its recorded spec_digest in approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.VecQueue
    covers: "the VQ BoundedQueueLaws instance and push_bounded"
  - challenge: FramedChannelAeneasChallenge.VecQueue
    covers: "the extracted VecQueue: refinements, agreement, sim, the two transported laws and the instance on the extracted carrier"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

proofs:
  - name: FramedChannel.VecQueue.instBoundedQueueLaws
    status: "[PROVED: kernel]"
    role: "refinement certificate as an interface instance, all six laws"
  - name: FramedChannel.VecQueue.push_bounded
    status: "[PROVED: kernel]"
    role: "bounds: a successful push leaves items.length within cap"
  - name: FramedChannel.Bridge.vec_queue.push_full
    status: "[EXTRACTED: aeneas + bridge]"
    role: "error agreement: at the bound the extracted push returns Err(Full), queue unchanged"
  - name: FramedChannel.Bridge.vec_queue.pop_empty
    status: "[EXTRACTED: aeneas + bridge]"
    role: "error agreement: on an empty queue the extracted pop returns None, queue unchanged"
  - name: FramedChannel.Bridge.vec_queue.push_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted push refines VQ.push below the bound; failure freedom including the Vec::push overflow obligation, with no hypothesis"
  - name: FramedChannel.Bridge.vec_queue.pop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted pop refines VQ.pop on a non-empty queue"
  - name: FramedChannel.Bridge.vec_queue.capacity_agrees
    status: "[EXTRACTED: aeneas + bridge]"
  - name: FramedChannel.Bridge.vec_queue.len_agrees
    status: "[EXTRACTED: aeneas + bridge]"
  - name: FramedChannel.Bridge.vec_queue.is_full_agrees
    status: "[EXTRACTED: aeneas + bridge]"
  - name: FramedChannel.Bridge.vec_queue.is_empty_agrees
    status: "[EXTRACTED: aeneas + bridge]"
  - name: FramedChannel.Bridge.vec_queue.sim
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted BoundedQueue record simulates VQ (QueueSim), at every Clone record"
  - name: FramedChannel.Bridge.vec_queue.push_law_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "push_law stated directly over the extracted push, from the generic transport at sim; the counterpart of ring_buffer.push_law_extracted"
  - name: FramedChannel.Bridge.vec_queue.pop_law_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "pop_law stated directly over the extracted pop, from the generic transport at sim; the counterpart of ring_buffer.pop_law_extracted"
  - name: FramedChannel.Bridge.vec_queue.instBoundedQueueLaws_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the refinement certificate as an interface instance on the extracted carrier, no trait assumption"

supporting:
  - name: FramedChannel.Bridge.vec_queue.with_capacity_rel
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted VecQueue::with_capacity is the empty VQ of capacity cap"
  - name: FramedChannel.Bridge.vec_queue.rel_functional
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the relation toModel s = q is functional; the hfun input of QueueSim.boundedQueueLaws"

dependencies:
  - "FramedChannel.QueueModel / BoundedQueueLaws (lean/FramedChannel/Spec/Queue.lean)"
  - "List.length_append (Lean core); no Mathlib in lean/"
  - "bridge only: the Aeneas Lean library pinned by `aeneas/lake-manifest.json` (WP.spec_mono, step*, Vec.push_spec) and FramedChannel.Bridge.QueueSim.boundedQueueLaws (see ring_buffer.yaml), which requires the Mathlib version aeneas/lake-manifest.json pins"

recorded_difference:
  - "RingBuffer::with_capacity(0) (Rust) rounds a zero capacity up to one, because 0 < cap is
    part of its representation invariant. VecQueue::with_capacity(0) does NOT round, matching VQ,
    which carries no such invariant. Both sides record the same difference, and
    zero_capacity_differs_as_recorded in rust/tests/differential.rs asserts it."

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); VecQueue::pop reaches the crate-local trusted model of Vec::remove in Extracted/FunsExternal.lean (a definition with a proved spec). aeneas/FramedChannelAeneas/Bridge/VecQueue/ proves that extraction refines the Lean model"

coverage:
  L0_interface: "proved (shared with RingBuffer: one interface, two models)"
  L1_laws_over_an_abstract_observation: proved
  canonical_model: proved
  representation_invariant: "not claimed, and not needed: the laws hold on every value of VQ a.
    This is a real difference from RingBuffer, stated rather than glossed."
  abstraction_function_and_refinement: proved
  error_agreement: proved
  bounds_or_failure_freedom: proved
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: proved
  ladder: "2 core rows (certificate/ladder.txt): grind -- push_bounded; instance --
    instBoundedQueueLaws. The bridge rows are not laddered."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: instBoundedQueueLaws and push_bounded on [propext, Quot.sound]; the
      bridge theorems within {propext, Classical.choice, Quot.sound}; no sorryAx, no
      compiler-trusting axiom"
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/queue.rs's VecQueue<T> to
      aeneas/FramedChannelAeneas/Extracted/; the bridge proves that output refines VQ, so the
      extractor, not a hand transcription, performs the translation step"
    validation: "validated on 56 recorded inputs (vec_queue_agrees_with_extracted_vectors in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): on every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on the push result, the pop result, contents, is_empty, is_full, len and capacity, read through the extracted BoundedQueue record at u32. That is direct evidence against a translation fault on those inputs; with the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries, or on paths none reaches (Vec growth near usize::MAX; the O(n) cost of Vec::remove(0), which no record observes); release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the extracted loop is a partial_fixpoint, evaluated, never kernel-reduced)."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the same 56 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the hand-written model, Vec is a List (append at the back, remove from the
      front); in the extraction, Aeneas's alloc.vec.Vec and Std.Usize library models and the
      crate-local Vec::remove model in Extracted/FunsExternal.lean, trusted as shipped"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half is proved, and sim proves the extraction refines VQ, so on the recorded inputs the model's behavior is the extraction's; vec_queue_agrees_with_extracted_vectors (56 inputs: both branches of push and of pop at capacities 1 and 3, and the cap = 0 trace in which every push is refused, the one recorded difference from the ring buffer) ties that behavior to the compiled Rust; bounded_queue_laws_vec_queue runs the generic six-law harness at VecQueue<u32> for capacities 1 and 3 (34 inputs) beside it. Per-scenario input counts and the seed record are printed by cargo test -- --nocapture. Finite fixed vectors: testing, not proof, which is why the verdict is validated and not verified."
    approval: "the Challenge modules under specification: above are approved in approvals.yaml,
      which records whether a person or an agent approved each; that these statements say what the
      component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/queue.rs and lean/FramedChannel/Model/VecQueue/Theorems.lean in digests.txt;
      each registry row is bound to the elaborated statement hash; and the recorded approvals are current: check.sh's approvals stage checks each
      listed Challenge module's spec_digest (SpecCheck's closure digest, 64-bit and toolchain-bound)
      and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "concurrent use of push/pop (the model is sequential)"
  - "the cost of VecQueue::pop, which is O(n) in Rust (items.remove(0)) and O(1) in the Lean
    model's cons pattern; the algebra is about results, not costs"
  - "the extracted contents (a Vec clone): not bridged (not a QueueModel operation); with_capacity is bridged separately by with_capacity_rel (listed in this manifest), not as a QueueSim field"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
