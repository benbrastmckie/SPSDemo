# Certificate manifest for the resynchronizing receive path: Receiver<Q>, the receive-side
# counterpart of stuffed_channel.yaml's composite. It composes the component manifests below
# through the interface laws, and it introduces one new interface of its own. Every claim line
# carries one of the fixed honesty tags (see README.md in this directory). Axiom lines, digests
# and the certificate identity are read from axioms.txt and digests.txt, which check.sh
# regenerates.

component: Receiver

source:
  file: rust/src/receiver.rs
  symbol: "Receiver::feed, Receiver::poll, Receiver::dropped, Receiver::queued"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"
  generic: "Receiver<Q = RingBuffer<Frame>> with Q: BoundedQueue<Frame>, the Rust picture of the
    Lean Rcv Q generic over any BoundedQueueLaws instance; Receiver::new is the concrete
    constructor at the default queue, Receiver::with_queue the generic one; the receiver test
    scenarios in rust/tests/differential.rs run once each at both RingBuffer<Frame> and
    VecQueue<Frame>"

purpose: "the frame-corruption and resynchronization referent framed_channel/README.md recorded as
  missing. Every other unit here reads a wire its own encoder wrote: StuffedChannel.deliver fails as
  a unit when that wire is malformed and stops. This one accepts an ARBITRARY byte stream, scans
  forward to the next flag, accepts the run it found if the acceptance test reads it, drops and
  counts it otherwise, and resumes at the next flag rather than wedging. It rests on the
  transparency claim stuffed_channel.yaml certifies: resynchronization is sound only BECAUSE a
  stuffed body is marker-free (Stuff.stuff_marker_free, and the composition-layer Transparent
  bundle's body_flag_free), so a flag byte on the wire is unambiguously a frame boundary and never
  payload data. The negative half is refuted in the kernel, over Channel's UNSTUFFED framing, in
  lean/FramedChannel/Evidence/Countermodels.lean (receiver_sound_unstuffed: a payload carrying the
  flag makes scan-to-flag accept a frame that was never sent). This unit is what makes the
  marker-free invariant load-bearing rather than decorative."

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction"
  status: "[HAND-WRITTEN: model; bridged]"
  declarations:
    - FramedChannel.Receiver.Rcv
    - FramedChannel.Receiver.acceptRun
    - FramedChannel.Receiver.EncRun
    - FramedChannel.Receiver.finishRun
    - FramedChannel.Receiver.step
    - FramedChannel.Receiver.feed
    - FramedChannel.Receiver.poll
    - FramedChannel.Receiver.accepted
    - FramedChannel.Receiver.dropped
    - FramedChannel.Receiver.room
    - FramedChannel.Receiver.quiet
    - FramedChannel.Receiver.RcvInv
  module: "lean/FramedChannel/Composition/Receiver/Defs.lean (definitions),
    lean/FramedChannel/Composition/Receiver/Theorems.lean (the laws) and
    lean/FramedChannel/Composition/Receiver/Instances.lean (the laws instance, the two derived
    theorems and the substitution pair); the interface itself is lean/FramedChannel/Spec/Receiver.lean.
    The unit lives under Composition/ and not Model/ because its acceptance test IS
    StuffedChannel.parseStuffed: check.sh's first layer rule forbids a Model/ file from importing a
    Composition/ one, so a Model/Receiver/ would have had to duplicate the run parser"
  representation: "Rcv Q is three fields -- out, the queue of accepted frames; buf, the bytes of the
    run currently being scanned, as a List Nat; dropped, a Nat. feed is a left fold of step over the
    fed bytes, and step either ends the run (at the flag, through finishRun) or appends one byte. The
    acceptance test acceptRun hands the run, terminated by one flag, to StuffedChannel.parseStuffed
    and requires nothing left over -- one line of reuse, not a second parser"
  extracted_declarations:
    - framed_channel.receiver.Receiver
    - framed_channel.receiver.Receiver.with_queue
    - framed_channel.receiver.ReceiverRingBufferVecU8.new
    - framed_channel.receiver.Receiver.feed
    - framed_channel.receiver.Receiver.feed_loop
    - framed_channel.receiver.Receiver.feed_loop.body
    - framed_channel.receiver.Receiver.finish_run
    - framed_channel.receiver.Receiver.poll
    - framed_channel.receiver.Receiver.impl.dropped
    - framed_channel.receiver.Receiver.queued
  extracted_representation: "receiver.Receiver Q is the same three fields with buf a Vec U8 and
    dropped a Usize; every operation returns in the Result monad, and Q's BoundedQueue bound becomes
    an explicit record argument. feed is a loop (feed_loop, feed_loop.body) whose index advances
    unconditionally, so it is bridged with loop.spec_decr_nat on the measure bytes.len() - i"

bridge:
  modules:
    - aeneas/FramedChannelAeneas/Bridge/Receiver/Defs.lean
    - aeneas/FramedChannelAeneas/Bridge/Receiver/Loop.lean
    - aeneas/FramedChannelAeneas/Bridge/Receiver/Refinement.lean
    - aeneas/FramedChannelAeneas/Bridge/Receiver/Instance.lean
  abstraction: "FramedChannel.Bridge.receiver.RcvRel (Bridge/Receiver/Defs.lean): three equations,
    one per field -- the same queue state, the buffered run related through
    Bridge.stuff.bytesOf, and the drop counter by Usize's value. Nothing in the relation bounds
    buf, which is where feed's buffer-length hypothesis comes from"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "finish_run_refines is the loop's own step lemma: the extracted run judgement agrees with
    the model's finishRun, or the run declares a length of 2 ^ 32 or more (the divergence disjunct
    inherited from the reused run parser). feed_loop_refines lifts that to the whole scan on a
    measure that strictly decreases on EVERY branch, the rejected run included, because the Rust's
    i += 1 sits outside every conditional -- the termination argument is structural rather than
    argued. feed_refines and poll_refines are the per-operation triples over any lawful extracted
    queue record; dropped_agrees and queued_agrees are the observer agreements. The four _RB/_VQ rows
    instantiate feed and poll at both extracted queues with no reproof and no remaining QueueSim,
    CloneIsId or Default hypothesis, and new_idle_RB / with_queue_idle_VQ start from the Rust
    constructors so no idle state is assumed. Eleven bridge rows against the transparent channel's
    twenty-four, and the difference is reuse rather than omission: the run parse is
    stuffed_channel.parse_stuffed, already registered and already approved"

composition:
  reading: "feed = fold (accept ∘ parse-run) over the flag-delimited runs of the stream, stated
    precisely: the scan is this unit's own content, the run parse is StuffedChannel.parseStuffed
    used as a black box, and acceptance enters the output queue through QueueModel.push"
  interfaces_reached_generically:
    - "QueueModel / BoundedQueueLaws (push_law, pop_law, toList/full agreement) -- the queue of accepted frames; no proof opens RingBuffer or VQ"
    - "CodecModel at L0, plus the composition-layer Transparent bundle of Composition/StuffedChannel/Defs.lean, instantiated at Stuff.Hdlc / Stuff.marker (instTransparentHdlc) -- the framing codec whose body_flag_free is the load-bearing hypothesis of accepted_sound and feed_frame"
    - "ChecksumModel at L0, instantiated at Crc8.Bitwise -- the check byte inside the run parse"
    - "ReceiverModel / ReceiverLaws (lean/FramedChannel/Spec/Receiver.lean) -- the interface this unit INTRODUCES, and instantiates so that neither class is vacuous"
  new_interface:
    interface_L0: FramedChannel.ReceiverModel
    interface_L1: FramedChannel.ReceiverLaws
    instance: FramedChannel.Receiver.instReceiverLaws
    carrier: "Rcv Q over any QueueModel/BoundedQueueLaws queue, at Stuff.Hdlc, Crc8.Bitwise,
      flag := Stuff.marker, enc := StuffedChannel.encodeStuffed and Dom := Channel.FrameOK"
    abstraction: "every law is stated over the accepted observation (and the dropped count), never
      over Rcv's representation -- the way BoundedQueueLaws is stated over toList"
    operations: "feed, poll, accepted, dropped, room, quiet"
    laws: "poll_accepted, feed_append, quiet_before_flag, idle_flags, run_exactly_one, feed_frame --
      six fields. resync_progress and order_preserved are DERIVED theorems, not fields: each follows
      from feed_append and feed_frame, and registering either as a seventh field would be redundant.
      room and quiet are L0 fields for the same reason SerialModel.defined is one: feed_frame has a
      side condition, and the condition must be expressible at the interface rather than smuggled
      into the operation it is about"
    why_a_new_interface: "the operation shape -- feed a byte stream, observe an accepted-frame
      sequence plus a drop count -- fits none of QueueModel, CodecModel or ChecksumModel. This is the
      one unit where step 2 of docs/adding-a-unit.md writes an interface rather than checking one"
  strength: "four interfaces reached generically, one of them introduced here. The receive path never
    opens a queue, a codec or a checksum: the queue through BoundedQueueLaws, the framing codec
    through CodecModel at L0 plus the Transparent bundle, the checksum through ChecksumModel at L0"
  substitution: "Receiver[VQ/BQ]: feed_spec used unchanged at RingBuffer.BQ Frame and VecQueue.VQ
    Frame (feed_spec_RB, feed_spec_VQ); on the extracted code, Receiver[RB/VQ] (see bridge:)"
  extracted_instance: "no extracted ReceiverLaws instance is claimed, and none is owed: the
    extracted side is covered by the per-operation refinements and their _RB/_VQ instantiations. The
    laws are model-side, and the bridge carries them to the extraction through RcvRel"
  rust_counterpart: "rust/src/receiver.rs; receiver_agrees_with_extracted_vectors and
    receiver_agrees_with_extracted_vectors_vec_queue in rust/tests/differential.rs tie it to
    certificate/vectors.txt, and receiver_resyncs / receiver_resyncs_vec_queue exercise the resync
    behaviour directly against hand-written expectations"

assumptions:
  - "FramedChannel.Channel.FrameOK p (p.length < 2 ^ 32) on the frame feed_frame is about: it is the
    sender's own guard, the same Dom StuffedChannel.send enforces, and the hypothesis of
    resync_progress, order_preserved and both feed_spec rows"
  - "FramedChannel.Receiver.room c (the output queue is not full) on feed_frame: a full queue refuses
    the frame and counts it as a drop instead. This is the price of keeping run_exactly_one
    unconditional -- one rejected run, one increment, whatever the reason -- and it is the same
    conflation DeliverFail already makes. NOT an assumption anywhere else: every other law holds with
    the queue full"
  - "quiet c (no partially buffered run) on idle_flags, run_exactly_one and feed_frame: each is about
    what a run boundary does, so a receiver mid-run is outside what they state. accepted_sound
    assumes it too (as c.buf = []) together with an empty initial observation"
  - "the Transparent bundle on the framing codec -- decode_append, body_flag_free and ends_with_flag
    -- discharged at Stuff.Hdlc by instTransparentHdlc from Stuff.unstuff_stuff and
    Stuff.stuff_marker_free, both already in the model layer. Nothing new about stuffing is proved
    here, and body_flag_free is the hypothesis accepted_sound and feed_frame actually rest on"
  - "NOT assumed: CodecLaws, and no ChecksumLaws law. Only CodecModel and ChecksumModel at L0 plus
    the Transparent bundle are reached, for the reasons stuffed_channel.yaml records"
  - "NOT assumed, and worth stating because the plan predicted otherwise: no overflow hypothesis on
    the model-side drop counter. The model's dropped is a Nat"
  - "bridge, genuine (1 of 3): c.buf.length + bytes.length <= usize::MAX on feed_refines and its two
    instantiations. The extracted Vec::push panics beyond that bound; it is the analogue of the
    stuffing bridge's out.length + 2 * payload.length <= usize::MAX"
  - "bridge, genuine (2 of 3): c.dropped + bytes.length <= usize::MAX on the same three rows. This is
    the one plan Decision 5 expected saturating_add to have bought away, and it bought HALF of it:
    dropped.saturating_add(1) makes the extracted call total, so there is no panic and no overflow
    obligation, but it caps at Usize.max where the model's Nat does not, so relating the two VALUES
    still needs the bound. Recorded rather than hidden. finish_run_refines carries the same fact as
    c.dropped < usize::MAX"
  - "bridge, genuine (3 of 3): NoWideRun (FramedChannel.Bridge.receiver.NoWideRun) on feed_refines and
    its two instantiations -- no run this receiver will judge declares a length of 2 ^ 32 or more.
    That is ParsePost's DeclaresWideLength disjunct, inherited from the reused run parser and no more
    this unit's divergence than it was StuffedChannel's; finish_run_refines, which judges ONE run, can
    state it as a disjunct instead, and the loop, which judges many, takes it as a hypothesis. It is
    stated entirely in model terms -- over the buffered run of each prefix -- so a client discharges
    it by knowing what it fed, and not_declaresWide_encodeStuffed discharges it for any wire the
    sender wrote"
  - "bridge, genuine (4th, on the run judgement only): c.buf.length < usize::MAX on
    finish_run_refines, the Vec::push panic obligation for the appended flag"
  - "bridge, generic rows only: FramedChannel.Bridge.QueueSim S Q (Vec U8) inst R, with R functional
    for queued_agrees; discharged at both extracted queues (sim, sim, rel_functional), so no _RB/_VQ
    row carries it"
  - "bridge, proved not assumed: CloneIsId for the frame clone record
    (FramedChannel.Bridge.cloneVecU8_isId); the Default record for Vec<u8> needs no hypothesis"

guarantees:
  - resynchronization_is_sound_because_the_stuffed_body_is_marker_free
  - every_accepted_frame_is_the_acceptance_tests_reading_of_a_run_that_occurs_in_the_stream
  - chunking_invariance_what_the_receiver_does_is_independent_of_how_the_stream_is_cut
  - each_non_empty_flag_terminated_run_yields_exactly_one_acceptance_or_exactly_one_drop
  - a_flag_terminated_garbage_prefix_does_not_lose_the_frame_that_follows_it
  - a_clean_stream_of_frames_is_accepted_in_order_with_none_lost
  - adjacent_flags_are_idle_and_are_not_drops
  - nothing_is_accepted_or_dropped_before_a_flag_arrives
  - holds_at_every_bounded_queue_instance_and_every_transparent_codec

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is an
  # approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml records
  # which), and check.sh's approvals stage fails when its recorded spec_digest is not today's.
  - challenge: FramedChannelChallenge.Receiver
    covers: "the new ReceiverLaws interface's six laws over the canonical model, accepted_sound, the
      two derived theorems (resync_progress, order_preserved), instReceiverLaws, and the
      substitution pair feed_spec_RB / feed_spec_VQ"
  - challenge: FramedChannelAeneasChallenge.Receiver
    covers: "the extracted receive path: the run judgement finish_run_refines, the four per-operation
      agreements over any lawful queue record, and the six substitution rows at both extracted queues"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"
  note: "seven of this unit's nine extracted items are selected and two are declined as
    #[derive]-generated (Clone, Debug). finish_run is private in Rust and selected deliberately: it
    is the run judgement the scan calls at every flag, covered by its bridge row rather than by a
    differential vector, because differential.rs cannot call a private function"

proofs:
  - name: FramedChannel.Receiver.poll_accepted
    status: "[PROVED: kernel]"
    role: "L1 law: poll hands back exactly the frame the accepted observation has at its front"
  - name: FramedChannel.Receiver.feed_append
    status: "[PROVED: kernel]"
    role: "L1 law, and the load-bearing one: chunking invariance. feed (a ++ b) = feed (feed a) b, so
      what the receiver does is independent of how the stream is cut up. Both derived theorems rest
      on it, and it is what makes buffering across calls a law rather than an implementation detail"
  - name: FramedChannel.Receiver.quiet_before_flag
    status: "[PROVED: kernel]"
    role: "L1 law: nothing is accepted and nothing is dropped before a flag arrives -- until a run is
      terminated there is no run to judge"
  - name: FramedChannel.Receiver.idle_flags
    status: "[PROVED: kernel]"
    role: "L1 law (RFC 1662 section 4.1): from a run boundary, any number of adjacent flags delimit
      empty frames a conforming receiver ignores, so they are not drops. This is what the Rust's
      early return on an empty buffer buys"
  - name: FramedChannel.Receiver.run_exactly_one
    status: "[PROVED: kernel]"
    role: "L1 law: each non-empty flag-terminated run yields exactly one accepted frame or exactly
      one drop -- never both, never neither -- and leaves the receiver at a run boundary again. The
      drop accounting law of the original candidate list, stated as a decidable disjunction"
  - name: FramedChannel.Receiver.feed_frame
    status: "[PROVED: kernel]"
    role: "L1 law: a well-formed frame fed from a run boundary, with room in the queue, is accepted.
      This is where the Transparent bundle's body_flag_free is used: the encoding's only flag is its
      terminator, so the scan finds exactly this frame's boundary and no earlier one"
  - name: FramedChannel.Receiver.accepted_sound
    status: "[PROVED: kernel]"
    role: "headline: SOUNDNESS. Every frame a fresh receiver accepts off an ARBITRARY byte stream is
      the acceptance test's own reading of a non-empty, flag-free, flag-terminated run that occurs
      in that stream -- so no frame is invented out of corruption. The witnessing run is explicit
      rather than the accepted frame's own canonical encoding, and see not_claimed: the
      canonical-encoding form is FALSE, refuted in the kernel"
  - name: FramedChannel.Receiver.resync_progress
    status: "[PROVED: kernel]"
    role: "derived (from feed_append then feed_frame, two rewrites): a well-formed frame preceded by
      an arbitrary FLAG-TERMINATED garbage prefix is still accepted. The qualifier is necessary --
      see not_claimed:"
  - name: FramedChannel.Receiver.order_preserved
    status: "[PROVED: kernel]"
    role: "derived (an induction on the frame list over the same two laws): a clean stream of
      well-formed frames is accepted in order, with none lost"
  - name: FramedChannel.Receiver.instReceiverLaws
    status: "[PROVED: kernel]"
    role: "the new interface is not vacuous: Rcv Q over any lawful bounded queue, at HDLC stuffing
      and the bitwise CRC-8, is an inhabited instance of both ReceiverModel and ReceiverLaws"
  - name: FramedChannel.Receiver.feed_spec_RB
    status: "[PROVED: kernel]"
    role: "substitution: feed_frame's consequence at the extracted ring buffer's model queue, with no
      reproof"
  - name: FramedChannel.Receiver.feed_spec_VQ
    status: "[PROVED: kernel]"
    role: "substitution: the same at VecQueue.VQ Frame -- the Receiver[VQ/BQ] row"
  - name: FramedChannel.Bridge.receiver.finish_run_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the run judgement, and the row that covers the PRIVATE finish_run in place of a
      differential vector: the extracted judgement agrees with the model's finishRun, or the run
      declares a length of 2 ^ 32 or more (the inherited divergence, stated honestly)"
  - name: FramedChannel.Bridge.receiver.feed_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the whole scan: the extracted feed leaves a receiver related to the model's fold over the
      same bytes, over any lawful extracted queue record. Three hypotheses, all under assumptions:"
  - name: FramedChannel.Bridge.receiver.poll_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted poll hands back exactly what the specification queue pops, and returns None
      with the receiver unchanged exactly when that pop fails"
  - name: FramedChannel.Bridge.receiver.dropped_agrees
    status: "[EXTRACTED: aeneas + bridge]"
    role: "observer agreement: the extracted drop counter is the model's"
  - name: FramedChannel.Bridge.receiver.queued_agrees
    status: "[EXTRACTED: aeneas + bridge]"
    role: "observer agreement: the extracted queued is the length of the model queue's contents"
  - name: FramedChannel.Bridge.receiver.new_idle_RB
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the constructor claim: Receiver::new starts idle at every capacity -- no buffered run, no
      drops, nothing accepted -- so no idle state is assumed by the rows that follow"
  - name: FramedChannel.Bridge.receiver.with_queue_idle_VQ
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the same from Receiver::with_queue at the extracted VecQueue record"
  - name: FramedChannel.Bridge.receiver.feed_refines_RB
    status: "[EXTRACTED: aeneas + bridge]"
    role: "substitution: feed_refines at the extracted ring buffer, no simulation hypothesis left"
  - name: FramedChannel.Bridge.receiver.feed_refines_VQ
    status: "[EXTRACTED: aeneas + bridge]"
    role: "substitution: the same at the extracted VecQueue, with no reproof"
  - name: FramedChannel.Bridge.receiver.poll_refines_RB
    status: "[EXTRACTED: aeneas + bridge]"
    role: "substitution: poll_refines at the extracted ring buffer"
  - name: FramedChannel.Bridge.receiver.poll_refines_VQ
    status: "[EXTRACTED: aeneas + bridge]"
    role: "substitution: the same at the extracted VecQueue, with no reproof"

supporting:
  # Proved, audited, and deliberately unregistered (plan Decision 11, following Bridge/Stuff/'s
  # precedent): steps of the rows above rather than obligations of the unit. Listed here are the
  # ones that carry a `#print axioms` record, which is what this block's gate check requires. The
  # remaining unregistered steps carry no axiom record of their own and are therefore not listed:
  # core-side toList_push_ok, poll_ok_accepted, feed_nil, feed_cons, finishRun_buf, feed_flag_free,
  # feed_run_eq, encRun_flag_free, feed_sound, stuff_ne_nil, body_ne_nil, encRun_hdlc, model_feed,
  # model_quiet, model_room, feed_terminated_buf, ofFrame_id, order_preserved_aux; and bridge-side
  # finishRun_dropped_le, bytesOf_take_succ, FeedInv, FeedPost (the last two definitions, not
  # theorems). Every one of them is inside the audited closure of a row above.
  - name: FramedChannel.Bridge.receiver.feed_loop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the loop lemma: the extracted feed_loop refines the model's fold, proved with
      loop.spec_decr_nat on the measure bytes.len() - i. Not an obligation of the unit -- feed_refines
      is one line from it -- and the loop lemmas of Bridge/Stuff/ are unregistered for the same reason"
  - name: FramedChannel.Bridge.receiver.with_queue_idle
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the generic constructor lemma the two idle rows instantiate; the channel's and the
      transparent channel's analogues are unregistered too"
  - name: FramedChannel.Bridge.usize_saturating_add_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "library model: usize::saturating_add is addition capped at Usize.max, and never fails. A
      proved @[step] specification, never an axiom -- the library gap this unit's drop counter hit,
      beside channel.yaml's usize_saturating_sub_spec"
  - name: FramedChannel.Bridge.usize_saturating_add_val
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the same computation unlifted: the extraction calls saturating_add both inside and outside
      a lift, and the step walker needs both spellings"

dependencies:
  - ring_buffer.yaml
  - vec_queue.yaml
  - varint.yaml
  - crc8.yaml
  - stuff.yaml
  - stuffed_channel.yaml

findings:
  - name: FramedChannel.Bridge.receiver.feed_refines
    status: "[AUTHORED: nix-tested]"
    finding: "plan Decision 5 predicted that dropped.saturating_add(1) would leave feed with no
      arithmetic hypothesis at all. Writing the refinement falsified half of that: saturating_add
      does make the extracted call total, so there is no panic obligation and no overflow side
      condition, but it caps at Usize.max where the model's counter is a Nat, so relating the two
      VALUES needs dropped + bytes.length <= usize::MAX. The hypothesis was recorded rather than the
      theorem quietly restated, and it is one of the three feed_refines carries."
  - name: FramedChannel.Receiver.accepted_sound
    status: "[AUTHORED: nix-tested]"
    finding: "the plan pinned soundness in the payload-and-check form (the accepted frame's own
      encoding occurs contiguously in the fed wire). That form needs the codec to distribute over
      ++, which the Transparent bundle does not give, and the canonical-encoding form is outright
      FALSE -- refuted in the kernel at the wire [129, 0, 0, 0, 126], where the receiver accepts a
      payload whose canonical encoding occurs nowhere in that wire, because LEB128 length prefixes
      are not canonical in either the model or the Rust. What is proved is the witnessing-RUN form:
      every accepted frame is the acceptance test's own reading of a run that occurs in the stream.
      That is the honest claim, and the countermodel is what shows the qualifier is necessary rather
      than defensive."
  - name: alloc.vec.Vec.is_empty
    status: "[EXTRACTED: aeneas + bridge]"
    finding: "regenerating the extraction for this unit reached one library function the pinned
      Aeneas library does not model -- Vec::is_empty, from finish_run's idle-flag early return -- and
      refresh-extraction.sh REFUSED to write until it was modelled. It was modelled, never
      axiomatised: a proved definition in Extracted/FunsExternal.lean returning the list's own
      isEmpty, with an @[step] specification. That file's count of crate-local trusted models went
      from five to six."

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into
    aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); the receive path reaches the
    crate-local trusted models in Extracted/FunsExternal.lean, and this unit's regeneration ADDED one
    of them (Vec::is_empty, a proved definition with an @[step] spec -- see findings:), taking that
    module from five models to six. aeneas/FramedChannelAeneas/Bridge/Receiver/ proves the extraction
    refines the Lean model (see bridge:)"

composite_trust_note: "A composite is never more trusted than its least trusted part. This unit
  reaches Crc8 only through ChecksumModel at L0 and the already-certified component refinements, not
  through crc8_step_linear, the example's one compiler-trusting declaration; the same holds of the
  run parser it reuses. Its weakest link is G1/G2: the receive path, both queues it is run at, and
  the Stuff, Varint, Crc8 and StuffedChannel parts it composes are all bridged to a Charon/Aeneas
  extraction ([EXTRACTED: aeneas + bridge]), so the translation step trusted is the extractor's
  (rustc MIR, Charon, Aeneas and its library models) rather than a hand transcription, and the whole
  unit stays `trusted`, not `verified`."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound}; no
      sorryAx, no compiler-trusting axiom. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate rust/src/receiver.rs to
      aeneas/FramedChannelAeneas/Extracted/; aeneas/FramedChannelAeneas/Bridge/Receiver/ proves that
      output refines the hand-written Rcv (finish_run_refines, feed_loop_refines, feed_refines,
      poll_refines and the observer agreements) over any lawful queue record, so the extractor, not a
      hand transcription, performs the translation step. The extracted scan loop is bridged with
      loop.spec_decr_nat on the measure bytes.len() - i, which decreases on every branch"
    validation: "validated on 110 recorded inputs (receiver_agrees_with_extracted_vectors (55) and
      receiver_agrees_with_extracted_vectors_vec_queue (55) in rust/tests/differential.rs, against
      certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas
      extraction): on every one, the pinned rustc debug build and the Lean evaluation of the
      translation of the same source agree on each feed's resulting dropped() and queued(), and on
      each poll's Some(payload)/None with both counters after it. buf is private and not observed.
      The wires are deliberately not all well formed -- a bumped check byte, a truncated frame, the
      fused run the next flag closes, adjacent flags, a garbage prefix both with and without its
      terminating flag, and a full-queue refusal at capacity 1 -- so the drop paths are covered by
      records, not only by proofs. That the test really consumes them was measured rather than
      assumed: changing one generated drop count from 3 to 2 makes
      receiver_agrees_with_extracted_vectors FAIL. It does NOT establish: anything on inputs no
      record carries (a payload of 2 ^ 32 bytes or more, a run near usize::MAX, a declared length of
      2 ^ 32 or more -- the NoWideRun case, which no vector can carry and finish_run_refines states
      as a disjunct); release-profile arithmetic (the extraction models overflow as a panic, the
      debug profile cargo test runs); the compiled binary's codegen beyond these runs; or the
      correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates
      the extracted definitions; the extracted scan is a partial_fixpoint, evaluated, never
      kernel-reduced). No record exists for the private finish_run: differential.rs cannot call a
      private function, and it is covered formally by finish_run_refines instead."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the differential-test inputs are the only evidence about rustc MIR and Charon's LLBC here"
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "the hand-written Rcv Q is a specification of the receive path -- a queue of accepted
      frames, the bytes of the run being scanned, and a drop count -- and the extraction is Charon
      and Aeneas's reading of the same Rust. Two model-side gaps are recorded rather than hidden: the
      run buffer is unbounded in the model where real memory is not (see not_claimed:), and Aeneas
      models integer overflow as a panic, which is the debug profile's behaviour"
    status: "[HAND-WRITTEN: model; bridged]"
  G4_specification:
    verdict: validated
    evidence: "the specification half proves the six ReceiverLaws fields over the canonical model,
      soundness in its witnessing-run form, the two derived theorems and the substitution pair; the
      differential tests validate that the Rust agrees with the extraction of the same source on 110
      recorded inputs, corruption and truncation included. That these statements are the right ones
      is a judgement: in particular that run_exactly_one's conflation of a malformed run with a
      full-queue refusal is the intended accounting, and that soundness in the witnessing-run form is
      what a receive path should claim"
    approval: "the Challenge modules under specification: above are approved in approvals.yaml, which records whether a person or an agent approved each; that these statements say what the component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/receiver.rs and lean/FramedChannel/Composition/Receiver/Theorems.lean in digests.txt; the registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each listed Challenge module's spec_digest and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

coverage:
  L0_interface: "proved, four times over: the unit is generic over QueueModel, over CodecModel (plus
    the composition-layer Transparent bundle), over ChecksumModel, and it INTRODUCES
    ReceiverModel/ReceiverLaws and instantiates them"
  L1_laws_over_an_abstract_observation: "proved. The unit's own six laws are stated over the accepted
    observation and the dropped count, never over Rcv's representation. For the queue, every theorem
    is discharged from BoundedQueueLaws alone, never by opening RingBuffer or VQ. For the codec
    CodecLaws is deliberately not used and the Transparent bundle stands in its place; for the
    checksum no L1 law is used at all"
  canonical_model: "proved (instReceiverLaws), and exercised twice more at the substitution pair
    feed_spec_RB / feed_spec_VQ"
  representation_invariant: "proved where it is needed and not claimed as a global invariant: RcvInv
    (no buffered byte is the flag) is the invariant the scan maintains, established by feed_flag_free
    and used by run_exactly_one, accepted_sound and feed_sound. It is NOT a field of Rcv and NOT
    assumed by feed or poll: a receiver mid-run over corrupt bytes is a legitimate state, which is
    the whole point of the unit"
  abstraction_function_and_refinement: proved
  error_agreement: "proved at both levels, obligation by obligation. Model side: run_exactly_one IS
    the failure-accounting theorem -- each non-empty flag-terminated run yields exactly one
    acceptance or exactly one drop, never both and never neither -- and quiet_before_flag says the
    counters move only at a flag. There is no separate `feed fails` case: feed is total, which is the
    behaviour the unit exists for (a receive path that wedges on corruption would be the bug).
    poll's refusal agreement is poll_refines at the extracted level and poll_accepted at the model
    level. Extracted side: finish_run_refines' disjunct is the one residual not characterised -- a
    run declaring a length of 2 ^ 32 or more, where the model's Nat varint reads what the extracted
    decoder refuses -- inherited from the run parser, excluded for any wire the sender wrote by
    not_declaresWide_encodeStuffed, and carried by the loop as NoWideRun. Checked on the Rust side by
    receiver_agrees_with_extracted_vectors / _vec_queue against the drop-path records the extraction
    computed (bumped check byte, truncated frame, fused run, unterminated garbage prefix, full-queue
    refusal)"
  bounds_or_failure_freedom: "proved for the operations and NOT claimed for memory. Every extracted
    triple above is total: under its stated hypotheses the extracted feed, poll, dropped and queued
    return -- never panic, never diverge -- and the scan's termination is structural (the index
    advances on every branch, the rejected run included), so the measure decreases unconditionally.
    What is NOT bounded is the run buffer: a wire carrying no flag grows it without limit. That is a
    standing limit of the model, recorded under not_claimed: with a bounded-buffer variant named as
    future work, and the two usize bounds under assumptions: are exactly where it meets real memory"
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: "proved: the extracted receive path refines Rcv over any lawful queue record,
    and both operations hold at both extracted queues from the Rust constructors"
  ladder: "12 core rows (certificate/ladder.txt): simp -- feed_append; instance -- instReceiverLaws;
    manual -- poll_accepted, quiet_before_flag, idle_flags, run_exactly_one, feed_frame,
    accepted_sound, resync_progress, order_preserved, feed_spec_RB, feed_spec_VQ. A manual-heavy
    unit, and the reason is in the shape of the proofs rather than in effort not spent: nine of the
    twelve are inductions over a byte stream, where the rung audit's cheaper candidates do not close
    the goal. The two countermodels are separate records in certificate/countermodels.txt
    (receiver_sound_unstuffed, receiver_accepted_canonical). The bridge rows are not laddered."

not_claimed:
  - "the compiled binary (no claim about codegen)"
  - "a BOUNDED run buffer. A wire carrying no flag grows the buffered run without limit, in the model
    and in the Rust. This is not a subset violation -- the subset bounds loops, and this loop is
    bounded by a length already in hand -- but it is a real standing limit, and a receiver with a
    configured maximum run length that drops an over-long run is named here as future work rather
    than quietly implied. The two usize bounds under assumptions: are where the unbounded model meets
    real memory"
  - "soundness in the CANONICAL-ENCODING form: that every accepted frame's own encoding of itself
    occurs in the wire that produced it. This is FALSE, and refuted in the kernel
    (Evidence/Countermodels.lean, receiver_accepted_canonical, witness [129, 0, 0, 0, 126]): the
    receiver accepts a payload whose canonical encoding occurs nowhere in that wire, because a LEB128
    length prefix is not canonical in either the model or the Rust. accepted_sound therefore states
    the witnessing-RUN form, and the countermodel is why that qualifier is necessary rather than
    defensive"
  - "resync progress after an UNTERMINATED garbage prefix. resync_progress requires the prefix to end
    in a flag. Without it the garbage fuses with the following frame's body and that frame is LOST --
    verified, and visible in certificate/vectors.txt as the pair of garbage-prefix records, one
    flag-terminated (the frame after it is accepted) and one not (it is not)"
  - "gap or duplicate detection, and any coupling to SeqNum. This receive path counts what it could
    not parse; it does not detect that a frame is missing, or that one arrived twice. The sequence
    number unit is certified separately and is not composed here"
  - "that the two new countermodels are the same result as an existing row. Evidence/Countermodels.lean
    block 13 (receiver_sound_unstuffed, witness [18#8, 126#8, 0#8] as certificate/countermodels.txt records it) quantifies over what a real
    receiver ACCEPTS over unstuffed framing, where the existing parseFrameResync_roundtrip row (block
    3, witness 126) quantifies over a hypothetical receiver's ROUND TRIP and channel_wire_marker_free
    (block 12, witness [marker]) over the ENCODER's output: three different quantified objects, three
    different mechanisms. Block 14 (receiver_accepted_canonical) is a different result again, and the
    only one of the three that is false over STUFFED framing"
  - "behaviour on a wire no flag ever terminates, beyond the buffering: nothing is accepted and
    nothing is dropped, which quiet_before_flag states; what is not claimed is any bound on the
    memory that buffering costs"
  - "concurrency (the model is sequential)"
  - "release-profile arithmetic: the extraction models overflow as a panic (debug profile)"
  - "runs or streams within a small constant factor of usize::MAX: excluded by the two bridge bounds
    under assumptions:"
  - "any reading of 'no proof opens a concrete codec or checksum' beyond this one: the proofs reach
    stuffed_channel::parse_stuffed, stuff::unstuff, decode_u32 and crc8 only through their registered
    refinement theorems used as black-box specifications (receiver.rs calls them monomorphically)"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
