    role: "iterating succ is adding the step count; the step of both iterate rows"
  - name: FramedChannel.SeqNum.ofNat_space
    status: "[PROVED: kernel]"
    role: "the space size is 0 in the space; one decide over a closed literal"
  - name: FramedChannel.SeqNum.iter_serial
    status: "[PROVED: kernel]"
    role: "the interface's derived SerialModel.iter at Serial is the model's structural iter on the wrapped value; the step of succ_cycles in instSerialLaws"
  - name: FramedChannel.Bridge.seq_num.half_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the model's half is the extracted HALF's bit vector; the step of extDefined_eq"
  - name: FramedChannel.Bridge.seq_num.toModel_ofModel
    status: "[EXTRACTED: aeneas + bridge]"
    role: "ofModel is a right inverse of toModel"
  - name: FramedChannel.Bridge.seq_num.ofModel_toModel
