dependencies:
  - "BitVec.toNat_add, BitVec.toNat_sub, BitVec.toNat_ofNat, BitVec.lt_def, BitVec.eq_of_toNat_eq, BitVec.ofNat_add, BitVec.add_assoc, BitVec.add_zero (Lean core); omega and grind"
  - "no Mathlib in lean/; Std.Tactic.BVDecide (bundled with the toolchain) for the one bv_decide row; no other module of this example except the Spec/Serial.lean interface this unit adds"
  - "bridge only: the Aeneas Lean library pinned by `aeneas/lake-manifest.json` (step*, WP.spec_imp_exists, UScalar.lt_equiv, UScalar.eq_equiv_bv_eq, core.num.U16.wrapping_add_bv_eq and wrapping_sub_bv_eq); requires the Mathlib version aeneas/lake-manifest.json pins. NO @[step] specification was added to Bridge/Std.lean: no library gap appeared"

toolchain:
  shared: certificate/shared.yaml
  extraction: "extract the whole crate, this component included, axiom-free into aeneas/FramedChannelAeneas/Extracted/ (see ring_buffer.yaml); no crate-local library model is reached and no new one was added -- Extracted/FunsExternal.lean is byte-unchanged by this unit, which is the recorded outcome of translating u16 wrapping arithmetic. aeneas/FramedChannelAeneas/Bridge/SeqNum/ proves that extraction refines the Lean model"

coverage:
  L0_interface: proved
  L1_laws_over_an_abstract_observation: proved
  canonical_model: proved
  representation_invariant: "not claimed (the type IS the invariant: BitVec 16 admits no out-of-range
    value, so this obligation does not arise rather than being skipped)"
  abstraction_function_and_refinement: proved
  error_agreement: "not claimed, and the reason is structural rather than an omission: no operation
    of this unit can fail. new and get are a bare ok; succ, add, dist and lt go through
    core.num.U16.wrapping_add / wrapping_sub, which are PURE U16 -> U16 -> U16 functions of the
    Aeneas library rather than Result-valued ones. There is no error taxonomy on either side to put
    in agreement. Contrast varint.yaml and stuff.yaml, whose decoders have real error variants"
  bounds_or_failure_freedom: "proved, as failure freedom: each of the six bridge triples is TOTAL
    correctness, so each rules out every failure of the extracted operation as well as fixing its
    result, and none of them carries a hypothesis. There is no bound to state -- no loop, no table
    lookup, no Vec push -- so the obligation is discharged entirely on the failure-freedom side"
  transitivity_of_lt: "NOT a law and never will be: refuted in the kernel at (0, 20000, 40000),
    where lt 0 20000 and lt 20000 40000 hold, lt 0 40000 does not, and lt 40000 0 does -- a genuine
    three-cycle (lt_trans_cand with cycle_witness in lean/FramedChannel/Evidence/Countermodels.lean;
    certificate/countermodels.txt). RFC 1982 §3.2 defines the comparison but never states that it
    composes, and it does not. The refutation is what makes the omission a FINDING rather than a
    gap: SerialLaws has four fields and no fifth, FramedChannelChallenge.SeqNum restates no
    transitivity statement, and any consumer needing a transitive order must not build it on this
    relation. This is the only countermodel in the example that refutes a law a reader would simply
    assume holds; every other one refutes a statement missing a hypothesis"
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  extraction_bridge: proved
  ladder: "11 core rows (certificate/ladder.txt), spread deliberately across four rungs rather than
    landed at manual, and every label was VALIDATED BY BUILDING -- the proof-ladder audit fails the
    build naming a cheaper rung, so no label here was chosen by hand. decide -- lt_irrefl, lt_succ
    (one 16-bit variable is 65536 cases, which the kernel settles; they run in a section at
    Ladder.auditHeartbeats, since the default 200000 is not enough, and a bare decide without
    +revert fails earlier still). grind -- dist_add, lt_add, lt_translation_invariant (each was
    first written as a retrieval simp call over named BitVec lemmas and the audit rejected the label,
    naming grind). retrieval -- iter_space. bv_decide -- lt_eq_ltRFC, the single flagged row.
    manual (excluding bv_decide) -- lt_eq_ltRFC_kernel and lt_total_of_defined: the qualifier is
    legal only above the bv_decide rung, and it is used here for the recorded reason
    crc8_step_linear_kernel sets, namely that the theorem exists SPECIFICALLY to avoid the
    bv_decide rung, so that rung is excluded from its audit and the record says so.
    lt_total_of_defined carries the same qualifier for the same structural reason: any two-variable
    BitVec 16 fact is inside bv_decide's reach and would otherwise be audited against it.
    manual -- iter_ne_of_pos_lt. instance -- instSerialLaws. The bridge rows are not laddered"
  countermodels: "two, both in lean/FramedChannel/Evidence/Countermodels.lean (sections 10 and 11)
    and recorded in certificate/countermodels.txt; all five of their declarations are AXIOM-FREE,
    which is stronger than the permitted set.
    (1) lt_trans_cand, witnessed at (0#16, 20000#16, 40000#16): serial lt is NOT transitive. This is
    the reason the law set omits transitivity, and the reason a ReceiverLaws-style consumer must not
    depend on it. The enumeration steps by 5000 rather than by powers of two, and that choice IS the
    finding: a powers-of-two enumeration's first failure is (0, 16384, 32768), where the two values
    are exactly half the space apart and NEITHER is serially before the other -- §3.2's undefined
    region, a different phenomenon, refuted separately below. A step of 5000 puts the first failure
    at a triple that genuinely cycles, and cycle_witness records lt 40000 0 = true beside it so the
    record shows a cycle rather than a mere failure to compose.
    (2) lt_total_cand, witnessed at 32768: totality without the defined hypothesis is false where
    two numbers are exactly half the space apart. This is what makes
    SerialLaws.lt_total_of_defined's defined hypothesis demonstrably load-bearing rather than
    decorative -- the same service stuff_maxLen_unbounded performs for Stuff's maxPayload.
    Deliberately NOT refuted: §3.2's rejected-alternative sentence about s1 < s2 coexisting with
    (s1 + 1) > (s2 + 1). It is about a definition the RFC rejected, and this formulation provably
    does not have the defect, so the point is carried by the theorem
    lt_translation_invariant instead of by a countermodel"

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: every proof above within {propext, Classical.choice, Quot.sound}, with ONE declared exception -- lt_eq_ltRFC carries its native bv_decide helper axiom lt_eq_ltRFC._native.bv_decide.ax_1_21, is registered verified := false, scores 0, and is declared flagged in certificate/policy.txt. That declaration is what makes it auditable rather than silent, and lt_eq_ltRFC_kernel proves the same statement in the kernel beside it. No sorryAx and no native_decide anywhere. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the pinned revisions translate rust/src/seq_num.rs into Extracted/{Funs,Types}.lean with no new external name, and aeneas/FramedChannelAeneas/Bridge/SeqNum/ proves each extracted operation refines the model, in total correctness, with no hypothesis"
    validation: "seq_num_agrees_with_extracted_vectors in rust/tests/differential.rs compares the compiled Rust against 55 records of certificate/vectors.txt that Lean computed by evaluating the extraction: 8 new, 8 get, 8 succ, 7 add, 12 dist and 12 lt. The set crosses the wrap boundary in both directions and carries the non-transitive triple itself and the undefined-region pair; the test counts the three cycle edges and the two undefined-region pairs and asserts those counts, so a vector set that lost either group fails rather than passing quietly. extracted_vectors_cover_every_translated_operation requires a record for each of the six operations"
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "pinned rustc MIR and Charon run on this component (extracted and bridged), but their faithfulness to Rust semantics is not established here"
    validation: "validated, not verified: the differential-test inputs are the only evidence about rustc MIR and Charon's LLBC here"
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "the hand-written model represents a sequence number as BitVec 16 and carries BOTH spellings of §3.2's comparison, with their agreement proved; the extraction represents it as structure seq_num.SeqNum over Std.U16 in the Result monad. The abstraction between them is a bijection (toModel / ofModel, toModel_inj), not a projection, which is the recorded consequence of the representation choice in assumptions:"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half proves the four serial laws at both the model and the extracted carrier, and proves the one claim a reader would otherwise have to take on trust -- that the implementation's single distance test is RFC 1982 §3.2 -- as a theorem over all 2 ^ 32 pairs. It also REFUTES transitivity in the kernel, so the law set's silence about it is evidenced rather than merely unexplained. The differential tests validate the compiled Rust on the recorded inputs, including the non-transitive triple and the undefined region, which is the only place the Rust's behaviour in that region is checked at all"
    approval: "the Challenge modules under specification: above are approved in approvals.yaml, which records whether a person or an agent approved each; that these statements say what the component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of rust/src/seq_num.rs and lean/FramedChannel/Model/SeqNum/Theorems.lean in digests.txt; the registry row is bound to the elaborated statement hash, not to the theorem name; and the recorded approvals are current: check.sh's approvals stage checks each listed Challenge module's spec_digest and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

not_claimed:
  - "transitivity of the serial comparison -- refuted, not merely unproved (coverage.transitivity_of_lt)"
  - "any behaviour of the comparison on a pair exactly half the space apart beyond what the vectors record: the models say lt is false in both directions there, and nothing claims that is the RIGHT answer, because §3.2 leaves it undefined"
  - "that 0x8000 is half of 2 ^ 16 by construction: HALF is a literal (assumptions:), checked against the RFC's own 2 ^ 15 only through lt_eq_ltRFC"
  - "the compiled binary (no claim about codegen)"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
