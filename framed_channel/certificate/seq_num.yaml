  - name: FramedChannel.Bridge.seq_num.extAdd_toModel
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered increment is the model's add"
  - name: FramedChannel.Bridge.seq_num.extDist_bv
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered distance is the model's dist"
  - name: FramedChannel.Bridge.seq_num.extLt_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered comparison is the model's lt"
  - name: FramedChannel.Bridge.seq_num.extDefined_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered defined-region test is the model's defined"
  - name: FramedChannel.Bridge.seq_num.ext_iter
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the abstraction commutes with the interface's derived iterate; the step of succ_cycles at the extracted carrier"
  - name: FramedChannel.search_lt_trans
    status: "[PROVED: kernel]"
    role: "countermodel search: the first triple of the 5000-step enumeration that breaks transitivity is (0, 20000, 40000)"
  - name: FramedChannel.lt_trans_cand_false
    status: "[PROVED: kernel]"
    role: "countermodel refutation: serial lt is not transitive, at that witness"
  - name: FramedChannel.cycle_witness
    status: "[PROVED: kernel]"
    role: "the third edge, lt 40000 0 = true, which makes the witness a genuine three-cycle rather than a composition failure"
  - name: FramedChannel.search_lt_total
    status: "[PROVED: kernel]"
    role: "countermodel search: the first multiple of 8192 comparable with neither direction against 0 is 32768"
  - name: FramedChannel.lt_total_cand_false
    status: "[PROVED: kernel]"
