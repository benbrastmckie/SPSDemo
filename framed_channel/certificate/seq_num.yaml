# Certificate manifest for the RFC 1982 serial-number unit. Every claim line carries one of the
# fixed honesty tags; see README.md in this directory for the tag vocabulary. Generated values
# (axiom lines, digests, the certificate identity) are read from axioms.txt and digests.txt, which
# check.sh regenerates.
#
# READ THIS FIRST. This unit's headline is a REFUTATION, not a theorem. RFC 1982 §3.2's serial
# comparison is not transitive, and this is the only unit in the example whose countermodel refutes
# a law a reader would simply assume holds rather than a statement missing a hypothesis. See the
# transitivity_of_lt row of coverage: and the countermodels: row beside it; SerialLaws has no
# transitivity field, and its absence is evidenced rather than merely unexplained. The unit is also
# the example's second [PROVED: compiler-trusting] row and the first to spread itself deliberately
# across four ladder rungs.

component: SeqNum

source:
  file: rust/src/seq_num.rs
  symbol: "SeqNum::new, SeqNum::get, SeqNum::succ, SeqNum::add, SeqNum::dist, SeqNum::lt, HALF"
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction, the whole-crate extraction described in ring_buffer.yaml; the six functions and the one const are output as seq_num.SeqNum.new / .get / .succ / .add / .dist / .lt and seq_num.HALF in aeneas/FramedChannelAeneas/Extracted/Funs.lean, and the newtype as structure seq_num.SeqNum in Extracted/Types.lean (generated, never hand-edited). No new external name appears: Extracted/FunsExternal.lean is byte-unchanged, because Charon and Aeneas translate u16 wrapping arithmetic into Aeneas's own pure wrapping_add / wrapping_sub with no library model added"
  status: "[EXTRACTED: aeneas + bridge]"
  declarations:
    - FramedChannel.SeqNum.half
    - FramedChannel.SeqNum.dist
    - FramedChannel.SeqNum.lt
    - FramedChannel.SeqNum.ltRFC
    - FramedChannel.SeqNum.succ
    - FramedChannel.SeqNum.add
    - FramedChannel.SeqNum.space
    - FramedChannel.SeqNum.iter
    - FramedChannel.SeqNum.defined
    - FramedChannel.SeqNum.Serial
  module: "lean/FramedChannel/Model/SeqNum/Defs.lean (definitions) and lean/FramedChannel/Model/SeqNum/Theorems.lean (theorems); the interface is lean/FramedChannel/Spec/Serial.lean, a module this unit adds"
  representation: "a sequence number is BitVec 16, written literally at every binder, with NO abbrev, def or notation synonym for the carrier. Wrapping is then definitional -- BitVec + and - are already modulo 2 ^ 16 -- so there is no % 65536 anywhere, no representation invariant to preserve, and the abstraction from the extracted Std.U16 is an equality of representations rather than a lossy projection. The absence of a synonym is a MEASURED constraint, not a style preference: behind a reducible synonym bv_decide abstracts BitVec subtraction as an opaque variable and reports a SPURIOUS COUNTEREXAMPLE, which reads as 'the statement is false' rather than as a tactic limitation, and lt_eq_ltRFC depends on that rung. Serial is a one-field wrapper over BitVec 16 carrying the interface instance; the registered theorems are all stated at BitVec 16 directly. The comparison is carried in TWO spellings, the one-test distance form lt that the Rust has and the literal §3.2 transcription ltRFC, with their agreement proved (lt_eq_ltRFC)"
  extracted_declarations:
    - framed_channel.seq_num.HALF
    - framed_channel.seq_num.SeqNum.new
    - framed_channel.seq_num.SeqNum.get
    - framed_channel.seq_num.SeqNum.succ
    - framed_channel.seq_num.SeqNum.add
    - framed_channel.seq_num.SeqNum.dist
    - framed_channel.seq_num.SeqNum.lt
  extracted_representation: "structure seq_num.SeqNum with one field value : Std.U16, in the Aeneas Result monad. succ and add are lift (core.num.U16.wrapping_add ...), dist is ok (core.num.U16.wrapping_sub other.value self.value), and lt is that same wrapping_sub followed by if d != 0#u16 then ok (d < seq_num.HALF) else ok false. HALF is an @[global_simps, irreducible] def of the literal 32768#u16. Both wrapping operations are PURE U16 -> U16 -> U16 functions of Aeneas's library, not Result-valued ones, so no operation of this unit can fail. No loop appears anywhere in the extraction of this unit"

bridge:
  modules:
    - aeneas/FramedChannelAeneas/Bridge/SeqNum/Defs.lean
    - aeneas/FramedChannelAeneas/Bridge/SeqNum/Instance.lean
  abstraction: "FramedChannel.Bridge.seq_num.toModel (aeneas/FramedChannelAeneas/Bridge/SeqNum/Defs.lean): the extracted sequence number's machine word as its bit vector, s.value.bv. It is a BIJECTION rather than a projection -- ofModel is its inverse and toModel_inj is proved -- which is what lets a model equation be pushed back to the extracted carrier, as succ_cycles needs"
  status: "[EXTRACTED: aeneas + bridge]"
  reading: "Six total-correctness triples, one per extracted operation, so each rules out every failure of the extracted code as well as fixing its result. READ THE HYPOTHESES: THERE ARE NONE. That is the finding rather than an oversight -- core.num.U16.wrapping_add and wrapping_sub are pure functions in Aeneas's library, so wraparound is the definition and not a failure to exclude, and every arithmetic obligation closes through their @[simp, grind =] *_bv_eq lemmas, stated directly as BitVec 16 arithmetic on .bv. Contrast varint.encode_refines, which must carry out.length + 5 <= Usize.max for its Vec::push. new_refines and get_refines fix the constructor and accessor (so they are inverse); succ_refines, add_refines and dist_refines are the model's succ, add and dist under the abstraction; lt_refines is the only proof with content, because the extracted lt branches on the zero test first where the model conjoins, and both of its branches close by omega. HALF_val reads the extracted pub const once, in the shape Bridge/Stuff/Stuff.lean's MARKER_val / ESC_val set -- not decoration, since the extraction emits a const as its own selection candidate and the gate's selection-reach stage demands a registered statement about it exactly as for each function. NO bv_decide appears anywhere in the bridge: a native helper axiom here would have meant a second flagged row for a fact omega settles. Bridge/Std.lean is byte-unchanged; no Aeneas library gap appeared, so no @[step] specification and no axiom. Per step 9.5's two-part test no SerialSim is owed -- SeqNum dispatches through no trait and no composite is proved generic over it -- so none is built"

implements:
  interface_L0: FramedChannel.SerialModel
  interface_L1: FramedChannel.SerialLaws
  instance: FramedChannel.SeqNum.instSerialLaws
  carrier: "FramedChannel.SeqNum.Serial, a one-field wrapper over BitVec 16 -- field for field the Rust newtype SeqNum { value: u16 }. It is NOT a field-free component tag as Crc8.Bitwise is, because SerialModel is indexed by the representation rather than by a component tag: a field-free carrier would have one inhabitant, make succ the identity and make instSerialLaws vacuous"
  abstraction: "the serial ordering itself: every law is stated through lt and succ, never through the representation"
  operations: "SerialModel fields zero, succ, lt, defined, space -- five, not the four an RFC reader might expect. defined is the fifth and it is why the totality law is honest: §3.2 leaves the comparison undefined on a pair exactly half the space apart, so the condition has to be expressible at the interface. dist and half stay model-side (as Crc8.table does), so the condition enters L0 as one Bool-valued operation rather than by widening lt, which would smuggle the side condition into the very relation the law is about. iter is DERIVED from succ by a definition, not an L0 field: a free iter field would make succ_cycles vacuous"
  laws: "four: lt_irrefl, lt_succ, succ_cycles, lt_total_of_defined. NOT transitivity -- see coverage.transitivity_of_lt"
  extracted_instance: FramedChannel.Bridge.seq_num.instSerialLaws_extracted
  extracted_carrier: "the extracted structure seq_num.SeqNum ITSELF, with no component tag, since SerialModel is indexed by the representation. Its operations lower each extracted call with Result.match (extSucc, extAdd, extDist, extLt, extDefined in Bridge/SeqNum/Defs.lean); each lowering is read off its own triple by WP.spec_imp_exists, so the fallback branch is proved unreachable rather than assumed so. space is the model's own FramedChannel.SeqNum.space, not a fresh literal"
  rust_counterpart: "rust/src/seq_num.rs's SeqNum::new / get / succ / add / dist / lt and HALF; tied to the extraction by seq_num_agrees_with_extracted_vectors in rust/tests/differential.rs against certificate/vectors.txt, and the census test extracted_vectors_cover_every_translated_operation requires a record for each of the six operations"

assumptions:
  - "model only: a sequence number is BitVec 16. This is this unit's ONE genuinely discretionary modelling choice and is recorded as such. The alternative considered and rejected was Nat with an explicit modulus 65536 and a range condition, matching Varint's and Stuff's Dom precedent, which buys omega reach on the wraparound arithmetic directly but (i) loses the bv_decide rung this unit exists to demonstrate, since bv_decide needs a bit-vector goal, (ii) re-introduces a range hypothesis on every law field, and (iii) makes the abstraction from the extracted Std.U16 a lossy projection rather than an equality of representations, so every bridge triple would carry a well-formedness side condition"
  - "model only: RFC 1982 §3.1's increment domain is a condition on the CLAIM, not a partiality of the operation. add is total and wrapping at every increment; 0 < k < 2 ^ 15 appears only as the two hypotheses of lt_add. Note that 0 < k is needed IN ADDITION to the RFC's own range, because add s 0 = s is not serially after s -- the RFC's prose does not make that explicit"
  - "model only: SerialModel.iter is a DEFINITION over the succ field rather than an L0 field or Nat.iterate. Nat.iterate and the f^[n] notation are Mathlib-only and lean/ has no Mathlib (see lean/lakefile.toml, which has no require). An iter : Nat -> S -> S L0 field was rejected because it makes succ_cycles VACUOUS: nothing would tie a free field to succ, so an instance could satisfy the law with iter := fun _ n => n and say nothing about its successor. The definition keeps the law about succ by construction, and iter_serial relates it to the model's own structural iter"
  - "extracted rows: NO hypothesis on any of the six triples, and this is a claim about the Rust rather than a convenience. core.num.U16.wrapping_add and wrapping_sub are pure U16 -> U16 -> U16 functions of the Aeneas library, so there is no overflow obligation to discharge and no Vec to bound. Contrast varint.encode_refines's out.length + 5 <= Usize.max and stuff.stuff_refines's input-relative bound"
  - "rust/src/seq_num.rs writes HALF as the literal 0x8000 and declares no SPACE_BITS. That is deliberate and recorded so it is auditable: a pub const no function mentions is an in-subset, non-derived extraction candidate that no registered statement reaches, which fails gate stage 10 with no useful row available to fix it; and deriving HALF from it by a shift would give the extracted const a computed body instead of the literal shape every other extracted const has. Nothing proves 0x8000 is half of 2 ^ 16; it is a literal, checked by lt_eq_ltRFC against the RFC's own 2 ^ 15"
  - "rust/src/seq_num.rs's add keeps the name add rather than implementing std::ops::Add, and carries #[allow(clippy::should_implement_trait)] (recorded in rust/README.md's lint-exception list): serial addition is asymmetric in its operand types (SeqNum + u16, never SeqNum + SeqNum) and a trait impl would put a dispatch in the extraction this unit has no use for"

guarantees:
  - irreflexive: "no sequence number is serially before itself"
  - successor_is_always_after: "the one step the comparison is guaranteed to see, at every point of the space"
  - the_space_closes_after_exactly_2_pow_16_steps: "BOTH halves are proved, but only one is a law. succ_cycles (the return) is the SerialLaws field a consumer uses; minimality -- that no shorter cycle exists -- is the registered model theorem iter_ne_of_pos_lt and deliberately NOT a law field, because it constrains the model rather than the consumer. The split is recorded here so the narrower class is a choice and not a gap"
  - total_on_the_defined_region_only: "two distinct numbers not exactly half the space apart are ordered one way or the other. The defined hypothesis is not removable; lt_total_cand refutes the unguarded form in the kernel at 32768"
  - translation_invariant: "advancing both arguments leaves the comparison unchanged, so the §3.2 remark about s1 < s2 coexisting with (s1 + 1) > (s2 + 1) -- which is about a definition the RFC REJECTED -- does not apply to this formulation. Registered as lt_translation_invariant rather than left as a docstring remark, because it is the passage a reader is most likely to misread"
  - faithful_to_RFC_1982_section_3_2: "an auditable claim rather than a comment: the one-test distance form the Rust uses and the RFC's literal two-case formula are proved equal on all 2 ^ 32 pairs (lt_eq_ltRFC, and its kernel replay lt_eq_ltRFC_kernel)"
  - the_distance_recovers_the_increment: "dist is the left inverse of add, unconditionally"
  - NOT_transitive: "see coverage.transitivity_of_lt. This is a guarantee only in the sense that it is proved FALSE and recorded, so no consumer may assume it"
  - terminates: "every operation is a constant-time expression; no loop, no fuel argument, and no failure path in either the Rust or the extraction"

specification:
  - challenge: FramedChannelChallenge.SeqNum
    covers: "the eleven registered core statements: the two single-variable decided facts, the distance and increment facts, both spellings of §3.2's comparison and their agreement, the two iterate facts, guarded totality, translation invariance and the SerialLaws instance. It restates NO transitivity statement, because there is none to restate"
  - challenge: FramedChannelAeneasChallenge.SeqNum
    covers: "the eight registered bridge statements: the extracted HALF const, the constructor and accessor agreements, the four operation refinements and SerialLaws at the extracted carrier"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and candidates_sha256"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"
  selected: "all seven non-derived in-subset candidates of this unit -- framed_channel.seq_num.HALF and the six SeqNum functions. HALF is SELECTED rather than declined, and that is the point of listing it: the extraction emits a pub const as its own candidate, so a unit that bridged only its functions would leave one in-subset candidate with nothing specifying it and fail the gate's selection-reach stage. The four #[derive] trait impls (Clone, Eq, PartialEq, Debug) are declined on the standing reason: no behavioral claim is made about them"

proofs:
  - name: FramedChannel.SeqNum.lt_irrefl
    status: "[PROVED: kernel]"
    role: "irreflexivity, decided over all 65536 cases"
  - name: FramedChannel.SeqNum.lt_succ
    status: "[PROVED: kernel]"
    role: "the successor is always serially after, decided over all 65536 cases"
  - name: FramedChannel.SeqNum.lt_add
    status: "[PROVED: kernel]"
    role: "RFC 1982 §3.1's claim: a positive increment below half the space lands strictly after"
  - name: FramedChannel.SeqNum.lt_eq_ltRFC
    status: "[PROVED: compiler-trusting]"
    role: "the RFC's two-case formula and the distance test agree on all 2 ^ 32 pairs -- the bv_decide row, registered verified := false and declared flagged in certificate/policy.txt"
  - name: FramedChannel.SeqNum.lt_eq_ltRFC_kernel
    status: "[PROVED: kernel]"
    role: "kernel replay of the row above, through BitVec.toNat and omega, with no SAT call and no compiler-trusting axiom; registered BESIDE it, not in place of it"
  - name: FramedChannel.SeqNum.iter_ne_of_pos_lt
    status: "[PROVED: kernel]"
    role: "minimality of the cycle: fewer than space successor steps never return to the start"
  - name: FramedChannel.SeqNum.dist_add
    status: "[PROVED: kernel]"
    role: "the forward distance recovers the increment: dist is the left inverse of add"
  - name: FramedChannel.SeqNum.iter_space
    status: "[PROVED: kernel]"
    role: "the space closes: space successor steps return to where they started"
  - name: FramedChannel.SeqNum.lt_total_of_defined
    status: "[PROVED: kernel]"
    role: "totality on the defined region only; the defined hypothesis is refuted as necessary by lt_total_cand"
  - name: FramedChannel.SeqNum.lt_translation_invariant
    status: "[PROVED: kernel]"
    role: "advancing both arguments leaves the comparison unchanged; answers the §3.2 passage about the definition the RFC rejected"
  - name: FramedChannel.SeqNum.instSerialLaws
    status: "[PROVED: kernel]"
    role: "refinement certificate as an interface instance: the canonical 16-bit model satisfies the four serial laws"
  - name: FramedChannel.Bridge.seq_num.HALF_val
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted HALF const is 2 ^ 15; the const is its own selection candidate and this is the statement about it"
  - name: FramedChannel.Bridge.seq_num.new_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted constructor stores exactly the word it is given; failure freedom included"
  - name: FramedChannel.Bridge.seq_num.get_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted accessor returns exactly the stored word, so new and get are inverse"
  - name: FramedChannel.Bridge.seq_num.succ_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted succ is the model's succ under the abstraction, wraparound included, with no hypothesis"
  - name: FramedChannel.Bridge.seq_num.add_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted add is the model's add at every increment, with no range hypothesis"
  - name: FramedChannel.Bridge.seq_num.dist_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted dist is the model's forward modular distance"
  - name: FramedChannel.Bridge.seq_num.lt_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted zero-test-then-compare agrees with the model's conjunction on every pair; both branches by omega, no bv_decide"
  - name: FramedChannel.Bridge.seq_num.instSerialLaws_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "SerialLaws as an interface instance on the extracted carrier seq_num.SeqNum itself"

