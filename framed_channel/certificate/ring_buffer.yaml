# Certificate manifest for RingBuffer.push. Every claim line carries one of the fixed honesty
# tags; see README.md in this directory for the tag vocabulary. Generated values (axiom lines,
# digests, the certificate identity) are read from axioms.txt and digests.txt, which check.sh
# regenerates.

component: RingBuffer

source:
  file: rust/src/ring_buffer.rs
  symbol: RingBuffer::push
  status: "[AUTHORED: nix-tested]"
  digest: "see digests.txt (sha256, regenerated by check.sh)"

formal_model:
  extractor: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction, one whole-crate `charon cargo --preset=aeneas` run, then `aeneas -backend lean -split-files -all-computable`; run by refresh-extraction.sh, output aeneas/FramedChannelAeneas/Extracted/{Types,Funs}.lean (generated, never hand-edited; check.sh fails on a stale copy), importing the hand-written Extracted/FunsExternal.lean (crate-local trusted library models; none is reached by the ring buffer)"
  status: "[EXTRACTED: aeneas + bridge]"
  declaration: FramedChannel.RingBuffer.push
  module: "lean/FramedChannel/Model/RingBuffer/Defs.lean (definitions, with the shared-proof pair push_inv and pop_inv) and lean/FramedChannel/Model/RingBuffer/Theorems.lean (theorems)"
  representation: "List-backed Vec, Result monad, Nat indices (hand-written model; connected to the extraction by the bridge below)"
  extracted_declaration: framed_channel.ring_buffer.RingBuffer.push
  extracted_representation: "alloc.vec.Vec, Std.Usize fields, Aeneas Result monad, Default/Clone trait records"

bridge:
  module: aeneas/FramedChannelAeneas/Bridge/RingBuffer/Refinement.lean
  abstraction: "FramedChannel.Bridge.ring_buffer.toModel (aeneas/FramedChannelAeneas/Bridge/RingBuffer/Defs.lean): Vec to its List, each Usize to its Nat value"
  simulation: "FramedChannel.Bridge.ring_buffer.sim: the extracted BoundedQueue record instance simulates FramedChannel.RingBuffer.BQ through toModel s = q.1 (FramedChannel.Bridge.QueueSim, aeneas/FramedChannelAeneas/Bridge/Queue/Defs.lean), so the six generic transport theorems give every BoundedQueueLaws law at the extracted code"
  instance: "FramedChannel.Bridge.ring_buffer.instBoundedQueueLaws_extracted (aeneas/FramedChannelAeneas/Bridge/RingBuffer/Instance.lean): the six laws as an interface instance whose carrier is the extracted ring buffer, from sim through the generic FramedChannel.Bridge.QueueSim.boundedQueueLaws"
  status: "[EXTRACTED: aeneas + bridge]"
  package: "aeneas/ (Lake package requiring Aeneas pinned by `aeneas/lake-manifest.json` and ../lean by path, on the same toolchain; required by the gate; about 7 GB of dependencies)"
  reading: "the extracted push and pop refine the hand-written model under Inv, and so satisfy the queue laws the BQ instance states; the extracted capacity, is_full and is_empty compute the model's"

implements:
  interface_L0: FramedChannel.QueueModel
  interface_L1: FramedChannel.BoundedQueueLaws
  instance: FramedChannel.RingBuffer.instBoundedQueueLaws
  abstraction: FramedChannel.RingBuffer.contents
  invariant: FramedChannel.RingBuffer.Inv
  carrier: "FramedChannel.RingBuffer.BQ (the Inv subtype)"
  operations: "QueueModel fields push, pop, toList (= contents), full, empty, capacity (= buf.length)"
  laws: "six: push_law, pop_law, full_law, empty_law, not_full_of_lt, push_capacity"
  extracted_instance: FramedChannel.Bridge.ring_buffer.instBoundedQueueLaws_extracted
  extracted_carrier: "FramedChannel.Bridge.ring_buffer.ExtractedRB: FramedChannel.Bridge.Ext at the extracted BoundedQueue record and the relation toModel s = q.1, i.e. extracted ring buffers whose abstraction satisfies Inv (carrier_iff_inv); its push, pop, full, empty and capacity are the extracted functions lowered through Result.match, and toList reads the related BQ value. Built once for every queue by FramedChannel.Bridge.QueueSim.boundedQueueLaws (aeneas/FramedChannelAeneas/Bridge/Queue/Instance.lean); the second extracted instance of the same interface is in vec_queue.yaml"
  rust_counterpart: "rust/src/queue.rs's BoundedQueue<T> trait (the executable counterpart of QueueModel/BoundedQueueLaws), implemented by rust/src/ring_buffer.rs's RingBuffer<T>; exercised generically by the check_bounded_queue_laws harness in rust/tests/differential.rs, run at RingBuffer<u32> and VecQueue<u32>"

assumptions:
  - "FramedChannel.RingBuffer.Inv r"
  - "not (FramedChannel.RingBuffer.full r)"
  - "bridge only: the Clone record returns its argument unchanged (FramedChannel.Bridge.CloneIsId; true for u32 and the derived Clone of Frame), assumed on get_spec, pop_refines, pop_law_extracted, sim and instBoundedQueueLaws_extracted; the Default record is arbitrary"

guarantees:
  - preserves_representation_invariant
  - refines_bounded_queue_push
  - error_agreement_on_full
  - push_keeps_occupancy_inside_the_backing_store
  - terminates: "structurally (no loop)"

specification:
  # The approved, statement-only Challenge modules this manifest's proofs: are checked against
  # (check.sh's specification consistency stage: same names, same statement hashes). Each is
  # an approval unit: approved with approve.sh (by a person or a declared agent; approvals.yaml
  # records which), and check.sh's approvals stage fails
  # when its recorded spec_digest in approvals.yaml is not today's.
  - challenge: FramedChannelChallenge.RingBuffer
    covers: "the model statements (push/pop error agreement, invariant preservation, refinement, bounds, the BoundedQueueLaws instance); push_inv and pop_inv are the shared-proof rows, imported proved from Model/RingBuffer/Defs.lean"
  - challenge: FramedChannelAeneasChallenge.RingBuffer
    covers: "the extracted ring buffer: refinements, agreement, sim and the instance on the extracted carrier"
  - challenge: FramedChannelAeneasChallenge.Queue
    covers: "the generic queue transport theorems and QueueSim.boundedQueueLaws this manifest certifies"

selection:
  record: "certificate/approvals.yaml, key selection: the extracted items selected from
    certificate/candidates.txt (generated by refresh-candidates.sh), bound to source_sha256 and
    candidates_sha256; check.sh's approvals stage fails when either digest changed or the selected
    set is not exactly the in-subset candidates the registered statements reach"
  approval_verdict: trusted
  approval_reason: "a judgement of scope, recorded with who made it (by: person or agent); its currency is machine-checked"

proofs:
  - name: FramedChannel.RingBuffer.push_ok
    status: "[PROVED: kernel]"
  - name: FramedChannel.RingBuffer.push_fail
    status: "[PROVED: kernel]"
  - name: FramedChannel.RingBuffer.push_inv
    status: "[PROVED: kernel]"
  - name: FramedChannel.RingBuffer.push_contents
    status: "[PROVED: kernel]"
  - name: FramedChannel.RingBuffer.push_spec
    status: "[PROVED: kernel]"
  - name: FramedChannel.RingBuffer.idx_ne
    status: "[PROVED: kernel]"
    role: "lemma node (modular index arithmetic)"
  - name: FramedChannel.RingBuffer.push_bounded
    status: "[PROVED: kernel]"
    role: "bounds: push leaves buf.length unchanged and len within it"
  - name: FramedChannel.RingBuffer.instBoundedQueueLaws
    status: "[PROVED: kernel]"
    role: "refinement certificate as an interface instance"
  - name: FramedChannel.Bridge.ring_buffer.push_full
    status: "[EXTRACTED: aeneas + bridge]"
    role: "error agreement: on a full buffer the extracted push returns Err(Full), buffer unchanged"
  - name: FramedChannel.Bridge.ring_buffer.push_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted push refines FramedChannel.RingBuffer.push under Inv"
  - name: FramedChannel.Bridge.ring_buffer.push_law_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "push_spec transported: the extracted push preserves Inv and appends to contents"
  - name: FramedChannel.Bridge.ring_buffer.pop_empty
    status: "[EXTRACTED: aeneas + bridge]"
    role: "error agreement: on an empty buffer the extracted pop returns None, buffer unchanged"
  - name: FramedChannel.Bridge.ring_buffer.pop_refines
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted pop refines FramedChannel.RingBuffer.pop under Inv"
  - name: FramedChannel.Bridge.ring_buffer.pop_law_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "pop_spec transported: the extracted pop preserves Inv and removes the front of contents"
  - name: FramedChannel.Bridge.ring_buffer.capacity_agrees
    status: "[EXTRACTED: aeneas + bridge]"
  - name: FramedChannel.Bridge.ring_buffer.len_agrees
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted len is the model's item count; the len field of sim"
  - name: FramedChannel.Bridge.ring_buffer.is_full_agrees
    status: "[EXTRACTED: aeneas + bridge]"
  - name: FramedChannel.Bridge.ring_buffer.is_empty_agrees
    status: "[EXTRACTED: aeneas + bridge]"
  - name: FramedChannel.Bridge.ring_buffer.sim
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted BoundedQueue record simulates the BQ model (QueueSim), assuming CloneIsId"
  - name: FramedChannel.Bridge.push_law_of_sim
    status: "[PROVED: kernel]"
    role: "generic transport: push_law holds at any simulating extracted record"
  - name: FramedChannel.Bridge.pop_law_of_sim
    status: "[PROVED: kernel]"
    role: "generic transport: pop_law holds at any simulating extracted record"
  - name: FramedChannel.Bridge.full_law_of_sim
    status: "[PROVED: kernel]"
    role: "generic transport: full_law holds at any simulating extracted record"
  - name: FramedChannel.Bridge.empty_law_of_sim
    status: "[PROVED: kernel]"
    role: "generic transport: empty_law holds at any simulating extracted record"
  - name: FramedChannel.Bridge.not_full_of_lt_of_sim
    status: "[PROVED: kernel]"
    role: "generic transport: not_full_of_lt holds at any simulating extracted record"
  - name: FramedChannel.Bridge.push_capacity_of_sim
    status: "[PROVED: kernel]"
    role: "generic transport: push_capacity holds at any simulating extracted record"
  - name: FramedChannel.Bridge.QueueSim.boundedQueueLaws
    status: "[EXTRACTED: aeneas + bridge]"
    role: "generic instance: any simulating extracted record, with a functional relation, satisfies all six BoundedQueueLaws on its extracted carrier Ext, each law derived from its transport theorem"
  - name: FramedChannel.Bridge.ring_buffer.instBoundedQueueLaws_extracted
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the refinement certificate as an interface instance on the extracted carrier: BoundedQueueLaws (ExtractedRB a dflt cln) a, assuming CloneIsId (stated once, here)"
  - name: FramedChannel.RingBuffer.pop_ok
    status: "[PROVED: kernel]"
    role: "error agreement: pop on a non-empty buffer succeeds"
  - name: FramedChannel.RingBuffer.pop_fail
    status: "[PROVED: kernel]"
    role: "error agreement: pop on an empty buffer fails"
  - name: FramedChannel.RingBuffer.pop_inv
    status: "[PROVED: kernel]"
    role: "Inv preserved by pop (by the inv_preserve seed tactic)"
  - name: FramedChannel.RingBuffer.pop_contents
    status: "[PROVED: kernel]"
    role: "refinement: contents = x :: contents after pop"
  - name: FramedChannel.RingBuffer.pop_spec
    status: "[PROVED: kernel]"
    role: "the step-shaped pop postcondition: success, Inv and x :: contents together"

