  - name: FramedChannel.Bridge.extToList_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the Ext carrier's toList is the related model state's, given a functional relation"
  - name: FramedChannel.Bridge.extFull_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered extracted is_full is the related model state's full"
  - name: FramedChannel.Bridge.extEmpty_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered extracted is_empty is the related model state's empty"
  - name: FramedChannel.Bridge.extCapacity_eq
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the lowered extracted capacity is the related model state's capacity"
  - name: FramedChannel.Bridge.extPush_of_full
    status: "[EXTRACTED: aeneas + bridge]"
    role: "on a full Ext state the lowered extracted push refuses; used for full_law and push_capacity"
  - name: FramedChannel.Bridge.ring_buffer.carrier_iff_inv
    status: "[EXTRACTED: aeneas + bridge]"
    role: "the ExtractedRB carrier condition is exactly Inv on the abstraction"
  - name: FramedChannel.Bridge.ring_buffer.rel_functional
