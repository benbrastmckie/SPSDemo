    status: "[EXTRACTED: aeneas + bridge]"
    role: "the extracted RingBuffer::with_capacity satisfies Inv, is empty, capacity max cap 1"
  - name: FramedChannel.Bridge.ring_buffer.set_opt_some
    status: "[EXTRACTED: aeneas + bridge]"
    role: "list lemma behind set_spec"
  - name: FramedChannel.Bridge.ring_buffer.set_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "Aeneas step spec for the extracted set, used by step* in push_refines"
  - name: FramedChannel.Bridge.ring_buffer.get_spec
    status: "[EXTRACTED: aeneas + bridge]"
    role: "Aeneas step spec for the extracted get, used by step* in pop_refines (assumes CloneIsId)"
  - name: FramedChannel.Bridge.ring_buffer.pushBQ_of_push
    status: "[EXTRACTED: aeneas + bridge]"
    role: "lifts a model push result to the BQ operation; used by sim"
  - name: FramedChannel.Bridge.ring_buffer.popBQ_of_pop
    status: "[EXTRACTED: aeneas + bridge]"
    role: "lifts a model pop result to the BQ operation; used by sim"
  - name: FramedChannel.Bridge.cln_isId
    status: "[EXTRACTED: aeneas + bridge]"
