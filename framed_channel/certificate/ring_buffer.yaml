dependencies:
  - "Nat.mod_add_mod, Nat.sub_mod_eq_zero_of_mod_eq, Nat.mod_eq_of_lt, Nat.lt_of_le_of_ne (Lean core)"
  - "List.getElem?_set_ne, List.getElem?_set_self, List.range_succ, List.length_set (Lean core)"
  - "FramedChannel.RingBuffer.idx_ne (this crate; lemma node)"
  - "no Mathlib in lean/: every premise above resolves from core Lean"
  - "bridge only: the Aeneas Lean library pinned by `aeneas/lake-manifest.json` (WP.spec_mono, step*, Vec/Slice lemmas), which requires the Mathlib version aeneas/lake-manifest.json pins"

toolchain:
  shared: certificate/shared.yaml
  mathlib: "none in lean/ (core Lean and the bundled Std); Mathlib, pinned by `aeneas/lake-manifest.json`, in the aeneas/ bridge package only"
  build: "cd lean && lake build -- no environment variables, no network; the bridge: cd aeneas && lake exe cache get && lake build (network, about 7 GB)"
  extraction: "aeneas-revs.sh (run by check.sh and refresh-extraction.sh) fails when the pin files, the aeneas binary on PATH, or the two lean-toolchain files disagree"

coverage:
  L0_interface: proved
  L1_laws_over_an_abstract_observation: proved
  canonical_model: proved
  representation_invariant: proved
  abstraction_function_and_refinement: proved
  error_agreement: proved
  bounds_or_failure_freedom: proved
  registry_row_bound_to_the_statement_hash: proved
  certificate_with_provenance_and_trust: proved
  differential_test: validated
  semantic_validation_of_the_generated_representation: "proved, over the generated
    representation: the charon/aeneas extraction of rust/src/ring_buffer.rs is itself the
    generated representation, and the bridge refinement theorems push_full, push_refines,
    pop_empty and pop_refines prove it refines the hand-written model under Inv;
    sim assembles them into a QueueSim, and the generic transport theorems
    push_law_of_sim, pop_law_of_sim, full_law_of_sim, empty_law_of_sim, not_full_of_lt_of_sim and
    push_capacity_of_sim carry every bounded-queue law to the extracted record."
  extraction_bridge: proved
  ladder: "13 core rows (certificate/ladder.txt): simp -- push_ok, push_fail, pop_ok,
    pop_fail; grind -- push_bounded; manual -- push_contents, pop_contents, idx_ne, push_spec,
    pop_spec; manual, recorded after the fact because the proofs sit in the approved definitions
    layer -- push_inv, pop_inv (non-retrieval rungs audited); instance -- instBoundedQueueLaws. The
    bridge rows are not laddered."

trust:
  G0_checker:
    verdict: trusted
    evidence: "axioms.txt: push_ok, push_inv, push_contents, push_spec, push_bounded, idx_ne on [propext, Quot.sound]; push_fail on [propext, Classical.choice, Quot.sound]; no sorryAx, no compiler-trusting axiom. check.sh fails the run otherwise."
    status: "[PROVED: kernel]"
    independent_recheck:
      shared: certificate/shared.yaml
  G1_translation:
    verdict: trusted
    evidence: "Charon and Aeneas at the revisions pinned by `../nix/aeneas-pin.json` (and `../flake.lock`, `aeneas/lake-manifest.json`); `certificate/candidates.txt` records the charon version that produced the committed extraction translate the whole crate, rust/src/ring_buffer.rs included, to aeneas/FramedChannelAeneas/Extracted/; the bridge proves that output refines the hand-written model, so the extractor, not a hand transcription, performs the translation step"
    validation: "validated on 56 recorded inputs (ring_buffer_agrees_with_extracted_vectors in rust/tests/differential.rs, against certificate/vectors.txt as aeneas/GenVectors.lean computed it by evaluating the Charon/Aeneas extraction): on every one, the pinned rustc debug build and the Lean evaluation of the translation of the same source agree on the push result, the pop result, contents, is_empty, is_full, len and capacity, read through the extracted BoundedQueue record at u32. That is direct evidence against a translation fault on those inputs; with the bridge theorems it also gives model-to-Rust agreement on them, which is why no second, hand-model vector source is kept. It does NOT establish: anything on inputs no record carries, or on paths none reaches (Vec growth near usize::MAX, where Aeneas bounds a Vec by Usize.max and Rust panics at isize::MAX bytes); release-profile arithmetic (the extraction models integer overflow as a panic, the debug profile cargo test runs; a release build wraps); the compiled binary's codegen beyond these runs; or the correctness of the Lean interpreter that computed the vectors (lake env lean --run evaluates the extracted definitions; the extracted loop is a partial_fixpoint, evaluated, never kernel-reduced)."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[EXTRACTED: aeneas + bridge]"
  G2_ir_faithfulness:
    verdict: trusted
    evidence: "rustc MIR and Charon are exercised at a pinned revision, but the faithfulness of MIR and of Charon's LLBC to Rust semantics is not established here"
    validation: "validated, not verified: the same 56 inputs are the only evidence about rustc MIR and Charon's LLBC here -- the Rust compiled by rustc and the Lean evaluation of the Aeneas translation of Charon's output agree on them. Their faithfulness to Rust semantics on any other input is not established."
    validation_status: "[AUTHORED: nix-tested]"
    status: "[NOT CLAIMED]"
  G3_models:
    verdict: trusted
    evidence: "in the hand-written model, Vec is a List with getD/set; in the extraction, Aeneas's own alloc.vec.Vec and Std.Usize library models, trusted as shipped, at the revision `aeneas/lake-manifest.json` pins. The five crate-local models in Extracted/FunsExternal.lean (Option's Try::branch and FromResidual::from_residual, <[T]>::split_first, Vec::remove, Default for Vec) are trusted the same way, each a definition with a proved spec; the ring buffer's extracted operations reach none of them"
    status: "[EXTRACTED: aeneas + bridge]"
  G4_specification:
    verdict: validated
    evidence: "the specification half is proved, and sim proves the extraction refines the model, so on the recorded inputs the model's behavior is the extraction's; ring_buffer_agrees_with_extracted_vectors (56 inputs: both branches of push and of pop over traces at capacities 1 and 3 that fill past full, drain past empty and wrap around, and the zero requested capacity the extracted with_capacity rounds up to one) ties that behavior to the compiled Rust. The Rust-against-Rust scenarios (VecDeque oracle 23 inputs, the generic check_bounded_queue_laws harness 34 inputs, wraparound-while-full 63 inputs, zero_capacity_differs_as_recorded 2 inputs) validate the Rust half beside it. Per-scenario input counts and the seed record are printed by cargo test -- --nocapture. Finite fixed vectors: testing, not proof, which is why the verdict is validated and not verified."
    approval: "the Challenge modules under specification: above are approved in approvals.yaml,
      which records whether a person or an agent approved each; that these statements say what the
      component should do is a judgement, never verified"
    approval_verdict: trusted
    status: "[AUTHORED: nix-tested]"
  G5_binding:
    verdict: verified
    evidence: "sha256 of every Rust source, Lean module, and build-defining file in digests.txt, computed by check.sh; each registry row is bound to the elaborated statement hash, not to the theorem name, so a silently weakened theorem fails the build; and the recorded approvals are current: check.sh's approvals stage checks each
      listed Challenge module's spec_digest (SpecCheck's closure digest, 64-bit and toolchain-bound)
      and the selection's source_sha256 and candidates_sha256 against approvals.yaml"
    status: "[PROVED: kernel]"

not_claimed:
  - "the compiled binary (no rustc here; no claim about codegen)"
  - "concurrent use of push/pop (the model is sequential)"
  - "the box G grade of the invariant (an inductive invariant is claimed; not necessity)"
  - "the bridge at an arbitrary Clone impl: it assumes CloneIsId (clone returns its argument)"
  - "concurrent use of the extracted code (the extraction and the bridge are sequential)"
  - "the extracted contents loop: not bridged (the model's contents is the abstraction instead); with_capacity is bridged separately by with_capacity_rel (listed in this manifest), not as a QueueSim field"
  - "rustc MIR or Charon faithfulness to Rust semantics (G2)"
